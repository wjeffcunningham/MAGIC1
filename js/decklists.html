<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Decklists · BCWL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">
  <script type="module" src="/js/global-menu-loader.js"></script>

  <div class="max-w-4xl mx-auto px-4 py-10 space-y-6">
    <h1 class="text-2xl font-bold">Decklists</h1>

    <section class="bg-white p-5 rounded-xl shadow">
      <h2 class="text-xl font-semibold mb-3">Submit Decklist</h2>
      <form id="deck-form" class="space-y-3 text-sm">
        <div>
          <label class="block mb-1 font-medium">Event</label>
          <select id="deck-event" name="event_id"
                  class="w-full border px-3 py-2 rounded">
            <option value="">(None / League)</option>
          </select>
        </div>

        <div>
          <label class="block mb-1 font-medium">Title</label>
          <input type="text" name="title"
                 class="w-full border px-3 py-2 rounded"
                 placeholder="e.g. UW Standstill, Goblins, The Rock" required />
        </div>

        <div>
          <label class="block mb-1 font-medium">Archetype (optional)</label>
          <input type="text" name="archetype"
                 class="w-full border px-3 py-2 rounded"
                 placeholder="e.g. UW Landstill" />
        </div>

        <div>
          <label class="block mb-1 font-medium">
            List URL (optional, e.g. Moxfield)
          </label>
          <input type="url" name="list_url"
                 class="w-full border px-3 py-2 rounded"
                 placeholder="https://www.moxfield.com/decks/..." />
        </div>

        <div>
          <label class="block mb-1 font-medium">Mainboard (one per line)</label>
          <textarea name="mainboard"
                    class="w-full border px-3 py-2 rounded min-h-[100px]"
                    placeholder="4 Brainstorm
4 Counterspell
..."></textarea>
        </div>

        <div>
          <label class="block mb-1 font-medium">Sideboard (one per line)</label>
          <textarea name="sideboard"
                    class="w-full border px-3 py-2 rounded min-h-[80px]"
                    placeholder="3 Red Elemental Blast
2 Tormod's Crypt
..."></textarea>
        </div>

        <button class="bg-sky-600 text-white px-4 py-2 rounded">
          Submit Decklist
        </button>

        <p id="deck-error" class="text-sm text-red-600 hidden mt-2"></p>
        <p id="deck-success" class="text-sm text-emerald-700 hidden mt-2"></p>
      </form>
    </section>

    <section class="bg-white p-5 rounded-xl shadow">
      <h2 class="text-xl font-semibold mb-3">My Decklists</h2>
      <div id="decklist-list" class="space-y-3 text-sm">
        Loading…
      </div>
    </section>
  </div>

  <script type="module" src="/js/decklists.js"></script>
</body>
</html>
