<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Players · BCWL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">
  <script type="module" src="/js/global-menu-loader.js"></script>

  <div class="max-w-4xl mx-auto px-4 py-10 space-y-6">
    <h1 class="text-2xl font-bold">Player Directory</h1>

    <form id="player-search-form" class="flex gap-2 text-sm">
      <input type="text" id="player-query" class="flex-1 border px-3 py-2 rounded"
             placeholder="Search by name or username…" />
      <button class="bg-slate-800 text-white px-4 py-2 rounded">
        Search
      </button>
    </form>

    <div id="player-results" class="space-y-3 text-sm"></div>
    <p id="player-error" class="text-sm text-red-600 hidden"></p>
  </div>

  <script type="module" src="/js/players.js"></script>
</body>
</html>
