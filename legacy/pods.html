<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pods · BCWL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">

  <!-- GLOBAL MENU FOR LOGGED-IN USERS -->
  <script type="module" src="/js/global-menu-loader.js"></script>

  <div class="max-w-3xl mx-auto px-4 py-10 space-y-6">

    <h1 class="text-2xl font-bold text-center">BCWL Pods</h1>

    <p class="text-sm text-slate-600 text-center">
      Pods for the currently selected league month.
    </p>

    <!-- Month selector -->
    <div>
      <label class="block text-sm mb-1 font-medium">Select Month</label>
      <select id="month-select"
              class="w-full border rounded px-3 py-2 bg-white text-sm">
      </select>
    </div>

    <!-- Pods container -->
    <div id="pods-container" class="space-y-6">
      <!-- Filled by JS -->
    </div>

    <p id="pods-error" class="text-red-600 hidden text-sm"></p>

  </div>

  <script type="module" src="/js/pods-public.js"></script>
</body>
</html>
