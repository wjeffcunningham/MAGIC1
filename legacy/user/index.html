<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Panel · B.C. Premodern Masters</title>

  <link rel="icon" type="image/svg+xml" href="../assets/magic1.svg" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    #menu-icon {
      position: fixed;
      top: 20px;
      right: 20px;
      width: min(14vw, 90px);
      height: min(14vw, 90px);
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
      z-index: 2000;
    }

    #menu-icon img {
      width: 100%;
      height: 100%;
      display: block;
    }

    #menu-panel {
      position: fixed;
      top: 110px;
      right: 20px;
      width: 220px;
      background: white;
      border: 2px solid black;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: none;
      z-index: 1999;

      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      text-align: left;
    }

    #menu-panel.open {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .menu-link {
      display: block;
      padding: 6px 0;
      font-size: 0.92rem;
      text-decoration: none;
      color: black;
    }

    .menu-link:hover {
      text-decoration: underline;
    }

    .menu-section-title {
      font-weight: 600;
      margin: 8px 0 4px;
      font-size: 0.9rem;
      border-bottom: 1px solid #eee;
      padding-bottom: 3px;
    }

    .user-wrapper {
      max-width: 900px;
      margin: 80px auto 40px;
      padding: 0 16px;
      text-align: center;
    }

    .user-title {
      font-size: 2em;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 0.5em;
      border-bottom: 3px double #000;
      display: inline-block;
      padding-bottom: 0.15em;
    }

    .user-subtitle {
      font-size: 1.05em;
      margin-bottom: 1.8em;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    @media (max-width: 800px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }

    .user-card {
      border: 2px solid #000;
      border-radius: 12px;
      padding: 16px 18px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      background: #fff;
    }

    .user-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    }

    .user-card h2 {
      font-size: 1.2em;
      margin: 0 0 0.4em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .user-card p {
      font-size: 0.95em;
      margin: 0.2em 0;
      line-height: 1.4;
    }

    .user-card a {
      text-decoration: none;
      color: inherit;
      display: block;
    }
  </style>
</head>

<body>

  <!-- Reuse the same menu icon + panel -->
  <button id="menu-icon" aria-label="Open menu">
    <img src="/assets/magic1.svg" alt="B.C. Premodern Masters menu" />
  </button>

  <div id="menu-panel" aria-hidden="true"></div>

  <div class="user-wrapper">
    <div class="user-title">User Panel</div>
    <div class="user-subtitle">
      Quick access to your profile, league info, and matches.
    </div>

    <div class="card-grid">
      <!-- Profile card -->
      <div class="user-card">
        <a href="/user/profile.html">
          <h2>Player Profile</h2>
          <p>View or edit your player details and preferences.</p>
        </a>
      </div>

      <!-- League card -->
      <div class="user-card">
        <a href="/league/index.html">
          <h2>League</h2>
          <p>Jump to league home for standings, schedule, and results.</p>
        </a>
      </div>

      <!-- Matches card -->
      <div class="user-card">
        <a href="/my-matches.html">
          <h2>Matches &amp; Reporting</h2>
          <p>See your matches and report results for the Winter League.</p>
        </a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/menu.js"></script>
</body>
</html>
