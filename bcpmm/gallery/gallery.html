<title>BCPMM Photo & Video Gallery · B.C. Premodern Masters</title>

<style>
:root{
  --bg:#f3f6ff;
  --card:#ffffff;
  --ink:#0f172a;
  --muted:#475569;
  --border:rgba(15,23,42,.14);
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --radius:16px;
  --max:1100px;
  --pad:18px;
  --accent:#1f6feb;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:linear-gradient(var(--bg),#ffffff 65%);
}

.shell{
  max-width:var(--max);
  margin:28px auto 56px;
  padding:0 var(--pad);
}

header{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:24px;
}

h1{
  margin:0 0 6px;
  font-size:clamp(1.4rem,2.8vw,2rem);
}

.sub{
  color:var(--muted);
}

.nav{
  margin-top:10px;
}

.nav a{
  margin-right:14px;
  color:var(--accent);
  font-weight:650;
  text-decoration:none;
}

.section{
  margin-bottom:36px;
}

.section h2{
  margin:0 0 14px;
  font-size:1.25rem;
  letter-spacing:-.01em;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

figure{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px;
  box-shadow:var(--shadow);
  display:grid;
  gap:8px;
}

figure a{
  display:block;
}

figure img,
figure video{
  width:100%;
  height:auto;
  border-radius:10px;
  display:block;
  background:#e5e7eb;
}

figure a:hover img{
  outline:2px solid var(--accent);
}

figcaption{
  font-size:.85rem;
  color:var(--muted);
  text-align:center;
}

/* =========================
   PLAY OF THE DAY FEATURE
========================= */

.play-of-day {
  text-align: center;
}

.play-of-day .featured {
  width: 33%;
  min-width: 260px;
  margin: 0 auto;
  padding: 16px;
  border-radius: 18px;
  background: var(--card);
  position: relative;
  border: 3px solid var(--accent);
  box-shadow:
    0 0 0 6px rgba(31,111,235,.08),
    0 12px 30px rgba(15,23,42,.15);
}

/* Decorative border using bbal6.gif */
.play-of-day .featured::before {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: 22px;
  background: url("bbal6.gif");
  background-size: cover;
  z-index: -1;
  opacity: .35;
  filter: contrast(110%) saturate(120%);
}

.play-of-day img {
  border-radius: 12px;
  display: block;
}

</style>
</head>
