<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BCPMM Photo Gallery · B.C. Premodern Masters</title>

  <style>
    :root{
      --bg:#f3f6ff;
      --card:#ffffff;
      --ink:#0f172a;
      --muted:#475569;
      --border:rgba(15,23,42,.14);
      --shadow:0 10px 30px rgba(15,23,42,.08);
      --radius:16px;
      --max:1100px;
      --pad:18px;
      --accent:#1f6feb;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--ink);
      background:linear-gradient(var(--bg),#ffffff 65%);
    }

    .shell{
      max-width:var(--max);
      margin:28px auto 56px;
      padding:0 var(--pad);
    }

    header{
      background:var(--card);
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      border-radius:var(--radius);
      padding:18px;
    }

    h1{
      margin:0 0 6px;
      font-size:clamp(1.4rem,2.8vw,2rem);
      letter-spacing:-.02em;
    }

    .sub{
      margin:0;
      color:var(--muted);
      line-height:1.45;
    }

    .meta{
      margin-top:10px;
      display:flex;
      gap:12px;
    }

    .meta a{
      color:var(--accent);
      font-weight:650;
      text-decoration:none;
    }

    main{
      margin-top:22px;
    }

    /* === Gallery grid === */
    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:16px;
    }

    figure.frame{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px;
      box-shadow:var(--shadow);
      display:grid;
      gap:8px;
    }

    figure.frame img{
      width:100%;
      height:auto;
      border-radius:10px;
      background:#e5e7eb;
      display:block;
    }

    figcaption{
      font-size:.85rem;
      color:var(--muted);
      text-align:center;
    }

    .footer{
      margin-top:32px;
      text-align:center;
      font-size:.9rem;
      color:var(--muted);
    }
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <h1>BCPMM Photo Gallery</h1>
      <p class="sub">
        On-the-ground photos from the B.C. Premodern Masters.
      </p>
      <div class="meta">
        <a href="BCPMM_coverage.html">← Tournament Coverage</a>
        <a href="../">magic1.ca</a>
      </div>
    </header>

    <main>
      <section class="gallery" id="gallery"></section>

      <div class="footer">
        © B.C. Premodern Masters
      </div>
    </main>
  </div>

  <script>
    /*
      AUTO JPG GALLERY (IMG_####.JPG)
      ------------------------------
      • gallery.html is in SAME folder as images
      • Images named like: IMG_6396.JPG
      • Case-sensitive
      • Missing numbers skipped silently
    */

    const START = 6000;   // lowest IMG_#### number to try
    const END   = 7000;   // highest IMG_#### number to try

    const gallery = document.getElementById("gallery");

    for(let i = START; i <= END; i++){
      const src = `IMG_${i}.JPG`;

      const img = new Image();
      img.src = src;
      img.loading = "lazy";
      img.alt = "BCPMM Photo Gallery";

      img.onerror = () => {}; // ignore missing files

      img.onload = () => {
        const frame = document.createElement("figure");
        frame.className = "frame";

        frame.appendChild(img);

        const cap = document.createElement("figcaption");
        cap.textContent = src;
        frame.appendChild(cap);

        gallery.appendChild(frame);
      };
    }
  </script>
</body>
</html>
