<title>BCPMM Photo & Video Gallery · B.C. Premodern Masters</title>

<style>
:root{
  --bg:#f3f6ff;
  --card:#ffffff;
  --ink:#0f172a;
  --muted:#475569;
  --border:rgba(15,23,42,.14);
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --radius:16px;
  --max:1100px;
  --pad:18px;
  --accent:#1f6feb;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:linear-gradient(var(--bg),#ffffff 65%);
}

.shell{
  max-width:var(--max);
  margin:28px auto 56px;
  padding:0 var(--pad);
}

header{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
}

h1{
  margin:0 0 6px;
  font-size:clamp(1.4rem,2.8vw,2rem);
}

.sub{ color:var(--muted); }

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

figure{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px;
  box-shadow:var(--shadow);
  display:grid;
  gap:8px;
}

figure a{ display:block; }

figure img,
figure video{
  width:100%;
  height:auto;
  border-radius:10px;
  display:block;
  background:#e5e7eb;
}

figure a:hover img{
  outline:2px solid var(--accent);
}

figcaption{
  font-size:.85rem;
  color:var(--muted);
  text-align:center;
}
</style>
</head>
