<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BCPMM Flyers & Posters · B.C. Premodern Masters</title>

<style>
:root{
  --bg:#f3f6ff;
  --card:#ffffff;
  --ink:#0f172a;
  --muted:#475569;
  --border:rgba(15,23,42,.14);
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --radius:16px;
  --max:1000px;
  --pad:18px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:linear-gradient(var(--bg),#ffffff 65%);
}

.shell{
  max-width:var(--max);
  margin:32px auto 56px;
  padding:0 var(--pad);
}

header{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:28px;
}

h1{
  margin:0 0 6px;
  font-size:clamp(1.4rem,2.6vw,2rem);
  letter-spacing:-.02em;
}

.sub{
  margin:0;
  color:var(--muted);
}

.nav{ margin-top:10px; }

.nav a{
  color:#1f6feb;
  font-weight:650;
  text-decoration:none;
}

/* ================================
   FEATURED OFFICIAL POSTER
================================ */
.featured{
  display:flex;
  justify-content:center;
  margin-bottom:48px;
}

.featured-figure{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
  max-width:700px;
  width:100%;
}

.featured-figure img{
  width:100%;
  height:auto;
  display:block;
  border-radius:12px;
}

.featured-figure figcaption{
  margin-top:14px;
  font-size:.9rem;
  color:var(--muted);
  text-align:center;
}

/* ================================
   GRID
================================ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:18px;
}

figure{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  box-shadow:var(--shadow);
  display:grid;
  gap:10px;
}

figure a{ display:block; }

figure img{
  width:100%;
  height:auto;
  border-radius:10px;
  display:block;
  background:#e5e7eb;
}

figcaption{
  font-size:.85rem;
  color:var(--muted);
  text-align:center;
}

/* ================================
   QUARTER-PAGE FLYER CAROUSEL
================================ */
.flyer-frame{
  height:320px;              /* fixed, uniform size */
  padding:16px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.flyer-frame img{
  max-height:100%;
  max-width:100%;
  object-fit:contain;
  mix-blend-mode:multiply;
}

.footer{
  margin-top:40px;
  text-align:center;
  font-size:.9rem;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="shell">

<header>
  <h1>BCPMM Flyers & Posters</h1>
  <p class="sub">
    Promotional artwork and print material for the B.C. Premodern Masters.
  </p>
  <div class="nav">
    <a href="../../">magic1.ca</a>
  </div>
</header>

<!-- FEATURED OFFICIAL FLYER -->
<section class="featured">
  <figure class="featured-figure">
    <a href="BCPMM_poster.jpg" target="_blank" rel="noopener">
      <img src="BCPMM_poster.jpg" alt="BCPMM Official Flyer">
    </a>
    <figcaption>Official Tournament Flyer</figcaption>
  </figure>
</section>

<!-- ARCHIVE GRID -->
<section class="grid">

  <!-- QUARTER-PAGE FLYERS (CYCLING) -->
  <figure>
    <div class="flyer-frame" id="flyer-frame">
      <img
        id="flyer-img"
        src="BCPMM(front)1.png"
        alt="BCPMM Quarter-Page Flyers">
    </div>
    <figcaption>Quarter-Page Flyers (click to cycle)</figcaption>
  </figure>

  <figure>
    <a href="webBCPMM.png" target="_blank" rel="noopener">
      <img src="webBCPMM.png" alt="">
    </a>
    <figcaption>Web Poster (BCPMM)</figcaption>
  </figure>

  <figure>
    <a href="webBCWL.png" target="_blank" rel="noopener">
      <img src="webBCWL.png" alt="">
    </a>
    <figcaption>Web Poster (BCWL)</figcaption>
  </figure>

  <figure>
    <a href="prizeboosters.jpg" target="_blank" rel="noopener">
      <img src="prizeboosters.jpg" alt="">
    </a>
    <figcaption>Prize Boosters</figcaption>
  </figure>

</section>

<div class="footer">
  © B.C. Premodern Masters · Flyers Archive
</div>

</div>

<script>
/* ---------------------------------
   QUARTER-PAGE FLYER CAROUSEL
-----------------------------------*/
(() => {
  const images = [
    "BCPMM(front)1.png",
    "BCPMM(front)2.png",
    "BCPMM(front)3.png",
    "BCPMM(front)4.png"
  ];

  let idx = 0;
  const img = document.getElementById("flyer-img");
  const frame = document.getElementById("flyer-frame");

  frame.addEventListener("click", () => {
    idx = (idx + 1) % images.length;
    img.src = images[idx];
  });
})();

/* ---------------------------------
   RANDOM PASTEL "INK"
-----------------------------------*/
(() => {
  const pastels = [
    "#FFF3C4",
    "#E9F2FF",
    "#FCE8F0",
    "#EAF7EA"
  ];
  const frame = document.getElementById("flyer-frame");
  frame.style.background =
    pastels[Math.floor(Math.random() * pastels.length)];
})();
</script>

</body>
</html>
