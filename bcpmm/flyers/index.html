<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BCPMM Flyers & Posters · B.C. Premodern Masters</title>

<style>
:root{
  --bg:#f3f6ff;
  --card:#ffffff;
  --ink:#0f172a;
  --muted:#475569;
  --border:rgba(15,23,42,.14);
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --radius:16px;
  --max:1000px;
  --pad:18px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:linear-gradient(var(--bg),#ffffff 65%);
}

.shell{
  max-width:var(--max);
  margin:32px auto 56px;
  padding:0 var(--pad);
}

header{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:28px;
}

h1{
  margin:0 0 6px;
  font-size:clamp(1.4rem,2.6vw,2rem);
  letter-spacing:-.02em;
}

.sub{
  margin:0;
  color:var(--muted);
}

.nav{ margin-top:10px; }

.nav a{
  color:#1f6feb;
  font-weight:650;
  text-decoration:none;
}

/* ================================
   FEATURED POSTER
================================ */
.featured{
  display:flex;
  justify-content:center;
  margin-bottom:36px;
}

.featured-frame{
  padding:24px;
  border-radius:18px;
  box-shadow:var(--shadow);
  /* background is set by JS to a random pastel */
}

.featured-frame img{
  max-width:420px;
  width:100%;
  height:auto;
  display:block;
  /* THIS is the key: makes the white become pastel while black stays black */
  mix-blend-mode: multiply;
}

/* ================================
   GRID
================================ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:18px;
}

figure{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  box-shadow:var(--shadow);
  display:grid;
  gap:10px;
}

figure a{ display:block; }

figure img{
  width:100%;
  height:auto;
  border-radius:10px;
  display:block;
  background:#e5e7eb;
}

figcaption{
  font-size:.85rem;
  color:var(--muted);
  text-align:center;
}

.footer{
  margin-top:40px;
  text-align:center;
  font-size:.9rem;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="shell">

<header>
  <h1>BCPMM Flyers & Posters</h1>
  <p class="sub">
    Promotional artwork and print material for the B.C. Premodern Masters.
  </p>
  <div class="nav">
    <a href="../../">magic1.ca</a>
  </div>
</header>

<!-- FEATURED FRONT POSTER -->
<section class="featured">
  <div class="featured-frame" id="featured-frame">
    <a href="BCPMM(front).png" target="_blank" rel="noopener">
      <img src="BCPMM(front).png" alt="BCPMM Front Poster">
    </a>
  </div>
</section>

<!-- ARCHIVE GRID -->
<section class="grid">

  <figure>
    <a href="BCPMM_poster.jpg" target="_blank" rel="noopener">
      <img src="BCPMM_poster.jpg" alt="">
    </a>
    <figcaption>BCPMM Poster</figcaption>
  </figure>

  <figure>
    <a href="webBCPMM.png" target="_blank" rel="noopener">
      <img src="webBCPMM.png" alt="">
    </a>
    <figcaption>Web Flyer (BCPMM)</figcaption>
  </figure>

  <figure>
    <a href="webBCWL.png" target="_blank" rel="noopener">
      <img src="webBCWL.png" alt="">
    </a>
    <figcaption>BC Winter League Flyer</figcaption>
  </figure>

  <figure>
    <a href="prizeboosters.jpg" target="_blank" rel="noopener">
      <img src="prizeboosters.jpg" alt="">
    </a>
    <figcaption>Prize Boosters</figcaption>
  </figure>

</section>

<div class="footer">
  © B.C. Premodern Masters · Flyers Archive
</div>

</div>

<script>
/* ---------------------------------
   RANDOM PASTEL "INK" FOR BCPMM(front).png
   (white becomes pastel via mix-blend-mode:multiply)
-----------------------------------*/
(() => {
  const pastels = [
    "#FFF3C4", // warm cream
    "#E9F2FF", // pale blue
    "#FCE8F0", // blush
    "#EAF7EA"  // mint
  ];
  const frame = document.getElementById("featured-frame");
  frame.style.background =
    pastels[Math.floor(Math.random() * pastels.length)];
})();
</script>

</body>
</html>
