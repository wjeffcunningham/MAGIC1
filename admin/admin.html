<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Admin · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/bcpmm-shell.css" />

<style>
body {
  max-width: 1100px;
  margin: 3rem auto;
  padding: 0 1.5rem;
  font-family: system-ui, sans-serif;
}
.logo { width: 120px; margin-bottom: 1.5rem; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { padding: 0.7rem; border-bottom: 1px solid #ddd; vertical-align: top; }
button { padding: 0.5rem 0.9rem; cursor: pointer; font-weight: 600; }
.section { margin-top: 3rem; }
.small { font-size: 0.85rem; opacity: 0.75; }
.err { color: #c0392b; font-weight: 700; margin-top: 0.75rem; }
.ok { color: #2e7d32; font-weight: 700; margin-top: 0.75rem; }
.row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 0.75rem; }
select { max-width: 520px; }
input[type=file] { margin-top: 0.75rem; }
.template-btn {
  background: transparent;
  border: 1px solid #111;
  font-weight: 600;
}
</style>
</head>

<body>

<div id="global-menu-root"></div>
<img src="/assets/BCPMMsvg.png" class="logo" alt="Logo">
<h1>Admin Panel</h1>

<!-- =====================================================
     EVENT INGESTION
===================================================== -->

<div class="section">
  <h2>Ingest New Event</h2>

  <input type="file" id="event-file" accept=".json" />

  <div class="row">
    <button id="ingest-btn">Upload & Ingest</button>
    <button id="rebuild-btn">Rebuild Leaderboards</button>
    <a href="templatehelp.html">
      <button type="button" class="template-btn">Template & Help</button>
    </a>
  </div>

  <div id="ingest-status" class="small"></div>
  <div id="ingest-error" class="err" style="display:none;"></div>
  <div id="ingest-ok" class="ok" style="display:none;"></div>
</div>

<!-- Pending Claims -->
<div class="section">
  <h2>Pending Claims</h2>
  <div id="pending-error" class="err" style="display:none;"></div>
  <table>
    <thead>
      <tr>
        <th>Player</th>
        <th>User Info</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="pending-table"></tbody>
  </table>
</div>

<!-- Manual Assignment -->
<div class="section">
  <h2>Manual Assignment</h2>
  <div class="row">
    <select id="manual-user"></select>
    <select id="manual-slug"></select>
    <button id="assign-btn">Assign</button>
  </div>
  <div id="manual-error" class="err" style="display:none;"></div>
</div>

<!-- Manual Separation / Unassign -->
<div class="section">
  <h2>Manual Separation (Unassign Verified Player)</h2>
  <div class="row">
    <select id="unassign-claim"></select>
    <button id="unassign-btn">Unassign</button>
  </div>
  <div id="unassign-error" class="err" style="display:none;"></div>
  <div class="small" style="margin-top:0.5rem;">
    Removes the approved claim link between a user and a player.
  </div>
</div>

<!-- Grant Admin -->
<div class="section">
  <h2>Grant Admin Role</h2>
  <div class="row">
    <select id="admin-user"></select>
    <button id="grant-admin">Grant Admin</button>
  </div>
  <div id="admin-error" class="err" style="display:none;"></div>
</div>

<!-- Merge Players -->
<div class="section">
  <h2>Merge Players (Alias Roll-Up)</h2>
  <div class="row">
    <select id="merge-source"></select>
    <span>→</span>
    <select id="merge-target"></select>
    <button id="merge-btn">Merge</button>
  </div>
  <div id="merge-error" class="err" style="display:none;"></div>
</div>

<!-- Unmerge Alias -->
<div class="section">
  <h2>Unmerge Alias</h2>
  <div class="row">
    <select id="unmerge-alias"></select>
    <button id="unmerge-btn">Unmerge</button>
  </div>
  <div id="unmerge-error" class="err" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>
<script src="/js/bcpmm-shell.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  if (!window.auth || !window.auth._client) return;
  const supabase = window.auth._client;

  const ingestBtn = document.getElementById("ingest-btn");
  const rebuildBtn = document.getElementById("rebuild-btn");
  const fileInput = document.getElementById("event-file");
  const status = document.getElementById("ingest-status");
  const errBox = document.getElementById("ingest-error");
  const okBox = document.getElementById("ingest-ok");

  function showErr(msg) {
    errBox.style.display = "block";
    errBox.textContent = msg;
  }

  function showOk(msg) {
    okBox.style.display = "block";
    okBox.textContent = msg;
  }

  function clearMessages() {
    errBox.style.display = "none";
    okBox.style.display = "none";
    status.textContent = "";
  }

  ingestBtn.onclick = async () => {
    clearMessages();

    const file = fileInput.files[0];
    if (!file) {
      showErr("Select a JSON file.");
      return;
    }

    try {
      status.textContent = "Reading file...";
      const text = await file.text();
      const payload = JSON.parse(text);

      status.textContent = "Uploading...";

const { data, error } = await supabase.functions.invoke("admin-ingest-event", {
  body: { payload }
});

      if (error) {
        showErr(error.message);
        return;
      }

      status.textContent = "";
      showOk("Event ingested successfully.");
    } catch (e) {
      showErr(e.message);
    }
  };

  rebuildBtn.onclick = async () => {
    clearMessages();
    status.textContent = "Rebuilding leaderboards...";

    const { error } = await supabase.rpc("rebuild_leaderboards");

    if (error) {
      showErr(error.message);
      return;
    }

    status.textContent = "";
    showOk("Leaderboards rebuilt.");
  };

});
</script>

</body>
</html>
