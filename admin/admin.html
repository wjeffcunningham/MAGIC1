<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Admin Panel · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
.wrap{
  max-width:1200px;
  margin:6rem auto 4rem;
  padding:0 1.5rem;
}

h2{ margin-top:3rem; }

.notice{
  margin-bottom:1rem;
  font-weight:600;
}

.error{
  color:#c0392b;
  font-weight:700;
}

.success{
  color:#2e7d32;
  font-weight:700;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:1rem;
}

th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
}

button{
  padding:6px 10px;
  margin-right:6px;
  cursor:pointer;
  font-weight:600;
}

.approve{ background:#4caf50;color:white; }
.reject{ background:#f44336;color:white; }
.promote{ background:#1976d2;color:white; }
.demote{ background:#777;color:white; }
.assign{ background:#000;color:white; }

.assign-box{
  margin-top:1rem;
  padding:1rem;
  border:1px solid #ddd;
}
</style>
</head>

<body>
<div id="global-menu-root"></div>

<div class="wrap">

<h1>Admin Panel</h1>

<div id="admin-status" class="notice"></div>

<h2>Pending Claims</h2>
<table>
<thead>
<tr>
  <th>Slug</th>
  <th>Email</th>
  <th>Note</th>
  <th>Actions</th>
</tr>
</thead>
<tbody id="claims-body"></tbody>
</table>

<h2>Manual Claim Assignment</h2>
<div class="assign-box">
  <label>User Email</label>
  <input id="assign-email">
  <label>Player Slug</label>
  <input id="assign-slug">
  <button id="assign-btn" class="assign">Assign & Approve</button>
</div>

<h2>Users</h2>
<table>
<thead>
<tr>
  <th>Email</th>
  <th>Role</th>
  <th>Actions</th>
</tr>
</thead>
<tbody id="users-body"></tbody>
</table>

</div>

<script>

async function init(){

  if(!window.auth) return;

  const supabase = auth._client;
  const user = await auth.getUser();
  const statusEl = document.getElementById("admin-status");

  if(!user){
    statusEl.innerHTML = `<span class="error">Sign in required.</span>`;
    return;
  }

  const { data: role, error } = await supabase
    .from("user_roles")
    .select("role")
    .eq("user_id", user.id)
    .eq("role","admin")
    .maybeSingle();

  if(error){
    statusEl.innerHTML = `<span class="error">Role lookup failed: ${error.message}</span>`;
    return;
  }

  if(!role){
    statusEl.innerHTML = `<span class="error">Admin access required.</span>`;
    return;
  }

  statusEl.innerHTML = `<span class="success">Admin: ${user.email}</span>`;

  await loadClaims(supabase,user);
  await loadUsers(supabase,user);
  setupManualAssign(supabase,user);
}

async function loadClaims(supabase, adminUser){

  const { data: claims } = await supabase
    .from("player_claims")
    .select("id,slug,user_id,note,created_at")
    .eq("status","pending")
    .order("created_at",{ascending:true});

  const body = document.getElementById("claims-body");
  body.innerHTML = "";

  if(!claims || claims.length===0){
    body.innerHTML = `<tr><td colspan="4">No pending claims.</td></tr>`;
    return;
  }

  for(const claim of claims){

    const { data: userRow } = await supabase
      .from("public_users")
      .select("email")
      .eq("id",claim.user_id)
      .maybeSingle();

    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${claim.slug}</td>
      <td>${userRow?.email || "—"}</td>
      <td>${claim.note || "—"}</td>
      <td>
        <button class="approve">Approve</button>
        <button class="reject">Reject</button>
      </td>
    `;

    row.querySelector(".approve").onclick = async ()=>{
      await supabase
        .from("player_claims")
        .update({
          status:"approved",
          reviewed_by:adminUser.id,
          reviewed_at:new Date().toISOString()
        })
        .eq("id",claim.id);

      init();
    };

    row.querySelector(".reject").onclick = async ()=>{
      await supabase
        .from("player_claims")
        .update({
          status:"rejected",
          reviewed_by:adminUser.id,
          reviewed_at:new Date().toISOString()
        })
        .eq("id",claim.id);

      init();
    };

    body.appendChild(row);
  }
}

async function loadUsers(supabase){

  const { data: users } = await supabase
    .from("public_users")
    .select("*");

  const { data: roles } = await supabase
    .from("user_roles")
    .select("*");

  const roleMap = new Map();
  (roles||[]).forEach(r=>roleMap.set(r.user_id,r.role));

  const body = document.getElementById("users-body");
  body.innerHTML="";

  users.forEach(u=>{

    const isAdmin = roleMap.get(u.id)==="admin";

    const row=document.createElement("tr");
    row.innerHTML=`
      <td>${u.email}</td>
      <td>${isAdmin?"Admin":"User"}</td>
      <td>
        ${isAdmin
          ? '<button class="demote">Remove Admin</button>'
          : '<button class="promote">Make Admin</button>'}
      </td>
    `;

    if(isAdmin){
      row.querySelector(".demote").onclick=async()=>{
        await supabase
          .from("user_roles")
          .delete()
          .eq("user_id",u.id)
          .eq("role","admin");
        init();
      };
    }else{
      row.querySelector(".promote").onclick=async()=>{
        await supabase
          .from("user_roles")
          .insert({user_id:u.id,role:"admin"});
        init();
      };
    }

    body.appendChild(row);
  });
}

function setupManualAssign(supabase,adminUser){

  document.getElementById("assign-btn").onclick=async()=>{

    const email=document.getElementById("assign-email").value.trim();
    const slug=document.getElementById("assign-slug").value.trim();

    if(!email||!slug) return alert("Fill both fields.");

    const { data:userRow } = await supabase
      .from("public_users")
      .select("id")
      .eq("email",email)
      .maybeSingle();

    if(!userRow) return alert("User not found.");

    await supabase.from("player_claims").insert({
      user_id:userRow.id,
      slug,
      status:"approved",
      reviewed_by:adminUser.id,
      reviewed_at:new Date().toISOString()
    });

    alert("Claim assigned & approved.");
    init();
  };
}

init();

</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
