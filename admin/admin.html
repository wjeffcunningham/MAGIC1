<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Admin · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/bcpmm-shell.css" />

<style>
body {
  max-width: 1100px;
  margin: 3rem auto;
  padding: 0 1.5rem;
  font-family: system-ui, sans-serif;
}
.logo { width: 120px; margin-bottom: 1.5rem; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { padding: 0.7rem; border-bottom: 1px solid #ddd; vertical-align: top; }
button { padding: 0.5rem 0.9rem; cursor: pointer; font-weight: 600; }
.section { margin-top: 3rem; }
.small { font-size: 0.85rem; opacity: 0.75; margin-top: 0.75rem; }
.row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 0.75rem; }
input[type=file] { margin-top: 0.75rem; }
</style>
</head>

<body>

<div id="global-menu-root"></div>
<img src="/assets/BCPMMsvg.png" class="logo" alt="Logo">
<h1>Admin Panel</h1>

<div class="section">
  <h2>Ingest New Event</h2>

  <input type="file" id="event-file" accept=".json" />

  <div class="row">
    <button id="ingest-btn">Upload & Ingest</button>
    <button id="rebuild-btn">Rebuild Leaderboards</button>
    <a href="templatehelp.html"><button type="button">Template & Help</button></a>
  </div>

  <div id="ingest-status" class="small"></div>
</div>

<div class="section">
  <h2>Pending Claims</h2>
  <table>
    <thead>
      <tr>
        <th>Player</th>
        <th>User Info</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="pending-table"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>
<script src="/js/bcpmm-shell.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  if (!window.auth || !window.auth._client) return;
  const supabase = window.auth._client;
  const statusEl = document.getElementById("ingest-status");

  /* ================= ADMIN GATE ================= */

  const { data: sessionWrap } = await supabase.auth.getSession();
  if (!sessionWrap?.session) {
    window.location.href = "/join.html";
    return;
  }

  const user = sessionWrap.session.user;

  const { data: role } = await supabase
    .from("user_roles")
    .select("role")
    .eq("user_id", user.id)
    .eq("role", "admin")
    .maybeSingle();

  if (!role) {
    alert("Admin access required.");
    window.location.href = "/";
    return;
  }

  /* ================= INGEST (RAW FETCH) ================= */

  document.getElementById("ingest-btn").onclick = async () => {
    const file = document.getElementById("event-file").files[0];
    if (!file) {
      alert("Select a JSON file.");
      return;
    }

    try {
      statusEl.textContent = "Uploading…";

      const text = await file.text();
      const payload = JSON.parse(text);

      const res = await fetch(
        "https://auth.magic1.ca/functions/v1/admin-ingest-event",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        }
      );

      const body = await res.json().catch(() => ({}));

      if (!res.ok) {
        console.error("RAW BACKEND ERROR:", body);
        statusEl.textContent = "";
        alert(body.error || JSON.stringify(body) || "Unknown server error");
        return;
      }

      statusEl.textContent = "Event ingested successfully.";
      alert("Event ingested successfully.");

    } catch (err) {
      console.error("Frontend error:", err);
      statusEl.textContent = "";
      alert("Invalid JSON file.");
    }
  };

  /* ================= REBUILD ================= */

  document.getElementById("rebuild-btn").onclick = async () => {
    statusEl.textContent = "Rebuilding leaderboards…";

    const res = await fetch(
      "https://auth.magic1.ca/functions/v1/admin-rebuild-leaderboards",
      { method: "POST" }
    );

    const body = await res.json().catch(() => ({}));

    if (!res.ok) {
      console.error("RAW BACKEND ERROR:", body);
      statusEl.textContent = "";
      alert(body.error || JSON.stringify(body) || "Unknown server error");
      return;
    }

    statusEl.textContent = "Leaderboards rebuilt.";
    alert("Leaderboards rebuilt.");
  };

});
</script>

</body>
</html>
