<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Admin · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/bcpmm-shell.css" />

<style>
body {
  max-width: 1100px;
  margin: 3rem auto;
  padding: 0 1.5rem;
  font-family: system-ui, sans-serif;
}

.logo {
  width: 120px;
  margin-bottom: 1.5rem;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 1rem;
}

th, td {
  padding: 0.7rem;
  border-bottom: 1px solid #ddd;
  vertical-align: top;
}

button {
  padding: 0.4rem 0.8rem;
  margin-right: 0.4rem;
  cursor: pointer;
}

.section {
  margin-top: 3rem;
}

.small {
  font-size: 0.85rem;
  opacity: 0.75;
}

.err {
  color: #c0392b;
  font-weight: 700;
  margin-top: 0.75rem;
}
</style>
</head>

<body>

<div id="global-menu-root"></div>

<img src="/assets/BCPMMsvg.png" class="logo" alt="Logo">

<h1>Admin Panel</h1>

<!-- ===================================================== -->
<!-- Pending Claims -->
<!-- ===================================================== -->

<div class="section">
  <h2>Pending Claims</h2>
  <div id="pending-error" class="err" style="display:none;"></div>

  <table>
    <thead>
      <tr>
        <th>Player</th>
        <th>User Info</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="pending-table"></tbody>
  </table>
</div>

<!-- ===================================================== -->
<!-- Manual Assignment -->
<!-- ===================================================== -->

<div class="section">
  <h2>Manual Assignment</h2>
  <select id="manual-user"></select>
  <select id="manual-slug"></select>
  <button id="assign-btn">Assign</button>
</div>

<!-- ===================================================== -->
<!-- Grant Admin -->
<!-- ===================================================== -->

<div class="section">
  <h2>Grant Admin Role</h2>
  <select id="admin-user"></select>
  <button id="grant-admin">Grant Admin</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>
<script src="/js/bcpmm-shell.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  if (!window.auth || !window.auth._client) return;
  const supabaseClient = window.auth._client;

  /* =====================================================
     Session + Admin Gate
  ===================================================== */

  const { data: sessionWrap, error: sessErr } = await supabaseClient.auth.getSession();

  if (sessErr || !sessionWrap?.session) {
    window.location.href = "/join.html";
    return;
  }

  const currentUser = sessionWrap.session.user;

  const { data: role, error: roleErr } = await supabaseClient
    .from("user_roles")
    .select("role")
    .eq("user_id", currentUser.id)
    .eq("role", "admin")
    .maybeSingle();

  if (roleErr || !role) {
    alert("Admin access required.");
    window.location.href = "/";
    return;
  }

  /* =====================================================
     Pending Claims (FK-FREE JOIN)
  ===================================================== */

  const pendingError = document.getElementById("pending-error");
  const tbody = document.getElementById("pending-table");
  tbody.innerHTML = "";

  const { data: pendingClaims, error: pendingErr } = await supabaseClient
    .from("player_claims")
    .select("id,slug,user_id,created_at")
    .eq("status", "pending")
    .order("created_at", { ascending: true });

  if (pendingErr) {
    pendingError.style.display = "block";
    pendingError.textContent = pendingErr.message;
  }

  if (!pendingClaims || pendingClaims.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3">No pending claims.</td></tr>`;
  } else {
    // fetch matching public_users
    const userIds = [...new Set(pendingClaims.map(r => r.user_id).filter(Boolean))];

    let usersById = {};
    if (userIds.length) {
      const { data: users, error: usersErr } = await supabaseClient
        .from("public_users")
        .select("id,email,alias,local_store,quote")
        .in("id", userIds);

      if (usersErr) {
        pendingError.style.display = "block";
        pendingError.textContent = usersErr.message;
      }

      (users || []).forEach(u => { usersById[u.id] = u; });
    }

    pendingClaims.forEach(row => {
      const u = usersById[row.user_id] || null;

      const email = u?.email || "(no public_users row yet)";
      const alias = u?.alias || "";
      const store = u?.local_store || "";
      const quote = u?.quote || "";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <strong>${row.slug}</strong><br>
          <a href="/player.html?player=${encodeURIComponent(row.slug)}" target="_blank" rel="noopener">
            View Player Page
          </a>
        </td>

        <td>
          <div><strong>${email}</strong></div>
          <div class="small">user_id: ${row.user_id}</div>
          ${alias ? `<div class="small">Alias: ${escapeHtml(alias)}</div>` : ""}
          ${store ? `<div class="small">Store: ${escapeHtml(store)}</div>` : ""}
          ${quote ? `<div class="small">"${escapeHtml(quote)}"</div>` : ""}
        </td>

        <td>
          <button class="approve" data-id="${row.id}">Approve</button>
          <button class="reject" data-id="${row.id}">Reject</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  tbody.addEventListener("click", async (e) => {
    const id = e.target?.dataset?.id;
    if (!id) return;

    if (e.target.classList.contains("approve")) {
      await supabaseClient
        .from("player_claims")
        .update({ status: "approved" })
        .eq("id", id);
      location.reload();
    }

    if (e.target.classList.contains("reject")) {
      await supabaseClient
        .from("player_claims")
        .delete()
        .eq("id", id);
      location.reload();
    }
  });

  /* =====================================================
     Manual Assignment (public_users + tournament_players)
  ===================================================== */

  const { data: usersList } = await supabaseClient
    .from("public_users")
    .select("id,email")
    .order("email");

  const { data: players } = await supabaseClient
    .from("tournament_players")
    .select("slug")
    .order("slug");

  const userSelect = document.getElementById("manual-user");
  const slugSelect = document.getElementById("manual-slug");
  const adminUserSelect = document.getElementById("admin-user");

  userSelect.innerHTML = "";
  adminUserSelect.innerHTML = "";
  slugSelect.innerHTML = "";

  (usersList || []).forEach(u => {
    userSelect.add(new Option(u.email, u.id));
    adminUserSelect.add(new Option(u.email, u.id));
  });

  (players || []).forEach(p => {
    slugSelect.add(new Option(p.slug, p.slug));
  });

  document.getElementById("assign-btn").onclick = async () => {
    await supabaseClient
      .from("player_claims")
      .insert({
        user_id: userSelect.value,
        slug: slugSelect.value,
        status: "approved"
      });
    alert("Assigned.");
    location.reload();
  };

  document.getElementById("grant-admin").onclick = async () => {
    await supabaseClient
      .from("user_roles")
      .insert({
        user_id: adminUserSelect.value,
        role: "admin"
      });
    alert("Admin granted.");
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

});
</script>

</body>
</html>
