<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Admin Panel · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
.wrap{
  max-width:1100px;
  margin:6rem auto 4rem;
  padding:0 1.5rem;
}

.logo{
  width:70px;
  margin-bottom:1.5rem;
}

h2{ margin-top:3rem; }

.notice{ margin-bottom:1rem; font-weight:600; }
.error{ color:#c0392b; font-weight:700; }
.success{ color:#2e7d32; font-weight:700; }

table{
  width:100%;
  border-collapse:collapse;
  margin-top:1rem;
}

th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
}

button{
  padding:6px 12px;
  margin-right:6px;
  cursor:pointer;
  font-weight:600;
  border:1px solid #000;
  background:#fff;
}

button:hover{ background:#f3f3f3; }

.approve{ background:#2e7d32;color:white;border:none; }
.reject{ background:#c0392b;color:white;border:none; }
.promote{ background:#1976d2;color:white;border:none; }
.demote{ background:#777;color:white;border:none; }

.assign-box{
  margin-top:1rem;
  padding:1.25rem;
  border:1px solid #ddd;
  display:flex;
  flex-wrap:wrap;
  gap:1rem;
  align-items:flex-end;
}

.assign-box select{
  padding:6px;
  min-width:260px;
}
</style>
</head>

<body>
<div id="global-menu-root"></div>

<div class="wrap">

<img src="/assets/BCPMMsvg.png" class="logo">

<h1>Admin Panel</h1>
<div id="admin-status" class="notice"></div>

<h2>Pending Player Verifications</h2>
<table>
<thead>
<tr>
  <th>Player Name</th>
  <th>User Email</th>
  <th>Actions</th>
</tr>
</thead>
<tbody id="claims-body"></tbody>
</table>

<h2>Manual Player Assignment</h2>
<div class="assign-box">
  <div>
    <label>User (Unpaired)</label><br>
    <select id="assign-user"></select>
  </div>

  <div>
    <label>Player Name (Unverified)</label><br>
    <select id="assign-player"></select>
  </div>

  <button id="assign-btn">Assign & Approve</button>
</div>

<h2>Users</h2>
<table>
<thead>
<tr>
  <th>Email</th>
  <th>Role</th>
  <th>Actions</th>
</tr>
</thead>
<tbody id="users-body"></tbody>
</table>

</div>

<script>

function prettify(name){
  return name
    .split("-")
    .map(w => w[0].toUpperCase() + w.slice(1))
    .join(" ");
}

function sortByLastName(arr){
  return arr.sort((a,b)=>{
    const aLast = prettify(a.slug).split(" ").slice(-1)[0];
    const bLast = prettify(b.slug).split(" ").slice(-1)[0];
    return aLast.localeCompare(bLast);
  });
}

/* =======================
   INIT
======================= */

async function init(){

  if(!window.auth) return;

  const supabase = auth._client;
  const user = await auth.getUser();
  const statusEl = document.getElementById("admin-status");

  if(!user){
    statusEl.innerHTML = `<span class="error">Sign in required.</span>`;
    return;
  }

  const { data: role } = await supabase
    .from("user_roles")
    .select("role")
    .eq("user_id", user.id)
    .eq("role","admin")
    .maybeSingle();

  if(!role){
    statusEl.innerHTML = `<span class="error">Admin access required.</span>`;
    return;
  }

  statusEl.innerHTML = `<span class="success">Admin: ${user.email}</span>`;

  await loadClaims(supabase, user);
  await loadUsers(supabase);
  await setupManualAssign(supabase, user);
}

/* =======================
   PENDING CLAIMS
======================= */

async function loadClaims(supabase, adminUser){

  const { data: claims } = await supabase
    .from("player_claims")
    .select("id,slug,user_id")
    .eq("status","pending");

  const body = document.getElementById("claims-body");
  body.innerHTML = "";

  if(!claims || claims.length===0){
    body.innerHTML = `<tr><td colspan="3">No pending requests.</td></tr>`;
    return;
  }

  for(const claim of claims){

    const { data: userRow } = await supabase
      .from("public_users")
      .select("email")
      .eq("id",claim.user_id)
      .maybeSingle();

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${prettify(claim.slug)}</td>
      <td>${userRow?.email || "—"}</td>
      <td>
        <button class="approve">Approve</button>
        <button class="reject">Reject</button>
      </td>
    `;

    row.querySelector(".approve").onclick = async ()=>{

      const { data: existing } = await supabase
        .from("player_profiles")
        .select("verified_user_id")
        .eq("slug",claim.slug)
        .maybeSingle();

      if(existing?.verified_user_id){
        alert("Player already verified.");
        return;
      }

      /* Update claim */
      await supabase
        .from("player_claims")
        .update({
          status:"approved",
          reviewed_by:adminUser.id,
          reviewed_at:new Date().toISOString()
        })
        .eq("id",claim.id);

      /* Link publicly */
      await supabase
        .from("player_profiles")
        .update({ verified_user_id: claim.user_id })
        .eq("slug",claim.slug);

      init();
    };

    row.querySelector(".reject").onclick = async ()=>{
      await supabase
        .from("player_claims")
        .update({
          status:"rejected",
          reviewed_by:adminUser.id,
          reviewed_at:new Date().toISOString()
        })
        .eq("id",claim.id);

      init();
    };

    body.appendChild(row);
  }
}

/* =======================
   USERS LIST
======================= */

async function loadUsers(supabase){

  const { data: users } = await supabase
    .from("public_users")
    .select("id,email")
    .order("email",{ascending:true});

  const { data: roles } = await supabase
    .from("user_roles")
    .select("*");

  const roleMap = new Map();
  (roles||[]).forEach(r=>roleMap.set(r.user_id,r.role));

  const body = document.getElementById("users-body");
  body.innerHTML="";

  users.forEach(u=>{

    const isAdmin = roleMap.get(u.id)==="admin";

    const row=document.createElement("tr");
    row.innerHTML=`
      <td>${u.email}</td>
      <td>${isAdmin?"Admin":"User"}</td>
      <td>
        ${isAdmin
          ? '<button class="demote">Remove Admin</button>'
          : '<button class="promote">Make Admin</button>'}
      </td>
    `;

    if(isAdmin){
      row.querySelector(".demote").onclick=async()=>{
        await supabase
          .from("user_roles")
          .delete()
          .eq("user_id",u.id)
          .eq("role","admin");
        init();
      };
    }else{
      row.querySelector(".promote").onclick=async()=>{
        await supabase
          .from("user_roles")
          .insert({user_id:u.id,role:"admin"});
        init();
      };
    }

    body.appendChild(row);
  });
}

/* =======================
   MANUAL ASSIGNMENT
======================= */

async function setupManualAssign(supabase, adminUser){

  const userSelect = document.getElementById("assign-user");
  const playerSelect = document.getElementById("assign-player");

  /* Users NOT already paired */
  const { data: users } = await supabase.from("public_users").select("id,email");
  const { data: verified } = await supabase
    .from("player_profiles")
    .select("verified_user_id");

  const pairedIds = new Set(
    (verified||[])
      .map(v=>v.verified_user_id)
      .filter(Boolean)
  );

  userSelect.innerHTML="<option value=''>Select user</option>";
  users
    .filter(u=>!pairedIds.has(u.id))
    .forEach(u=>{
      const opt=document.createElement("option");
      opt.value=u.id;
      opt.textContent=u.email;
      userSelect.appendChild(opt);
    });

  /* Players not yet verified */
  const { data: players } = await supabase
    .from("player_profiles")
    .select("slug,verified_user_id");

  playerSelect.innerHTML="<option value=''>Select player</option>";
  sortByLastName(
    (players||[]).filter(p=>!p.verified_user_id)
  ).forEach(p=>{
    const opt=document.createElement("option");
    opt.value=p.slug;
    opt.textContent=prettify(p.slug);
    playerSelect.appendChild(opt);
  });

  document.getElementById("assign-btn").onclick = async ()=>{

    if(!userSelect.value || !playerSelect.value){
      alert("Select both fields.");
      return;
    }

    await supabase.from("player_claims").insert({
      user_id:userSelect.value,
      slug:playerSelect.value,
      status:"approved",
      reviewed_by:adminUser.id,
      reviewed_at:new Date().toISOString()
    });

    await supabase
      .from("player_profiles")
      .update({ verified_user_id: userSelect.value })
      .eq("slug",playerSelect.value);

    init();
  };
}

init();

</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
