<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Admin · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/bcpmm-shell.css" />

<style>
body {
  max-width: 1100px;
  margin: 3rem auto;
  padding: 0 1.5rem;
  font-family: system-ui, sans-serif;
}
.logo { width: 120px; margin-bottom: 1.5rem; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { padding: 0.7rem; border-bottom: 1px solid #ddd; vertical-align: top; }
button { padding: 0.4rem 0.8rem; margin-right: 0.4rem; cursor: pointer; }
.section { margin-top: 3rem; }
.small { font-size: 0.85rem; opacity: 0.75; }
.err { color: #c0392b; font-weight: 700; margin-top: 0.75rem; }
.row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 0.75rem; }
select { max-width: 520px; }
</style>
</head>

<body>

<div id="global-menu-root"></div>
<img src="/assets/BCPMMsvg.png" class="logo" alt="Logo">
<h1>Admin Panel</h1>

<!-- Pending Claims -->
<div class="section">
  <h2>Pending Claims</h2>
  <div id="pending-error" class="err" style="display:none;"></div>
  <table>
    <thead>
      <tr>
        <th>Player</th>
        <th>User Info</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="pending-table"></tbody>
  </table>
</div>

<!-- Manual Assignment -->
<div class="section">
  <h2>Manual Assignment</h2>
  <div class="row">
    <select id="manual-user"></select>
    <select id="manual-slug"></select>
    <button id="assign-btn">Assign</button>
  </div>
  <div id="manual-error" class="err" style="display:none;"></div>
</div>

<!-- Manual Separation / Unassign -->
<div class="section">
  <h2>Manual Separation (Unassign Verified Player)</h2>
  <div class="row">
    <select id="unassign-claim"></select>
    <button id="unassign-btn">Unassign</button>
  </div>
  <div id="unassign-error" class="err" style="display:none;"></div>
  <div class="small" style="margin-top:0.5rem;">
    Removes the approved claim link between a user and a player (i.e. undo a wrong verification).
  </div>
</div>

<!-- Grant Admin -->
<div class="section">
  <h2>Grant Admin Role</h2>
  <div class="row">
    <select id="admin-user"></select>
    <button id="grant-admin">Grant Admin</button>
  </div>
  <div id="admin-error" class="err" style="display:none;"></div>
</div>

<!-- Merge Players -->
<div class="section">
  <h2>Merge Players (Alias Roll-Up)</h2>
  <div class="row">
    <select id="merge-source"></select>
    <span>→</span>
    <select id="merge-target"></select>
    <button id="merge-btn">Merge</button>
  </div>
  <div id="merge-error" class="err" style="display:none;"></div>
</div>

<!-- Unmerge Alias -->
<div class="section">
  <h2>Unmerge Alias</h2>
  <div class="row">
    <select id="unmerge-alias"></select>
    <button id="unmerge-btn">Unmerge</button>
  </div>
  <div id="unmerge-error" class="err" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>
<script src="/js/bcpmm-shell.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  if (!window.auth || !window.auth._client) return;
  const supabase = window.auth._client;

  const pendingError  = document.getElementById("pending-error");
  const manualError   = document.getElementById("manual-error");
  const unassignError = document.getElementById("unassign-error");
  const adminError    = document.getElementById("admin-error");
  const mergeError    = document.getElementById("merge-error");
  const unmergeError  = document.getElementById("unmerge-error");

  function showErr(el, msg) {
    el.style.display = "block";
    el.textContent = msg;
  }
  function clearErr(el) {
    el.style.display = "none";
    el.textContent = "";
  }
  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  /* =====================================================
     Admin Gate
  ===================================================== */

  const { data: sessionWrap } = await supabase.auth.getSession();
  if (!sessionWrap?.session) {
    window.location.href = "/join.html";
    return;
  }

  const currentUser = sessionWrap.session.user;

  const { data: role, error: roleErr } = await supabase
    .from("user_roles")
    .select("role")
    .eq("user_id", currentUser.id)
    .eq("role", "admin")
    .maybeSingle();

  if (roleErr || !role) {
    alert("Admin access required.");
    window.location.href = "/";
    return;
  }

  /* =====================================================
     Pending Claims
  ===================================================== */

  clearErr(pendingError);

  const tbody = document.getElementById("pending-table");
  tbody.innerHTML = "";

  const { data: claims, error: claimsErr } = await supabase.rpc("admin_get_pending_claims");
  if (claimsErr) showErr(pendingError, claimsErr.message);

  if (!claims || claims.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3">No pending claims.</td></tr>`;
  } else {
    claims.forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <strong>${escapeHtml(row.slug)}</strong><br>
          <a href="/player.html?player=${encodeURIComponent(row.slug)}" target="_blank" rel="noopener">View Player Page</a>
        </td>
        <td>
          <div><strong>${escapeHtml(row.email)}</strong></div>
          <div class="small">user_id: ${escapeHtml(row.user_id)}</div>
        </td>
        <td>
          <button class="approve" data-id="${row.claim_id}">Approve</button>
          <button class="reject" data-id="${row.claim_id}">Reject</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  tbody.addEventListener("click", async (e) => {
    const id = e.target?.dataset?.id;
    if (!id) return;

    if (e.target.classList.contains("approve")) {
      await supabase.from("player_claims").update({ status: "approved" }).eq("id", id);
      location.reload();
    }

    if (e.target.classList.contains("reject")) {
      await supabase.from("player_claims").delete().eq("id", id);
      location.reload();
    }
  });

  /* =====================================================
     Populate Users (admin_get_users returns: id, email [, alias])
  ===================================================== */

  clearErr(manualError);
  clearErr(adminError);

  const { data: users, error: usersErr } = await supabase.rpc("admin_get_users");
  if (usersErr) {
    showErr(manualError, usersErr.message);
    showErr(adminError, usersErr.message);
  }

  const manualUser = document.getElementById("manual-user");
  const adminUser = document.getElementById("admin-user");

  manualUser.innerHTML = "";
  adminUser.innerHTML = "";

  const usersById = new Map();

  (users || []).forEach(u => {
    const uid = u.id; // IMPORTANT: RPC returns "id"
    if (!uid) return;

    usersById.set(uid, u);

    const label = u.alias ? `${u.email} (${u.alias})` : u.email;

    const opt1 = document.createElement("option");
    opt1.textContent = label;
    opt1.value = uid; // UUID
    manualUser.appendChild(opt1);

    const opt2 = document.createElement("option");
    opt2.textContent = label;
    opt2.value = uid; // UUID
    adminUser.appendChild(opt2);
  });

  /* =====================================================
     Populate Player Slugs
  ===================================================== */

  const { data: players, error: playersErr } = await supabase
    .from("tournament_players")
    .select("slug")
    .order("slug");

  if (playersErr) showErr(manualError, playersErr.message);

  const slugSelect = document.getElementById("manual-slug");
  const mergeSource = document.getElementById("merge-source");
  const mergeTarget = document.getElementById("merge-target");

  slugSelect.innerHTML = "";
  mergeSource.innerHTML = "";
  mergeTarget.innerHTML = "";

  (players || []).forEach(p => {
    if (!p.slug) return;
    slugSelect.add(new Option(p.slug, p.slug));
    mergeSource.add(new Option(p.slug, p.slug));
    mergeTarget.add(new Option(p.slug, p.slug));
  });

  /* =====================================================
     Manual Assignment (creates approved claim)
  ===================================================== */

  document.getElementById("assign-btn").onclick = async () => {

    clearErr(manualError);

    const userId = manualUser.value; // UUID
    const slug = slugSelect.value;

    const { error } = await supabase
      .from("player_claims")
      .insert({ user_id: userId, slug: slug, status: "approved" });

    if (error) {
      showErr(manualError, error.message);
      return;
    }

    alert("Assigned.");
    location.reload();
  };

  /* =====================================================
     Manual Separation (undo wrong verification)
     Implementation: delete approved claim row.
     (If you prefer status='revoked', tell me your allowed statuses.)
  ===================================================== */

  const unassignSelect = document.getElementById("unassign-claim");
  unassignSelect.innerHTML = "";

  const { data: approvedClaims, error: approvedErr } = await supabase
    .from("player_claims")
    .select("id, slug, user_id, status")
    .eq("status", "approved")
    .order("slug");

  if (approvedErr) showErr(unassignError, approvedErr.message);

  (approvedClaims || []).forEach(c => {
    const u = usersById.get(c.user_id);
    const email = u?.email ? u.email : c.user_id;
    const label = `${c.slug} — ${email}`;
    unassignSelect.add(new Option(label, c.id));
  });

  document.getElementById("unassign-btn").onclick = async () => {

    clearErr(unassignError);

    const claimId = unassignSelect.value;
    if (!claimId) return;

    const ok = confirm("Unassign this verified claim? This will remove the user↔player link.");
    if (!ok) return;

    const { error } = await supabase
      .from("player_claims")
      .delete()
      .eq("id", claimId);

    if (error) {
      showErr(unassignError, error.message);
      return;
    }

    alert("Unassigned.");
    location.reload();
  };

  /* =====================================================
     Grant Admin
  ===================================================== */

  document.getElementById("grant-admin").onclick = async () => {

    clearErr(adminError);

    const userId = adminUser.value; // UUID

    const { error } = await supabase
      .rpc("admin_grant_admin", { target_user_id: userId });

    if (error) {
      showErr(adminError, error.message);
      return;
    }

    alert("Admin granted.");
  };

  /* =====================================================
     Merge Players (alias roll-up)
  ===================================================== */

  document.getElementById("merge-btn").onclick = async () => {

    clearErr(mergeError);

    const source = mergeSource.value;
    const target = mergeTarget.value;

    if (!source || !target || source === target) {
      alert("Choose two different players.");
      return;
    }

    const { error } = await supabase
      .rpc("admin_merge_players", { source_slug: source, target_slug: target });

    if (error) {
      showErr(mergeError, error.message);
      return;
    }

    alert("Players merged.");
    location.reload();
  };

  /* =====================================================
     Unmerge Alias (optional; only works if player_aliases exists)
  ===================================================== */

  const unmergeSelect = document.getElementById("unmerge-alias");
  unmergeSelect.innerHTML = "";

  const { data: aliases, error: aliasErr } = await supabase
    .from("player_aliases")
    .select("alias_slug")
    .order("alias_slug");

  if (aliasErr) {
    showErr(unmergeError, aliasErr.message);
  } else {
    (aliases || []).forEach(a => {
      if (!a.alias_slug) return;
      unmergeSelect.add(new Option(a.alias_slug, a.alias_slug));
    });
  }

  document.getElementById("unmerge-btn").onclick = async () => {

    clearErr(unmergeError);

    const alias = unmergeSelect.value;
    if (!alias) return;

    const ok = confirm(`Unmerge alias "${alias}"?`);
    if (!ok) return;

    const { error } = await supabase
      .rpc("admin_unmerge_player", { alias_slug: alias });

    if (error) {
      showErr(unmergeError, error.message);
      return;
    }

    alert("Alias removed.");
    location.reload();
  };

});
</script>

</body>
</html>
