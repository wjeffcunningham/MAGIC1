<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reshuffle Pods · BCWL Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">

  <!-- GLOBAL MENU -->
  <script type="module" src="/js/global-menu-loader.js"></script>

  <!-- ADMIN GUARD -->
  <script type="module">
    import { requireAdmin } from "/js/admin-guard.js";
    await requireAdmin();
  </script>

  <div class="max-w-xl mx-auto px-4 py-10 space-y-5">
    <h1 class="text-2xl font-bold mb-2">Reshuffle Pods</h1>
    <p class="text-sm text-slate-600">
      This will rebuild pods for a selected month using current
      <strong>league_rating</strong>, assigning players into 4 pods of 8 (A–D).
    </p>

    <div class="bg-white border rounded-xl shadow p-4 space-y-3">
      <label class="block text-sm font-semibold mb-1">Select league month</label>
      <select id="month-select" class="w-full border rounded px-3 py-2 text-sm">
        <!-- JS fills -->
      </select>

      <button id="run-btn"
              class="mt-3 w-full bg-emerald-600 text-white py-2 rounded text-sm font-semibold">
        Run reshuffle
      </button>

      <p id="reshuffle-status" class="text-sm text-slate-700 mt-3"></p>
      <p id="reshuffle-error" class="text-sm text-red-600 mt-1 hidden"></p>
    </div>
  </div>

  <script type="module" src="/admin/reshuffle.js"></script>
</body>
</html>
