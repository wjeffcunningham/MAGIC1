<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pod Assignment · magic1.ca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">
<script type="module" src="/js/global-menu-loader.js"></script>

<div class="max-w-4xl mx-auto mt-10 px-4">

  <h1 class="text-3xl font-bold mb-6 text-center">Pod Assignment (Admin)</h1>

  <div id="not-admin" class="text-center text-red-600 font-semibold hidden">
    You do not have admin access.
  </div>

  <div id="ui" class="hidden">

    <!-- Current Active League Month -->
    <div id="month-block" class="bg-white p-6 rounded-xl shadow mb-8"></div>

    <!-- Active Signups -->
    <h2 class="text-xl font-bold mb-2">Active Signups</h2>
    <div id="signup-list" class="bg-white p-4 rounded-xl shadow mb-8"></div>

    <!-- Existing Pods -->
    <h2 class="text-xl font-bold mb-2">Existing Pods For This Month</h2>
    <div id="existing-pods" class="bg-white p-4 rounded-xl shadow mb-8"></div>

    <!-- Actions -->
    <div class="flex gap-4 mt-6">
      <button id="btn-preview" class="bg-blue-600 text-white px-4 py-2 rounded">
        Test Pods (no save)
      </button>

      <button id="btn-generate" class="bg-green-600 text-white px-4 py-2 rounded">
        Generate Pods (save)
      </button>
    </div>

    <!-- Preview Output -->
    <div id="preview-block" class="mt-8 hidden"></div>

    <!-- Pairings -->
    <h2 class="text-xl font-bold mt-10 mb-2">Generate Pairings</h2>
    <div class="flex gap-4">
      <button id="btn-pairings-preview" class="bg-purple-600 text-white px-4 py-2 rounded">
        Preview Pairings
      </button>

      <button id="btn-pairings-commit" class="bg-purple-800 text-white px-4 py-2 rounded">
        Commit Pairings
      </button>
    </div>

    <div id="pairings-preview" class="mt-8 hidden"></div>

  </div>

</div>

<script type="module" src="/js/admin-pods.js"></script>
</body>
</html>
