<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Generate Pairings · magic1.ca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">

  <script type="module" src="/js/global-menu-loader.js"></script>

  <div class="max-w-5xl mx-auto px-4 py-8 space-y-6">

    <header class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-2xl font-bold">Generate Pairings</h1>
        <p class="text-sm text-slate-600">
          Creates 4 assigned matches per player for the current month,
          based on existing pods.
        </p>
      </div>
      <div class="text-xs text-slate-500">
        <span id="admin-name"></span>
      </div>
    </header>

    <section class="bg-white border rounded-xl shadow p-4 space-y-2">
      <p id="pairings-info" class="text-sm text-slate-700"></p>
      <p id="pairings-warning" class="text-xs text-amber-700"></p>

      <div class="flex flex-wrap gap-2 pt-2">
        <button id="generate-pairings-btn"
                class="bg-sky-600 hover:bg-sky-700 text-white text-xs px-3 py-2 rounded">
          Generate Pairings (Preview)
        </button>
        <button id="save-pairings-btn"
                class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded disabled:opacity-50"
                disabled>
          Confirm & Save Pairings
        </button>
      </div>

      <p id="pairings-status" class="text-xs text-slate-500 mt-2"></p>
      <p id="pairings-error" class="hidden text-sm text-red-600 mt-2"></p>
    </section>

    <!-- PREVIEW -->
    <section id="pairings-preview" class="space-y-4">
      <!-- JS injects pod panels here -->
    </section>

  </div>

  <script type="module" src="/js/admin-pairings-generate.js"></script>
</body>
</html>
