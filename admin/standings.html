<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>League Standings · magic1.ca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900 pb-20">

  <script type="module" src="/js/global-menu-loader.js"></script>

  <div class="max-w-4xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">League Standings</h1>

    <div id="loading">Loading…</div>

    <table id="standings-table"
           class="hidden w-full text-left bg-white shadow rounded">
      <thead class="border-b">
        <tr class="font-semibold">
          <th class="p-2">Rank</th>
          <th class="p-2">Player</th>
          <th class="p-2">Points</th>
          <th class="p-2">H2H</th>
          <th class="p-2">Opp %</th>
          <th class="p-2">Opp-Opp %</th>
          <th class="p-2">Elo</th>
        </tr>
      </thead>
      <tbody id="standings-body"></tbody>
    </table>
  </div>

  <script type="module" src="/js/standings.js"></script>
</body>
</html>
