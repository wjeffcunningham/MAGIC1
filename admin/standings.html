<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Standings · BCWL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">

    <!-- GLOBAL MENU LOADER GOES HERE -->
  <script type="module" src="/js/global-menu-loader.js"></script>
  <!-- END MENU LOADER -->

    <!-- ADMIN ACCESS CHECK -->
<script type="module">
  import { requireAdmin } from "../js/admin-guard.js";
  await requireAdmin();
</script>
  <!-- END ADMIN ACCESS CHECK -->

  <div class="max-w-4xl mx-auto px-4 py-10 space-y-10">

    <section class="bg-white p-6 rounded-xl shadow">
      <h1 class="text-2xl font-bold mb-4">Overall Standings</h1>
      <div id="overall-loading" class="text-sm text-slate-600">Loading…</div>
      <table id="overall-table" class="hidden w-full text-sm border-collapse">
        <thead>
          <tr class="border-b text-left">
            <th class="py-2 pr-2">Rank</th>
            <th class="py-2 pr-2">Player</th>
            <th class="py-2 pr-2">Rating</th>
          </tr>
        </thead>
        <tbody id="overall-body"></tbody>
      </table>
    </section>

    <section class="bg-white p-6 rounded-xl shadow">
      <h1 class="text-2xl font-bold mb-4">Monthly Standings</h1>

      <div id="month-picker" class="mb-4"></div>

      <div id="monthly-loading" class="text-sm text-slate-600">Select a month.</div>
      <table id="monthly-table" class="hidden w-full text-sm border-collapse">
        <thead>
          <tr class="border-b text-left">
            <th class="py-2 pr-2">Player</th>
            <th class="py-2 pr-2">Wins</th>
            <th class="py-2 pr-2">Losses</th>
          </tr>
        </thead>
        <tbody id="monthly-body"></tbody>
      </table>
    </section>

  </div>

  <script type="module" src="/js/standings.js"></script>
</body>
</html>
