<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin · B.C. Premodern Masters</title>
  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 40px;
      background: #fff;
      color: #000;
    }
    h1 { margin-bottom: 0.5rem; }
    p { margin-top: 0; margin-bottom: 1.5rem; }
    ul { list-style: none; padding-left: 0; }
    li { margin-bottom: 0.5rem; }
    a {
      text-decoration: none;
      color: #0070c9;
    }
    a:hover { text-decoration: underline; }
    #auth-status {
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      color: #333;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h1>Admin Dashboard</h1>
<p>Internal tools for B.C. Premodern Masters & Winter League.</p>
<div id="auth-status">Checking login…</div>

<h2>Sections</h2>
<ul>
  <li><a href="/admin/players.html">Players Admin</a></li>
  <li><a href="/admin/events.html">Events Admin (stub / future)</a></li>
  <li><a href="/admin/league.html">League Admin (BC Winter League)</a></li>
  <li><a href="/admin/matches.html">Matches Admin (stub / future)</a></li>
</ul>

<script type="module">
  const supabaseUrl = "https://dkzdfhzlewlvfmunywal.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRremRmaHpsZXdsdmZtdW55d2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMyNTU5OTIsImV4cCI6MjA3ODgzMTk5Mn0.zhUaZm6FkGkVEatHQ8UzU8IOj1siWJckXKZ9UgIYknI";
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function checkAuth() {
    const { data: { user } } = await supabase.auth.getUser();
    const statusEl = document.getElementById("auth-status");

    if (!user) {
      statusEl.innerHTML = `Not logged in. <a href="/login.html">Go to login</a>`;
      return;
    }

    // Check admin flag via players table
    const { data: player, error } = await supabase
      .from("players")
      .select("*")
      .eq("auth_user_id", user.id)
      .maybeSingle();

    if (error || !player) {
      statusEl.textContent = `Logged in as ${user.email} (no player record)`;
      return;
    }

    if (!player.is_admin) {
      statusEl.textContent = `Logged in as ${user.email} (not marked admin)`;
      return;
    }

    statusEl.textContent = `Logged in as ${user.email} (admin)`;
  }

  checkAuth();
</script>

</body>
</html>
