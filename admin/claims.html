<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Claim Moderation · Magic1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/bcpmm-shell.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>

  <style>
    body { background: var(--bg); color: var(--fg); }

    .wrap {
      max-width: 1200px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }

    h2 { margin-top: 3rem; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--muted);
      vertical-align: top;
    }

    th { text-align: left; opacity: .8; }

    button {
      margin-right: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .approve { background: #4caf50; color: white; }
    .reject  { background: #f44336; color: white; }
    .ban     { background: #000; color: white; }

    .notice {
      opacity: .7;
      margin-bottom: 1rem;
    }

    .small { font-size: 0.85em; opacity: .8; }
  </style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="wrap">
  <h1>Admin Panel</h1>
  <div class="notice" id="admin-notice"></div>

  <!-- ============================= -->
  <!-- Pending Claims Section -->
  <!-- ============================= -->

  <h2>Pending Claims</h2>

  <table>
    <thead>
      <tr>
        <th>Slug</th>
        <th>Name</th>
        <th>Contact</th>
        <th>Note</th>
        <th>User ID</th>
        <th>Created</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="claims-body"></tbody>
  </table>

  <!-- ============================= -->
  <!-- User Management Section -->
  <!-- ============================= -->

  <h2>All Registered Users</h2>

  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>User ID</th>
        <th>Status</th>
        <th>Assign Slug</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="users-body"></tbody>
  </table>

</div>

<script>

/* =========================================
   CONFIG: ADMIN EMAILS
========================================= */

const ADMIN_EMAILS = [
  "bcpremodernmasters@gmail.com"
];

/* =========================================
   INIT
========================================= */

async function init() {

  if (!window.auth) return;

  const supabase = auth._client;
  const user = await auth.getUser();

  if (!user || !ADMIN_EMAILS.includes(user.email)) {
    document.body.innerHTML = "Admin access required.";
    return;
  }

  document.getElementById("admin-notice").textContent =
    `Signed in as ${user.email}`;

  await loadPendingClaims(supabase, user);
  await loadUsers(supabase);
}

/* =========================================
   LOAD PENDING CLAIMS
========================================= */

async function loadPendingClaims(supabase, adminUser) {

  const { data: claims } = await supabase
    .from("player_claims")
    .select("*")
    .eq("status", "pending")
    .order("created_at", { ascending: true });

  const body = document.getElementById("claims-body");
  body.innerHTML = "";

  if (!claims || claims.length === 0) {
    body.innerHTML = `<tr><td colspan="7">No pending claims.</td></tr>`;
    return;
  }

  claims.forEach(claim => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${claim.slug}</td>
      <td>${claim.display_name || "-"}</td>
      <td>${claim.contact_email || "-"}</td>
      <td>${claim.note || "-"}</td>
      <td class="small">${claim.user_id}</td>
      <td>${new Date(claim.created_at).toLocaleString()}</td>
      <td>
        <button class="approve">Approve</button>
        <button class="reject">Reject</button>
      </td>
    `;

    row.querySelector(".approve").onclick = async () => {

      if (!confirm("Approve this claim?")) return;

      await supabase
        .from("player_claims")
        .update({ status: "rejected" })
        .eq("slug", claim.slug)
        .eq("status", "pending");

      await supabase
        .from("player_claims")
        .update({
          status: "approved",
          reviewed_by: adminUser.id,
          reviewed_at: new Date().toISOString()
        })
        .eq("id", claim.id);

      init();
    };

    row.querySelector(".reject").onclick = async () => {

      if (!confirm("Reject this claim?")) return;

      await supabase
        .from("player_claims")
        .update({
          status: "rejected",
          reviewed_by: adminUser.id,
          reviewed_at: new Date().toISOString()
        })
        .eq("id", claim.id);

      init();
    };

    body.appendChild(row);
  });
}

/* =========================================
   LOAD ALL USERS (Requires public_users table)
========================================= */

async function loadUsers(supabase) {

  const { data: users } = await supabase
    .from("public_users")
    .select("*")
    .order("created_at", { ascending: false });

  const body = document.getElementById("users-body");
  body.innerHTML = "";

  if (!users) return;

  users.forEach(u => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${u.email}</td>
      <td class="small">${u.id}</td>
      <td>${u.status || "active"}</td>
      <td>
        <input type="text" placeholder="slug" id="slug-${u.id}" />
      </td>
      <td>
        <button class="approve">Verify</button>
        <button class="ban">Ban</button>
      </td>
    `;

    row.querySelector(".approve").onclick = async () => {

      const slug = document.getElementById(`slug-${u.id}`).value.trim();
      if (!slug) return alert("Enter slug first.");

      await supabase.from("player_claims").insert({
        slug,
        user_id: u.id,
        status: "approved",
        reviewed_by: (await auth.getUser()).id,
        reviewed_at: new Date().toISOString()
      });

      alert("User verified.");
      init();
    };

    row.querySelector(".ban").onclick = async () => {

      if (!confirm("Ban this user?")) return;

      await supabase
        .from("public_users")
        .update({ status: "banned" })
        .eq("id", u.id);

      alert("User banned.");
      init();
    };

    body.appendChild(row);
  });
}

init();

</script>

<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
