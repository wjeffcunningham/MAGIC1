<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Claim Moderation · Magic1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/bcpmm-shell.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>

  <style>
    body { background: var(--bg); color: var(--fg); }

    .wrap {
      max-width: 1100px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--muted);
      vertical-align: top;
    }

    th { text-align: left; opacity: .8; }

    button {
      margin-right: 8px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .approve { background: #4caf50; color: white; }
    .reject  { background: #f44336; color: white; }

    .notice {
      opacity: .7;
      margin-bottom: 1rem;
    }

    .small { font-size: 0.85em; opacity: .8; }

    .note-cell {
      max-width: 260px;
      font-size: 0.85em;
    }
  </style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="wrap">
  <h1>Pending Player Claims</h1>
  <div class="notice" id="admin-notice"></div>

  <table>
    <thead>
      <tr>
        <th>Slug</th>
        <th>Name</th>
        <th>Contact</th>
        <th>Note</th>
        <th>Supabase User</th>
        <th>Created</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="claims-body"></tbody>
  </table>
</div>

<script>
/* =========================================
   CONFIG: ADMIN EMAILS
========================================= */

const ADMIN_EMAILS = [
  "bcpremodernmasters@gmail.com"
];

/* =========================================
   INIT
========================================= */

async function init() {
  if (!window.auth) return;

  const user = await auth.getUser();
  const notice = document.getElementById("admin-notice");

  if (!user) {
    document.body.innerHTML = "Not authorized.";
    return;
  }

  if (!ADMIN_EMAILS.includes(user.email)) {
    document.body.innerHTML = "Admin access required.";
    return;
  }

  notice.textContent = `Signed in as ${user.email}`;

  const supabase = auth._client;

  const { data: claims, error } = await supabase
    .from("player_claims")
    .select("*")
    .eq("status", "pending")
    .order("created_at", { ascending: true });

  if (error) {
    console.error(error);
    return;
  }

  const body = document.getElementById("claims-body");
  body.innerHTML = "";

  if (!claims || claims.length === 0) {
    body.innerHTML = `<tr><td colspan="7">No pending claims.</td></tr>`;
    return;
  }

  claims.forEach(claim => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${claim.slug}</td>
      <td>${claim.display_name || "-"}</td>
      <td>${claim.contact_email || "-"}</td>
      <td class="note-cell">${claim.note || "-"}</td>
      <td class="small">${claim.user_id}</td>
      <td>${new Date(claim.created_at).toLocaleString()}</td>
      <td>
        <button class="approve">Approve</button>
        <button class="reject">Reject</button>
      </td>
    `;

    const approveBtn = row.querySelector(".approve");
    const rejectBtn = row.querySelector(".reject");

    /* ===============================
       APPROVE
    =============================== */

    approveBtn.onclick = async () => {
      if (!confirm("Approve this claim? This will reject all other pending claims for this player.")) return;

      // Reject all pending claims for same slug
      await supabase
        .from("player_claims")
        .update({ status: "rejected" })
        .eq("slug", claim.slug)
        .eq("status", "pending");

      // Approve selected claim
      const { error } = await supabase
        .from("player_claims")
        .update({
          status: "approved",
          reviewed_by: user.id,
          reviewed_at: new Date().toISOString()
        })
        .eq("id", claim.id);

      if (error) {
        alert("Approval failed.");
        console.error(error);
        return;
      }

      init();
    };

    /* ===============================
       REJECT
    =============================== */

    rejectBtn.onclick = async () => {
      if (!confirm("Reject this claim?")) return;

      const { error } = await supabase
        .from("player_claims")
        .update({
          status: "rejected",
          reviewed_by: user.id,
          reviewed_at: new Date().toISOString()
        })
        .eq("id", claim.id);

      if (error) {
        alert("Rejection failed.");
        console.error(error);
        return;
      }

      init();
    };

    body.appendChild(row);
  });
}

init();
</script>

<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
