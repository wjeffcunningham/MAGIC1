<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Generate Pods · magic1.ca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">

  <!-- Global menu icon / hamburger -->
  <script type="module" src="/js/global-menu-loader.js"></script>

  <div class="max-w-5xl mx-auto px-4 py-8 space-y-6">

    <header class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-2xl font-bold">Generate Pods (Official)</h1>
        <p class="text-sm text-slate-600">
          Uses home store and league signups to assign players to
          Emerald / Ruby / Sapphire / Pearl for the current month.
        </p>
      </div>
      <div class="text-xs text-slate-500">
        <span id="admin-name"></span>
      </div>
    </header>

    <section class="bg-white border rounded-xl shadow p-4 space-y-2">
      <p id="pods-info" class="text-sm text-slate-700"></p>
      <p id="pods-warning" class="text-xs text-amber-700"></p>

      <div class="flex flex-wrap gap-2 pt-2">
        <button id="generate-btn"
                class="bg-sky-600 hover:bg-sky-700 text-white text-xs px-3 py-2 rounded">
          Generate Pods (Preview)
        </button>
        <button id="save-btn"
                class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded disabled:opacity-50"
                disabled>
          Confirm & Save Pods
        </button>
      </div>

      <p id="pods-status" class="text-xs text-slate-500 mt-2"></p>
      <p id="pods-error" class="hidden text-sm text-red-600 mt-2"></p>
    </section>

    <!-- PODS PREVIEW -->
    <section id="pods-preview" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- JS will inject pod cards here -->
    </section>

  </div>

  <script type="module" src="/js/admin-pods-generate.js"></script>
</body>
</html>
