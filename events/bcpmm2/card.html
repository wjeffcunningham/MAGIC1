<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BCPMM II Card</title>

<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700;800&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.card {
  width: 1080px;
  height: 1350px;
  position: relative;
  font-family: 'Alegreya', serif;
  color: #fff;
  overflow: hidden;
}

/* ===== BACKGROUND ===== */

.bg-top {
  position: absolute;
  top: 0;
  width: 100%;
  height: 55%;
  background: url('./assets/brew1.jpeg') center/cover no-repeat;
  z-index: 0;
}

.bg-bottom {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 45%;
  background: url('./assets/brew3.jpeg') center/cover no-repeat;
  z-index: 0;
}

/* CRITICAL: split overlay instead of one wash */
.overlay-top {
  position: absolute;
  top: 0;
  width: 100%;
  height: 55%;
  background: rgba(0,0,0,0.45);
  z-index: 1;
}

.overlay-bottom {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 45%;
  background: rgba(0,0,0,0.75);
  z-index: 1;
}

/* divider */
.divider {
  position: absolute;
  top: 55%;
  width: 100%;
  height: 2px;
  background: rgba(255,255,255,0.25);
  z-index: 2;
}

/* ===== SIDE CARDS (ACTUALLY HIGHER) ===== */

.side-card {
  position: absolute;
  width: 240px;
  border-radius: 12px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.9);
  z-index: 3;
}

.card-left {
  top: 60px;
  left: 50px;
  transform: rotate(-20deg);
}

.card-right {
  top: 60px;
  right: 50px;
  transform: rotate(20deg);
}

/* ===== CONTENT ===== */

.content {
  position: relative;
  z-index: 5;
  padding: 40px 80px 70px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* ===== SPONSORS (FORCED VISIBLE) ===== */

.sponsors {
  display: flex;
  justify-content: center;
  gap: 16px;
  padding: 10px 0 14px;
  background: rgba(0,0,0,0.55); /* THIS fixes invisibility */
  border-radius: 6px;
}

.sponsors img {
  height: 34px;
  filter: brightness(1.2) contrast(1.1);
}

/* ===== HEADER ===== */

.header {
  text-align: center;
  margin-top: 10px;
}

.logo {
  width: 70px;
  margin-bottom: 8px;
}

.title {
  font-size: 50px;
  font-weight: 800;
}

.subtitle {
  font-size: 58px;
  font-weight: 800;
  color: #e53935;
  margin-top: 10px;
}

/* ===== DETAILS ===== */

.details {
  text-align: center;
  font-size: 36px;
  line-height: 1.5;
}

.location {
  margin-top: 14px;
  font-size: 32px;
}

.info {
  margin-top: 22px;
  font-size: 34px;
  font-weight: 700;
}

.cap {
  margin-top: 8px;
  font-size: 26px;
  opacity: 0.9;
}

/* ===== CTA ===== */

.cta {
  text-align: center;
}

.cta-box {
  display: inline-block;
  padding: 18px 36px;
  border: 2px solid #fff;
  font-size: 40px;
  font-weight: 800;
  background: rgba(0,0,0,0.4);
}

/* ===== FOOTER ===== */

.footer {
  text-align: center;
  font-size: 26px;
  opacity: 0.85;
}

</style>
</head>

<body>

<div class="card">

  <!-- background -->
  <div class="bg-top"></div>
  <div class="bg-bottom"></div>
  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>
  <div class="divider"></div>

  <!-- cards -->
  <img class="side-card card-left"
    src="https://api.scryfall.com/cards/6e2ffcb9-e94f-4799-ae42-797091df2e09?format=image&version=normal">

  <img class="side-card card-right"
    src="https://api.scryfall.com/cards/a7a8b6b8-b95f-4014-b17a-a6d44d965995?format=image&version=normal">

  <div class="content">

    <!-- sponsors -->
    <div class="sponsors">
      <img src="./assets/sponsor1.png">
      <img src="./assets/sponsor2.jpeg">
      <img src="./assets/sponsor3.webp">
      <img src="./assets/sponsor4.png">
      <img src="./assets/sponsor5.png">
      <img src="./assets/sponsor6.png">
    </div>

    <!-- header -->
    <div class="header">
      <img src="./assets/BCPMM.svg" class="logo">
      <div class="title">B.C. Premodern Masters II</div>
      <div class="subtitle">The Vancouver Premodern Brewhouse Brawl</div>
    </div>

    <!-- details -->
    <div class="details">
      April 11, 2026 · 11:00 AM

      <div class="location">
        Strange Fellows Brewing<br>
        Vancouver, BC
      </div>

      <div class="info">
        Premodern Constructed<br>
        5 Rounds · Top 8 · $40 Entry
      </div>

      <div class="cap">
        64 Player Cap · BC Cancer Charity Event
      </div>
    </div>

    <!-- CTA -->
    <div class="cta">
      <div class="cta-box">
        Signups: Magic1.ca
      </div>
    </div>

    <!-- footer -->
    <div class="footer">
      BC Cancer Charity Event
    </div>

  </div>

</div>

</body>
</html>
