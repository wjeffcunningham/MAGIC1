<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BCPMM #2: Brewhall Champs · Gallery · magic1.ca</title>
  <meta name="description" content="Photo gallery for BCPMM #2: Brewhall Champs — April 11, 2026."/>
  <link rel="icon" type="image/svg+xml" href="/assets/BCPMM.svg"/>
  <link rel="stylesheet" href="/css/bcpmm-shell.css"/>
  <script>
    if (localStorage.getItem('bcpmm-theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.addEventListener('DOMContentLoaded', function () {
        document.documentElement.classList.remove('dark');
        document.body.classList.add('dark');
      });
    }
  </script>
  <style>
    :root {
      --bg:#f3f6ff; --card:#ffffff; --item-bg:#fbfdff;
      --ink:#0f172a; --muted:#475569;
      --border:rgba(15,23,42,.12); --shadow:0 10px 30px rgba(15,23,42,.08);
      --radius:16px; --max:960px; --accent:#1f6feb;
    }
    body.dark {
      --bg:#0d1117; --card:#161b22; --item-bg:#0d1117;
      --ink:#e6edf3; --muted:#8b949e;
      --border:rgba(240,246,252,.1); --shadow:0 10px 30px rgba(0,0,0,.35);
      --accent:#58a6ff;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 50% -150px,rgba(31,111,235,.18),transparent 60%),linear-gradient(var(--bg),#ffffff 65%);min-height:100vh}
    body.dark{background:radial-gradient(1200px 600px at 50% -150px,rgba(31,111,235,.1),transparent 60%),linear-gradient(var(--bg),#0d1117 65%)}
    a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
    .shell{max-width:var(--max);margin:32px auto 64px;padding:0 18px}

    .page-header{text-align:center;margin-bottom:22px}
    .page-header h1{font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
    .page-header p{color:var(--muted);margin:0;font-size:.88rem}
    .back-link{display:inline-block;margin-top:8px;font-size:.84rem;font-weight:650;color:var(--accent)}

    /* ── filter pills ── */
    .filters{display:flex;justify-content:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .fpill{padding:7px 18px;border:1px solid var(--border);border-radius:0;background:var(--card);font-size:.82rem;font-weight:650;color:var(--muted);cursor:pointer;transition:all .18s;user-select:none;letter-spacing:.03em}
    .fpill:hover{border-color:rgba(31,111,235,.35);color:var(--ink)}
    .fpill.active{background:var(--ink);color:var(--card);border-color:var(--ink)}
    body.dark .fpill.active{background:var(--ink);color:var(--bg)}

    /* ── slideshow wrapper ── */
    .slideshow{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;box-shadow:0 20px 60px rgba(15,23,42,.22);aspect-ratio:3/2}
    body.dark .slideshow{box-shadow:0 20px 60px rgba(0,0,0,.6)}

    .slide{position:absolute;inset:0;opacity:0;transition:opacity .55s ease}
    .slide.active{opacity:1}

    .slide img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;transition:filter .4s ease}

    /* ── filter effects ── */
    .filter-natural img{filter:none}
    .filter-sepia   img{filter:sepia(.85) contrast(1.05) brightness(.98)}

    /* caption overlay */
    .slide-caption{position:absolute;bottom:0;left:0;right:0;padding:28px 22px 16px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:rgba(255,255,255,.88);font-size:.88rem;line-height:1.4;pointer-events:none;opacity:0;transition:opacity .3s}
    .slide.active .slide-caption{opacity:1}

    /* arrows */
    .arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.32);border:none;color:#fff;font-size:1.8rem;width:48px;height:48px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:10}
    .arrow:hover{background:rgba(0,0,0,.6)}
    .arrow.prev{left:14px} .arrow.next{right:14px}
    @media(max-width:500px){.arrow{width:36px;height:36px;font-size:1.4rem}}

    /* counter + dots */
    .slide-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 2px}
    .slide-counter{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

    .dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:420px}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--border);border:1.5px solid rgba(15,23,42,.18);cursor:pointer;transition:background .18s,transform .18s;flex-shrink:0}
    body.dark .dot{border-color:rgba(240,246,252,.15)}
    .dot.active{background:var(--accent);transform:scale(1.25)}

    /* auto-play toggle */
    .play-btn{padding:5px 12px;border:1px solid var(--border);background:var(--card);border-radius:0;font-size:.78rem;font-weight:650;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
    .play-btn:hover{border-color:rgba(31,111,235,.35);color:var(--accent)}
    .play-btn.playing{border-color:rgba(31,111,235,.4);color:var(--accent);background:rgba(31,111,235,.05)}

    /* key hint */
    .key-hint{text-align:center;margin-top:10px;font-size:.72rem;color:var(--muted);letter-spacing:.03em;opacity:.7}
    .key-hint kbd{display:inline-block;padding:1px 6px;border:1px solid var(--border);border-radius:4px;font-size:.7rem;font-family:inherit;background:var(--item-bg)}

    /* music button */
    .music-wrap{display:flex;justify-content:center;margin-bottom:18px}
    .music-btn{display:flex;align-items:center;gap:12px;padding:14px 32px;border-radius:0;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:all .2s;font-size:1.05rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
    .music-btn:hover{border-color:rgba(31,111,235,.4);color:var(--accent);box-shadow:0 8px 28px rgba(31,111,235,.12)}
    .music-btn.playing{border-color:rgba(31,111,235,.5);color:var(--accent);background:rgba(31,111,235,.05)}
    .music-btn .music-icon{font-size:2rem;line-height:1}
    .music-btn .music-label{display:flex;flex-direction:column;gap:1px;text-align:left}
    .music-btn .music-title{font-size:1rem;font-weight:700;color:inherit}
    .music-btn .music-sub{font-size:.72rem;font-weight:400;color:var(--muted);letter-spacing:.01em}

    .pg-footer{margin-top:32px;text-align:center;color:var(--muted);font-size:.88rem}
    .pg-footer a{color:var(--accent)}
  </style>
</head>
<body>
<div id="global-menu-root"></div>
<div class="shell">

  <div class="page-header">
    <h1>BCPMM #2: Brewhall Champs — Gallery</h1>
    <p>April 11, 2026 · Strange Fellows Brewing, Vancouver</p>
    <a class="back-link" href="index.html">← Back to Coverage</a>
  </div>

  <div class="filters">
    <div class="fpill active" data-filter="natural">Natural</div>
    <div class="fpill" data-filter="sepia">Sepia</div>
  </div>

  <div class="music-wrap">
    <button class="music-btn" id="musicBtn">
      <span class="music-icon">🎵</span>
      <span class="music-label">
        <span class="music-title">Play Soundtrack</span>
        <span class="music-sub">gallery/theme.mp3</span>
      </span>
    </button>
  </div>

  <div class="slideshow filter-natural" id="slideshow"></div>

  <div class="key-hint"><kbd>←</kbd> &nbsp; prev &nbsp;·&nbsp; next &nbsp;<kbd>→</kbd> &nbsp;·&nbsp; click image to advance</div>

  <div class="slide-footer">
    <span class="slide-counter" id="counter">1 / 23</span>
    <div class="dots" id="dots"></div>
    <button class="play-btn" id="playBtn">▶ Auto</button>
  </div>

  <div class="pg-footer">
    © B.C. Premodern Masters · <a href="index.html">Coverage</a> · <a href="../../">magic1.ca</a>
  </div>

</div>

<audio id="bgAudio" loop src="gallery/theme.mp3"></audio>

<script>
/* ═══════════════════════════════════════
   ITEMS — fill in captions as needed
═══════════════════════════════════════ */
const ITEMS = [
  { file: 'gallery/01.JPG', caption: '' },
  { file: 'gallery/02.JPG', caption: '' },
  { file: 'gallery/03.JPG', caption: '' },
  { file: 'gallery/04.JPG', caption: '' },
  { file: 'gallery/05.JPG', caption: '' },
  { file: 'gallery/06.JPG', caption: '' },
  { file: 'gallery/07.JPG', caption: '' },
  { file: 'gallery/08.JPG', caption: '' },
  { file: 'gallery/09.JPG', caption: '' },
  { file: 'gallery/10.JPG', caption: '' },
  { file: 'gallery/11.JPG', caption: '' },
  { file: 'gallery/12.JPG', caption: '' },
  { file: 'gallery/13.JPG', caption: '' },
  { file: 'gallery/14.JPG', caption: '' },
  { file: 'gallery/15.JPG', caption: '' },
  { file: 'gallery/16.JPG', caption: '' },
  { file: 'gallery/17.JPG', caption: '' },
  { file: 'gallery/18.JPG', caption: '' },
  { file: 'gallery/19.JPG', caption: '' },
  { file: 'gallery/20.JPG', caption: '' },
  { file: 'gallery/21.JPG', caption: '' },
  { file: 'gallery/22.JPG', caption: '' },
  { file: 'gallery/23.JPG', caption: '' },
];

const ss    = document.getElementById('slideshow');
const dotsEl= document.getElementById('dots');
const ctrEl = document.getElementById('counter');
const playBtn= document.getElementById('playBtn');
let cur = 0;
let autoTimer = null;

/* build slides */
ITEMS.forEach((item, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (i === 0 ? ' active' : '');
  slide.innerHTML = `<img src="${item.file}" alt="${item.caption || ''}" loading="${i < 3 ? 'eager' : 'lazy'}"/>
    ${item.caption ? `<div class="slide-caption">${item.caption}</div>` : ''}`;
  ss.appendChild(slide);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(dot);
});

/* arrows */
const prev = document.createElement('button');
prev.className = 'arrow prev'; prev.textContent = '‹';
prev.addEventListener('click', () => step(-1));
ss.appendChild(prev);

const next = document.createElement('button');
next.className = 'arrow next'; next.textContent = '›';
next.addEventListener('click', () => step(1));
ss.appendChild(next);

function goTo(i) {
  document.querySelectorAll('.slide')[cur].classList.remove('active');
  document.querySelectorAll('.dot')[cur].classList.remove('active');
  cur = (i + ITEMS.length) % ITEMS.length;
  document.querySelectorAll('.slide')[cur].classList.add('active');
  document.querySelectorAll('.dot')[cur].classList.add('active');
  ctrEl.textContent = `${cur + 1} / ${ITEMS.length}`;
}

function step(d) { goTo(cur + d); }

/* keyboard */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  step(-1);
  if (e.key === 'ArrowRight') step(1);
});

/* auto-play */
function startAuto() {
  autoTimer = setInterval(() => step(1), 3500);
  playBtn.textContent = '⏸ Auto';
  playBtn.classList.add('playing');
}
function stopAuto() {
  clearInterval(autoTimer); autoTimer = null;
  playBtn.textContent = '▶ Auto';
  playBtn.classList.remove('playing');
}
playBtn.addEventListener('click', () => autoTimer ? stopAuto() : startAuto());

/* click slideshow to advance */
ss.addEventListener('click', e => {
  if (e.target.closest('.arrow')) return;
  step(1);
});

/* music */
const audio    = document.getElementById('bgAudio');
const musicBtn = document.getElementById('musicBtn');
let musicOn = false;
musicBtn.addEventListener('click', () => {
  musicOn = !musicOn;
  if (musicOn) {
    audio.play().catch(() => {});
    musicBtn.querySelector('.music-icon').textContent = '🔊';
    musicBtn.querySelector('.music-title').textContent = 'Now Playing';
    musicBtn.classList.add('playing');
  } else {
    audio.pause();
    musicBtn.querySelector('.music-icon').textContent = '🎵';
    musicBtn.querySelector('.music-title').textContent = 'Play Soundtrack';
    musicBtn.classList.remove('playing');
  }
});
document.querySelectorAll('.fpill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.fpill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    ss.className = `slideshow filter-${pill.dataset.filter}`;
  });
});
</script>
<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
