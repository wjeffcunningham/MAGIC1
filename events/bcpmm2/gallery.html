<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BCPMM #2: Brewhall Champs · Gallery · magic1.ca</title>
  <meta name="description" content="Photo and video gallery for BCPMM #2: Brewhall Champs — April 11, 2026."/>
  <link rel="icon" type="image/svg+xml" href="/assets/BCPMM.svg"/>
  <link rel="stylesheet" href="/css/bcpmm-shell.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (localStorage.getItem('bcpmm-theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.addEventListener('DOMContentLoaded', function () {
        document.documentElement.classList.remove('dark');
        document.body.classList.add('dark');
      });
    }
  </script>
  <style>
    :root {
      --bg:#f3f6ff; --card:#ffffff; --item-bg:#fbfdff;
      --ink:#0f172a; --muted:#475569;
      --border:rgba(15,23,42,.12); --shadow:0 10px 30px rgba(15,23,42,.08);
      --radius:16px; --max:1100px; --accent:#1f6feb;
    }
    body.dark {
      --bg:#0d1117; --card:#161b22; --item-bg:#0d1117;
      --ink:#e6edf3; --muted:#8b949e;
      --border:rgba(240,246,252,.1); --shadow:0 10px 30px rgba(0,0,0,.35);
      --accent:#58a6ff;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 50% -150px,rgba(31,111,235,.18),transparent 60%),linear-gradient(var(--bg),#ffffff 65%);min-height:100vh}
    body.dark{background:radial-gradient(1200px 600px at 50% -150px,rgba(31,111,235,.1),transparent 60%),linear-gradient(var(--bg),#0d1117 65%)}
    a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
    .shell{max-width:var(--max);margin:32px auto 64px;padding:0 18px}

    .page-header{text-align:center;margin-bottom:24px}
    .page-header h1{font-size:clamp(1.5rem,3.5vw,2rem);font-weight:800;margin:0 0 5px;letter-spacing:-.02em}
    .page-header p{color:var(--muted);margin:0;font-size:.92rem}
    .back-link{display:inline-block;margin-top:9px;font-size:.85rem;font-weight:650}

    /* admin bar */
    .admin-bar{display:none;align-items:center;gap:8px;margin-bottom:18px;padding:10px 16px;background:rgba(31,111,235,.07);border:1px solid rgba(31,111,235,.22);border-radius:10px;font-size:.84rem;color:var(--accent);font-weight:650}
    .admin-bar.visible{display:flex}

    /* grid */
    .gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:720px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:440px){.gallery-grid{grid-template-columns:1fr}}

    /* item */
    .g-item{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:border-color .18s,box-shadow .18s,transform .18s}
    .g-item:hover{border-color:rgba(31,111,235,.28);box-shadow:0 14px 36px rgba(15,23,42,.13);transform:translateY(-2px)}
    body.dark .g-item:hover{border-color:rgba(88,166,255,.3)}

    .g-thumb{position:relative;width:100%;aspect-ratio:4/3;background:var(--item-bg);overflow:hidden;cursor:pointer;flex-shrink:0}
    .g-thumb img,.g-thumb video{display:block;width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .25s}
    .g-item:hover .g-thumb img,.g-item:hover .g-thumb video{transform:scale(1.03)}

    .g-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);transition:background .18s}
    .g-item:hover .g-play{background:rgba(0,0,0,.16)}
    .g-play svg{width:52px;height:52px;fill:rgba(255,255,255,.9);filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}

    .g-caption-wrap{padding:8px 11px 10px;flex:1}
    .g-caption{font-size:.8rem;color:var(--muted);line-height:1.35;min-height:1em}

    /* admin textarea */
    .g-caption-input{width:100%;font-size:.8rem;color:var(--ink);background:var(--item-bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;line-height:1.35;resize:none;font-family:inherit;outline:none;min-height:38px;transition:border-color .18s,box-shadow .18s}
    .g-caption-input:focus{border-color:rgba(31,111,235,.4);box-shadow:0 0 0 2px rgba(31,111,235,.1)}
    .g-save-status{font-size:.67rem;margin-top:3px;min-height:1em;color:transparent;transition:color .15s}
    .g-save-status.saving{color:var(--accent)} .g-save-status.saved{color:#22a060} .g-save-status.error{color:#c84b3c}

    /* lightbox */
    .lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 60px}
    .lb.open{display:flex}
    .lb-media{display:flex;align-items:center;justify-content:center;max-width:min(92vw,1000px);max-height:76vh}
    .lb-media img{display:block;max-width:100%;max-height:76vh;border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,.7)}
    .lb-media video{display:block;max-width:100%;max-height:76vh;border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,.7)}
    .lb-caption{color:rgba(255,255,255,.8);font-size:.92rem;text-align:center;max-width:680px;line-height:1.5;min-height:1.3em}
    .lb-btn{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;color:#fff;font-size:1.8rem;width:48px;height:48px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:2001}
    .lb-btn:hover{background:rgba(255,255,255,.22)}
    #lbPrev{left:12px} #lbNext{right:12px}
    #lbClose{position:fixed;top:14px;right:18px;background:none;border:none;color:rgba(255,255,255,.65);font-size:2.2rem;cursor:pointer;z-index:2002;line-height:1;transition:color .15s}
    #lbClose:hover{color:#fff}
    #lbCounter{position:fixed;top:18px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.4);font-size:.75rem;z-index:2001;letter-spacing:.07em}
    @media(max-width:500px){.lb{padding:16px 48px}.lb-btn{width:38px;height:38px;font-size:1.4rem}}

    .pg-footer{margin-top:28px;text-align:center;color:var(--muted);font-size:.88rem}
    .pg-footer a{color:var(--accent)}
  </style>
</head>
<body>
<div id="global-menu-root"></div>
<div class="shell">

  <div class="page-header">
    <h1>BCPMM #2: Brewhall Champs — Gallery</h1>
    <p>Photos &amp; video · April 11, 2026 · Strange Fellows Brewing, Vancouver</p>
    <a class="back-link" href="index.html">← Back to Coverage</a>

    🔧 Admin — click any caption field to edit. Saves automatically.
  </div>

  <div class="pg-footer">
    © B.C. Premodern Masters · <a href="index.html">Coverage</a> · <a href="../../">magic1.ca</a>
  </div>

</div>

<!-- lightbox -->
<div class="lb" id="lb">

/* ═══════════════════════════════════════════════════
   RUNTIME
═══════════════════════════════════════════════════ */
let isAdmin = false;
let captions = {};
let currentIdx = 0;

function isVid(item) {
  return item.type === 'video' || /\.(mp4|mov|webm)$/i.test(item.file);
}

async function loadCaptions() {
  const sb = window.auth?._client;
  if (!sb || !ITEMS.length) return;
  const { data } = await sb
    .from('gallery_captions')
    .select('id, caption')
    .eq('event_id', EVENT_ID)
    .in('id', ITEMS.map(i => i.file));
  if (data) data.forEach(r => { captions[r.id] = r.caption; });
}

async function saveCaption(file, caption, statusEl) {
  const sb = window.auth?._client;
  if (!sb) return;
  statusEl.className = 'g-save-status saving';
  statusEl.textContent = 'Saving…';
  const { error } = await sb
    .from('gallery_captions')
    .upsert({ id: file, event_id: EVENT_ID, caption }, { onConflict: 'id' });
  if (error) {
    statusEl.className = 'g-save-status error';
    statusEl.textContent = 'Error — not saved';
  } else {
    captions[file] = caption;
    statusEl.className = 'g-save-status saved';
    statusEl.textContent = 'Saved ✓';
    setTimeout(() => { statusEl.textContent = ''; statusEl.className = 'g-save-status'; }, 2200);
  }
}

function buildGrid() {
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';
  ITEMS.forEach((item, i) => {
    const cap = captions[item.file] ?? item.caption ?? '';
    const video = isVid(item);
    const el = document.createElement('div');
    el.className = 'g-item';

    const thumb = document.createElement('div');
    thumb.className = 'g-thumb';
    thumb.addEventListener('click', () => openLb(i));
    if (video) {
      thumb.innerHTML = `<video src="${item.file}" preload="metadata" style="width:100%;height:100%;object-fit:cover;pointer-events:none;"></video>
        <div class="g-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>`;
    } else {
      thumb.innerHTML = `<img src="${item.file}" alt="${cap}" loading="lazy"/>`;
    }
    el.appendChild(thumb);

    const wrap = document.createElement('div');
    wrap.className = 'g-caption-wrap';
    if (isAdmin) {
      const ta = document.createElement('textarea');
      ta.className = 'g-caption-input';
      ta.rows = 2;
      ta.value = cap;
      ta.placeholder = 'Add a caption…';
      const status = document.createElement('div');
      status.className = 'g-save-status';
      let timer;
      ta.addEventListener('input', () => {
        item._live = ta.value;
        clearTimeout(timer);
        timer = setTimeout(() => saveCaption(item.file, ta.value.trim(), status), 800);
      });
      wrap.appendChild(ta);
      wrap.appendChild(status);
    } else {
      const d = document.createElement('div');
      d.className = 'g-caption';
      d.textContent = cap;
      wrap.appendChild(d);
    }
    el.appendChild(wrap);
    grid.appendChild(el);
  });
}

/* lightbox */
const lb      = document.getElementById('lb');
const lbMedia = document.getElementById('lbMedia');
const lbCapEl = document.getElementById('lbCaption');
const lbCount = document.getElementById('lbCounter');

function openLb(i) {
  currentIdx = i;
  renderLb();
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLb() {
  lb.classList.remove('open');
  lbMedia.innerHTML = '';
  document.body.style.overflow = '';
}

function renderLb() {
  const item = ITEMS[currentIdx];
  const cap = item._live ?? captions[item.file] ?? item.caption ?? '';
  lbCount.textContent = `${currentIdx + 1} / ${ITEMS.length}`;
  lbCapEl.textContent = cap;
  if (isVid(item)) {
    lbMedia.innerHTML = `<video controls autoplay playsinline><source src="${item.file}"></video>`;
  } else {
    lbMedia.innerHTML = `<img src="${item.file}" alt="${cap}"/>`;
  }
}

function step(d) {
  currentIdx = (currentIdx + d + ITEMS.length) % ITEMS.length;
  lbMedia.innerHTML = '';
  renderLb();
}

document.getElementById('lbClose').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', () => step(-1));
document.getElementById('lbNext').addEventListener('click', () => step(1));
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

async function init() {
  await window.auth?.ready?.();
  const sb = window.auth?._client;
  if (sb) {
    const { data: { user } } = await sb.auth.getUser();
    if (user) {
      const { data: role } = await sb
        .from('user_roles').select('role')
        .eq('user_id', user.id).eq('role', 'admin').maybeSingle();
      if (role) {
        isAdmin = true;
        document.getElementById('adminBar').classList.add('visible');
      }
    }
  }
  await loadCaptions();
  buildGrid();
}

document.addEventListener('DOMContentLoaded', init);

</html>
