<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Premodern Masters · January 10, 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">
  <div class="max-w-xl mx-auto px-4 py-10">

    <h1 class="text-2xl font-bold mb-4">
      B.C. Premodern Masters — January 10, 2026
    </h1>

    <p class="text-sm text-slate-700 mb-6">
      Registration & payment is handled by Magic Stronghold Games.  
      Please register there first, then add yourself to the BCWL system.
    </p>

    <a href="https://www.magicstronghold.com/store/category/Magic%20The%20Gathering%20Events/item/426799/BC_Secret_Masters:_Legends_Series_(January_10th_@_11:00am)"
       target="_blank"
       class="inline-block bg-sky-700 text-white px-4 py-2 rounded-md text-sm font-semibold mb-8">
      Register at Magic Stronghold
    </a>

    <!-- Internal registration form -->
    <form id="event-register-form" class="space-y-4 bg-white p-6 rounded-xl shadow">

      <div>
        <label class="block text-sm font-medium mb-1">Full Name</label>
        <input type="text" name="full_name"
               class="w-full border px-3 py-2 rounded-md" required />
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" name="email"
               class="w-full border px-3 py-2 rounded-md" required />
      </div>

      <div>
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" name="paid" required />
          I confirm I registered + paid at Magic Stronghold
        </label>
      </div>

      <button class="bg-sky-600 text-white px-4 py-2 rounded-md text-sm font-semibold">
        Add Me to the Event
      </button>

      <p id="event-message" class="text-sm text-slate-700 hidden"></p>
    </form>
  </div>

  <script type="module" src="/js/event-register.js"></script>

</body>
</html>
