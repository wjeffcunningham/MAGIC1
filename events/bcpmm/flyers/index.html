<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BCPMM Flyers · B.C. Premodern Masters</title>

<style>
:root{
  --bg:#f5f7fb;
  --ink:#0f172a;
  --muted:#475569;
  --max:1100px;
  --pad:24px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

.shell{
  max-width:var(--max);
  margin:60px auto 80px;
  padding:0 var(--pad);
}

/* ================= HEADER ================= */

header{
  text-align:center;
  margin-bottom:80px;
}

h1{
  margin:0 0 8px;
  font-size:clamp(1.6rem,3vw,2.2rem);
}

.sub{
  margin:0;
  color:var(--muted);
}

.nav{
  margin-top:14px;
}

.nav a{
  text-decoration:none;
  font-weight:600;
  color:#1f6feb;
}

/* ================= HERO CYCLER ================= */

.hero{
  text-align:center;
  margin-bottom:100px;
}

.hero-frame{
  width:760px;
  max-width:100%;
  height:520px;               /* fixed height prevents jump */
  margin:0 auto;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  cursor:pointer;
}

.hero-frame img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;          /* preserves true proportions */
  display:block;
}

.tint{
  position:absolute;
  inset:0;
  mix-blend-mode:multiply;
  opacity:0.6;                 /* soft pastel effect */
  pointer-events:none;
}

/* ================= SMALL POSTERS ================= */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:28px;
}

.card{
  background:#fff;
  padding:18px;
}

.card img{
  width:100%;
  height:auto;
  display:block;
}

.caption{
  margin-top:10px;
  font-size:.85rem;
  color:var(--muted);
  text-align:center;
}

.footer{
  margin-top:80px;
  text-align:center;
  font-size:.85rem;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="shell">

<header>
  <h1>BCPMM Flyers & Posters</h1>
  <p class="sub">
    Promotional material for the B.C. Premodern Masters.
  </p>
  <div class="nav">
    <a href="../../">magic1.ca</a>
  </div>
</header>

<!-- ================= HERO (MAIN PIECE) ================= -->

<section class="hero">
  <div class="hero-frame" onclick="cycleFlyer()">
    <img id="hero-img" src="BCPMM(front)1.png" alt="Quarter Flyer">
    <div id="tint-layer" class="tint"></div>
  </div>
  <div class="caption">
    Quarter-Page Flyers · Click to cycle
  </div>
</section>

<!-- ================= OTHER POSTERS ================= -->

<section class="grid">

  <div class="card">
    <a href="BCPMM_poster.jpg" target="_blank">
      <img src="BCPMM_poster.jpg" alt="">
    </a>
    <div class="caption">Official Tournament Poster</div>
  </div>

  <div class="card">
    <a href="webBCPMM.png" target="_blank">
      <img src="webBCPMM.png" alt="">
    </a>
    <div class="caption">Web Poster (BCPMM)</div>
  </div>

  <div class="card">
    <a href="webBCWL.png" target="_blank">
      <img src="webBCWL.png" alt="">
    </a>
    <div class="caption">Web Poster (BCWL)</div>
  </div>

  <div class="card">
    <a href="prizeboosters.jpg" target="_blank">
      <img src="prizeboosters.jpg" alt="">
    </a>
    <div class="caption">Prize Boosters</div>
  </div>

</section>

<div class="footer">
  © B.C. Premodern Masters · Flyers Archive
</div>

</div>

<script>
/* ================= CYCLER ================= */

const images = [
  "BCPMM(front)1.png",
  "BCPMM(front)2.png",
  "BCPMM(front)3.png",
  "BCPMM(front)4.png"
];

const colors = [
  "#efd9df",  // soft pink
  "#dde7f3",  // soft blue
  "#f3edd6",  // soft yellow
  "#e1efe4"   // soft green
];

let idx = 0;

function cycleFlyer(){
  idx = (idx + 1) % images.length;
  document.getElementById("hero-img").src = images[idx];
  document.getElementById("tint-layer").style.background = colors[idx];
}

/* initialize first tint */
document.getElementById("tint-layer").style.background = colors[0];
</script>

</body>
</html>
