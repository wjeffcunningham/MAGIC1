<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>User Settings · magic1.ca</title>

<style>
  body {
    margin:0;
    padding:0;
    font-family:-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    background:#fafafa;
  }
  .shell {
    max-width:800px;
    margin:80px auto;
    padding:24px;
    background:white;
    border:2px solid black;
    border-radius:12px;
  }
  h1 {
    text-align:center;
    margin:10px 0 24px;
  }
  .avatar-wrap {
    display:flex;
    justify-content:center;
    margin-bottom:12px;
  }
  #avatar-img {
    width:96px;
    height:96px;
    border-radius:12px;
    border:2px solid #000;
    object-fit:cover;
    background:#eee;
  }
  label {
    font-weight:600;
    display:block;
    margin-top:14px;
  }
  input, select, textarea {
    width:100%;
    box-sizing:border-box;
    padding:8px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #888;
    font-family:inherit;
    font-size:1rem;
  }
  input[readonly] {
    background:#e5e5e5;
  }
  textarea { min-height:120px; resize:vertical; }
  .muted { font-size:0.85rem; opacity:0.7; }
  .btn {
    margin-top:20px;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid #111;
    background:#000;
    color:white;
    cursor:pointer;
    font-weight:600;
  }
  #status { font-size:0.85rem; opacity:0.75; margin-top:10px; }
</style>
</head>
<body>

<div class="shell">
  <div class="avatar-wrap">
    <img id="avatar-img" src="/assets/default-avatar.png" alt="Profile photo" />
  </div>

  <h1>Your Settings</h1>

  <div id="not-logged">
    <p>Please sign in first.</p>
  </div>

  <div id="settings-area" style="display:none;">

    <label for="email-input">Email (cannot be changed)</label>
    <input id="email-input" type="email" readonly />

    <label for="name-input">Display Name</label>
    <input id="name-input" type="text" placeholder="Your league name" />

    <label for="remote-input">Remote Play Preference</label>
    <select id="remote-input">
      <option value="no_remote">In-Person Only</option>
      <option value="remote_mtgo">Remote OK (MTGO)</option>
      <option value="remote_webcam">Remote OK (Webcam)</option>
      <option value="remote_both">Remote OK (Both)</option>
    </select>
    <p class="muted">
      (Under the hood this still stores simple “in-person only” vs “remote OK”.
      We can add finer categories to the DB later if you want.)
    </p>

    <label for="image-file">Profile Photo (optional)</label>
    <input id="image-file" type="file" accept="image/*" />
    <p class="muted">
      Square images look best; ~1&nbsp;MB or less is ideal.
    </p>

    <label for="bio-input">Bio / Notes (optional)</label>
    <textarea id="bio-input"></textarea>

    <button class="btn" id="save-btn">Save Settings</button>
    <p id="status"></p>
  </div>
</div>

<script type="module" src="/js/db.js"></script>
<script type="module" src="/js/global-menu-loader.js"></script>
<script type="module" src="/js/settings.js"></script>

</body>
</html>
