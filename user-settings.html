<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>User Settings · magic1.ca</title>

<style>
  body {
    margin:0;
    padding:0;
    font-family:-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    background:#fafafa;
  }
  .shell {
    max-width:800px;
    margin:80px auto;
    padding:24px;
    background:white;
    border:2px solid black;
    border-radius:12px;
  }
  h1 {
    text-align:center;
    margin:10px 0 24px;
  }
  .avatar-wrap {
    display:flex;
    justify-content:center;
    margin-bottom:12px;
  }
  #avatar-img {
    width:96px;
    height:96px;
    border-radius:12px;
    border:2px solid #000;
    object-fit:cover;
    background:#eee;
  }
  label {
    font-weight:600;
    display:block;
    margin-top:14px;
  }
  input, select, textarea {
    width:100%;
    box-sizing:border-box;
    padding:8px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #888;
    font-family:inherit;
    font-size:1rem;
  }
  input[readonly] {
    background:#e5e5e5;
  }
  textarea {
    min-height:120px;
    resize:vertical;
  }
  .muted {
    font-size:0.85rem;
    opacity:0.7;
  }
  .btn {
    margin-top:20px;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid #111;
    background:#000;
    color:white;
    cursor:pointer;
    font-weight:600;
  }
  #status {
    font-size:0.85rem;
    opacity:0.75;
    margin-top:10px;
  }
</style>
</head>

<body>

<div class="shell">

  <div class="avatar-wrap">
    <img
      id="avatar-img"
      src="/assets/default-avatar.png"
      alt="Profile photo"
    />
  </div>

  <div id="account-state-banner" style="display:none;"></div>

  <h1>Your Settings</h1>

  <!-- Logged out -->
  <div id="not-logged">
    <p>Please sign in first.</p>
  </div>

  <!-- Settings -->
  <div id="settings-area" style="display:none;">

    <!-- EMAIL -->
    <label for="email-input">Email</label>
    <input id="email-input" type="email" readonly />

    <!-- MODERATED DISPLAY HANDLE -->
    <div id="display-handle-wrap" style="margin-top:14px; display:none;">
      <label>League Display Name</label>
      <div
        id="display-handle"
        class="muted"
        style="
          padding:8px 10px;
          border-radius:8px;
          border:1px solid #ccc;
          background:#f0f0f0;
          font-weight:600;
          margin-top:6px;
        "
      ></div>
      <p class="muted" style="margin-top:6px;">
        This name is set by moderators and is what other players will see.
      </p>
    </div>

    <!-- USER HANDLE -->
    <label for="name-input">Your Handle</label>
    <input
      id="name-input"
      type="text"
      placeholder="3–20 chars, letters / numbers / underscore"
    />
    <p class="muted">
      You can change this at any time. If a moderator override exists, your handle is saved but not shown publicly.
    </p>

    <!-- REMOTE -->
    <label for="remote-input">Remote Play Preference</label>
    <select id="remote-input">
      <option value="no_remote">In-Person Only</option>
      <option value="remote_mtgo">Remote OK (MTGO)</option>
      <option value="remote_webcam">Remote OK (Webcam)</option>
      <option value="remote_both">Remote OK (Both)</option>
    </select>

    <!-- BIO -->
    <label for="bio-input">Bio / Notes (optional)</label>
    <textarea id="bio-input"></textarea>

    <!-- SAVE -->
    <button class="btn" id="save-btn">Save Settings</button>
    <p id="status"></p>

  </div>
</div>

<script type="module" src="/js/global-menu-loader.js"></script>
<script type="module" src="/js/settings.js"></script>

<script type="module">
  import { renderAccountStateBanner } from "/js/account-state.js";
  renderAccountStateBanner({ page: "settings" });
</script>

</body>
</html>
