<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>User Settings · magic1.ca</title>

<style>
  body {
    margin:0;
    padding:0;
    font-family:-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    background:#faf5ff;
  }

  .shell {
    max-width:900px;
    margin:60px auto;
    padding:40px 30px 30px;
    background:white;
    border:3px solid #000;
    border-radius:28px;
  }

  .avatar-wrap {
    text-align:center;
    margin-bottom:10px;
  }

  .avatar-frame {
    width:96px;
    height:96px;
    margin:0 auto 10px;
    border-radius:18px;
    border:3px solid #000;
    overflow:hidden;
    background:#f0f0f0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .avatar-frame img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  h1 {
    text-align:center;
    margin:0 0 30px;
    font-size:2.4rem;
  }

  label {
    font-weight:600;
    display:block;
    margin-top:14px;
    margin-bottom:4px;
  }

  input, select, textarea {
    width:100%;
    padding:10px 12px;
    border-radius:12px;
    border:1px solid #777;
    font-size:1rem;
    font-family:inherit;
    box-sizing:border-box;
  }

  input[disabled] {
    background:#eee;
    color:#444;
  }

  textarea {
    min-height:140px;
    resize:vertical;
  }

  .hint {
    font-size:0.8rem;
    opacity:0.7;
    margin-top:2px;
  }

  .btn {
    padding:10px 18px;
    border-radius:12px;
    border:2px solid #000;
    background:#000;
    color:#fff;
    font-weight:600;
    cursor:pointer;
    margin-top:22px;
  }

  #status {
    font-size:0.85rem;
    opacity:0.8;
    margin-top:8px;
  }

  #not-logged {
    text-align:center;
    font-size:1.1rem;
  }
</style>
</head>
<body>

<div class="shell">
  <div class="avatar-wrap">
    <div class="avatar-frame">
      <img id="avatar-img" alt="Profile photo" />
    </div>
  </div>

  <h1>Your Settings</h1>

  <div id="not-logged">
    <p>Please sign in first.</p>
  </div>

  <div id="settings-area" style="display:none;">

    <label for="email-input">Email (cannot be changed)</label>
    <input id="email-input" type="email" disabled />

    <label for="name-input">Display Name</label>
    <input id="name-input" type="text" placeholder="Your league name" />

    <label for="remote-input">Remote Play Preference</label>
    <select id="remote-input">
      <option value="no_remote">No remote play</option>
      <option value="remote_ok">In-store or remote OK</option>
      <option value="remote_only">Remote only</option>
    </select>
    <div class="hint">This is what other players / mods will see.</div>

    <label for="img-input">Profile Image URL (optional)</label>
    <input id="img-input" type="url" placeholder="https://example.com/me.jpg" />

    <label for="image-file">Or upload a profile image (optional)</label>
    <input id="image-file" type="file" accept="image/*" />

    <label for="bio-input">Bio / Notes (optional)</label>
    <textarea id="bio-input" placeholder="Anything you’d like the league organizer to know."></textarea>

    <button class="btn" id="save-btn">Save Settings</button>
    <p id="status"></p>
  </div>
</div>

<script type="module" src="/js/config.js"></script>
<script type="module" src="/js/db.js"></script>
<script type="module" src="/js/global-menu-loader.js"></script>
<script type="module" src="/js/settings.js"></script>

</body>
</html>
