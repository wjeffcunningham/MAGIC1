<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up · magic1.ca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900">

  <!-- GLOBAL MENU LOADER -->
  <script type="module" src="/js/global-menu-loader.js"></script>

  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
      <h1 class="text-2xl font-bold mb-2 text-center">Create Your Account</h1>
      <p class="text-sm text-slate-600 mb-6 text-center">
        Use the same email you used to register at Stronghold.
      </p>

      <form id="signup-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1" for="full_name">
            Full Name
          </label>
          <input
            id="full_name"
            name="full_name"
            type="text"
            required
            class="w-full border rounded px-3 py-2 text-sm"
            placeholder="e.g. W. Jeff Cunningham"
          />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1" for="email">
            Email
          </label>
          <input
            id="email"
            name="email"
            type="email"
            required
            class="w-full border rounded px-3 py-2 text-sm"
            placeholder="you@example.com"
          />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1" for="password">
            Password
          </label>
          <input
            id="password"
            name="password"
            type="password"
            required
            minlength="8"
            class="w-full border rounded px-3 py-2 text-sm"
            placeholder="At least 8 characters"
          />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1" for="password_confirm">
            Confirm Password
          </label>
          <input
            id="password_confirm"
            name="password_confirm"
            type="password"
            required
            minlength="8"
            class="w-full border rounded px-3 py-2 text-sm"
            placeholder="Re-enter your password"
          />
        </div>

        <p id="signup-error" class="text-sm text-red-600 hidden"></p>
        <p id="signup-success" class="text-sm text-emerald-700 hidden"></p>

        <button
          type="submit"
          class="w-full bg-sky-600 text-white py-2 rounded text-sm font-semibold"
        >
          Create Account
        </button>
      </form>

      <p class="text-xs text-slate-500 mt-4 text-center">
        Already have an account?
        <a href="/login.html" class="text-sky-600 underline">Log in</a>
      </p>
    </div>
  </div>

  <script type="module" src="/js/signup.js"></script>
</body>
</html>
