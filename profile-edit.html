<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Profile · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
body { background: var(--bg); color: var(--fg); }

.wrap {
  max-width: 760px;
  margin: 6rem auto 4rem;
  padding: 0 1.5rem;
}

.card {
  border: 1px solid var(--muted);
  border-radius: 16px;
  padding: 24px;
  background: rgba(255,255,255,0.02);
  overflow:hidden;
}

h1 { margin-bottom: 1.5rem; }

label {
  display:block;
  font-weight:700;
  margin:18px 0 6px;
}

input, textarea, select {
  width:100%;
  max-width:100%;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--muted);
  background:transparent;
  color:inherit;
  font-size:0.95rem;
}

textarea { min-height:90px; }

button {
  padding:12px 18px;
  border-radius:12px;
  border:1px solid var(--fg);
  background:transparent;
  font-weight:700;
  cursor:pointer;
  margin-top:16px;
}

.notice { font-weight:700; margin-bottom:12px; }
.notice.approved { color:#4caf50; }
.notice.pending { color:#ff6666; }
.notice.none { color:#ffaa00; }

.subtle {
  font-size:0.85rem;
  opacity:.7;
  margin-top:4px;
}

.hidden { display:none; }

hr { margin:32px 0; opacity:.2; }

.avatar-preview {
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid var(--muted);
  margin-bottom:10px;
}

.remote-options {
  margin-top:10px;
  display:flex;
  gap:18px;
}
</style>
</head>

<body>
<div id="global-menu-root"></div>

<div class="wrap">
<h1>Your Profile</h1>

<div class="card">

<div id="account-email" class="subtle"></div>
<div id="claim-state" class="notice"></div>

<!-- PROFILE FIELDS -->

<label>Alias (public display name)</label>
<input id="alias">

<label>Quote</label>
<textarea id="quote"></textarea>

<label>Local Store</label>
<input id="store">

<label>Avatar</label>
<img id="avatar-preview" class="avatar-preview">
<input type="file" id="avatar-file" accept="image/*">

<label>Remote Play Preference (0–5)</label>
<input type="range" id="remote-scale" min="0" max="5" value="0">
<div class="subtle">
0 = Never · 5 = Only remote
</div>

<div id="remote-options" class="remote-options hidden">
  <label><input type="checkbox" id="remote_mtgo"> MTGO</label>
  <label><input type="checkbox" id="remote_webcam"> Webcam</label>
</div>

<label>Make this profile public</label>
<select id="is_public">
  <option value="false">No</option>
  <option value="true">Yes</option>
</select>

<hr>

<h2>Claim Tournament Identity</h2>
<div class="subtle">
Select yourself from the tournament list.
Complete your profile first.
</div>

<select id="slug-select"></select>

<div>
  <button id="submit-claim">Request Verification</button>
  <button id="retract-claim" class="hidden">Retract Request</button>
</div>

<div id="claim-note-wrap">
  <label>Optional note to admin (150 chars max)</label>
  <textarea id="claim-note" maxlength="150"></textarea>
</div>

<button id="save-profile">Save Profile</button>
<div id="save-status" class="subtle"></div>

</div>
</div>

<script>

const AVATAR_BUCKET = "avatars";

function prettify(slug){
  return slug.split("-").map(w=>w[0].toUpperCase()+w.slice(1)).join(" ");
}

async function init(){

  if(!window.auth) return;

  const supabase = auth._client;
  const user = await auth.getUser();

  if(!user){
    window.location.href = "/join.html";
    return;
  }

  document.getElementById("account-email").textContent =
    `Signed in as ${user.email}`;

  const alias = document.getElementById("alias");
  const quote = document.getElementById("quote");
  const store = document.getElementById("store");
  const remoteScale = document.getElementById("remote-scale");
  const remoteOptions = document.getElementById("remote-options");
  const remoteMtgo = document.getElementById("remote_mtgo");
  const remoteWebcam = document.getElementById("remote_webcam");
  const isPublic = document.getElementById("is_public");
  const slugSelect = document.getElementById("slug-select");
  const claimState = document.getElementById("claim-state");
  const submitClaimBtn = document.getElementById("submit-claim");
  const retractBtn = document.getElementById("retract-claim");
  const claimNote = document.getElementById("claim-note");
  const saveBtn = document.getElementById("save-profile");
  const saveStatus = document.getElementById("save-status");
  const avatarPreview = document.getElementById("avatar-preview");
  const avatarFile = document.getElementById("avatar-file");

  /* Load draft */

  const { data: draft } = await supabase
    .from("user_profiles")
    .select("*")
    .eq("user_id", user.id)
    .maybeSingle();

  if(draft){
    alias.value = draft.alias || "";
    quote.value = draft.quote || "";
    store.value = draft.store || "";
    remoteScale.value = draft.remote_preference || 0;
    remoteMtgo.checked = !!draft.remote_mtgo;
    remoteWebcam.checked = !!draft.remote_webcam;
    isPublic.value = draft.is_public ? "true":"false";
    if(draft.avatar_url) avatarPreview.src = draft.avatar_url;
  }

  remoteOptions.classList.toggle("hidden", remoteScale.value == 0);

  remoteScale.oninput = () => {
    remoteOptions.classList.toggle("hidden", remoteScale.value == 0);
  };

  /* Claim state */

  const { data: approvedClaim } = await supabase
    .from("player_claims")
    .select("*")
    .eq("user_id", user.id)
    .eq("status","approved")
    .maybeSingle();

  const { data: pendingClaim } = await supabase
    .from("player_claims")
    .select("*")
    .eq("user_id", user.id)
    .eq("status","pending")
    .maybeSingle();

  const { data: allProfiles } = await supabase
    .from("player_profiles")
    .select("slug");

  const { data: approvedClaims } = await supabase
    .from("player_claims")
    .select("slug")
    .eq("status","approved");

  const taken = new Set((approvedClaims||[]).map(x=>x.slug));

  slugSelect.innerHTML = `<option value="">— Select yourself —</option>`;

  (allProfiles||[]).forEach(p=>{
    if(taken.has(p.slug)) return;
    const opt = document.createElement("option");
    opt.value = p.slug;
    opt.textContent = prettify(p.slug);
    slugSelect.appendChild(opt);
  });

  if(approvedClaim){
    claimState.textContent = "Verified ✓";
    claimState.className = "notice approved";
    slugSelect.value = approvedClaim.slug;
    slugSelect.disabled = true;
    submitClaimBtn.classList.add("hidden");
    retractBtn.classList.add("hidden");
    isPublic.disabled = false;
  }
  else if(pendingClaim){
    claimState.textContent = "Verification pending";
    claimState.className = "notice pending";
    slugSelect.value = pendingClaim.slug;
    slugSelect.disabled = true;
    submitClaimBtn.classList.add("hidden");
    retractBtn.classList.remove("hidden");
    isPublic.disabled = true;
  }
  else{
    claimState.textContent = "Not verified";
    claimState.className = "notice none";
    isPublic.disabled = true;
  }

  submitClaimBtn.onclick = async ()=>{
    if(!slugSelect.value) return;
    await supabase.from("player_claims").insert({
      user_id:user.id,
      slug:slugSelect.value,
      status:"pending",
      note:claimNote.value.trim() || null
    });
    location.reload();
  };

  retractBtn.onclick = async ()=>{
    await supabase
      .from("player_claims")
      .delete()
      .eq("user_id",user.id)
      .eq("status","pending");
    location.reload();
  };

  saveBtn.onclick = async ()=>{
    saveStatus.textContent = "Saving…";

    let avatar_url = draft?.avatar_url || null;

    const file = avatarFile.files[0];
    if(file){
      const path = `${user.id}/${Date.now()}-${file.name}`;
      await supabase.storage.from(AVATAR_BUCKET).upload(path,file,{upsert:true});
      avatar_url =
        supabase.storage.from(AVATAR_BUCKET).getPublicUrl(path).data.publicUrl;
    }

    await supabase.from("user_profiles").upsert({
      user_id:user.id,
      alias:alias.value.trim()||null,
      quote:quote.value.trim()||null,
      store:store.value.trim()||null,
      remote_preference:Number(remoteScale.value),
      remote_mtgo:remoteMtgo.checked,
      remote_webcam:remoteWebcam.checked,
      avatar_url,
      is_public:isPublic.value==="true" && !!approvedClaim,
      updated_at:new Date().toISOString()
    });

    saveStatus.textContent = "Saved.";
  };

}

window.addEventListener("load", init);

</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
