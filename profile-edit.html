<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Admin · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/bcpmm-shell.css" />

<style>
body {
  max-width: 1100px;
  margin: 3rem auto;
  padding: 0 1.5rem;
  font-family: system-ui, sans-serif;
}
.logo { width: 120px; margin-bottom: 1.5rem; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { padding: 0.7rem; border-bottom: 1px solid #ddd; vertical-align: top; }
button { padding: 0.5rem 0.9rem; cursor: pointer; font-weight: 600; }
.section { margin-top: 3rem; }
.small { font-size: 0.85rem; opacity: 0.75; }
.avatar-small {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #ccc;
}
</style>
</head>

<body>

<div id="global-menu-root"></div>

<img src="/assets/BCPMMsvg.png" class="logo">
<h1>Admin Panel</h1>

<div class="section">
  <h2>Pending Claims</h2>
  <table>
    <thead>
      <tr>
        <th>Slug</th>
        <th>User Details</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="pending-table"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>
<script src="/js/bcpmm-shell.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const supabase = window.auth?._client;
  if (!supabase) return;

  const { data: sessionWrap } = await supabase.auth.getSession();
  if (!sessionWrap?.session) {
    window.location.href = "/join.html";
    return;
  }

  const user = sessionWrap.session.user;

  const { data: role } = await supabase
    .from("user_roles")
    .select("role")
    .eq("user_id", user.id)
    .eq("role", "admin")
    .maybeSingle();

  if (!role) {
    window.location.href = "/";
    return;
  }

  async function loadPending() {

    const { data: claims } = await supabase
      .from("player_claims")
      .select("id, slug, user_id, created_at")
      .eq("status", "pending")
      .order("created_at", { ascending: true });

    const table = document.getElementById("pending-table");
    table.innerHTML = "";

    if (!claims?.length) {
      table.innerHTML = `<tr><td colspan="3">No pending claims.</td></tr>`;
      return;
    }

    for (const claim of claims) {

      /* Fetch public profile */
      const { data: profile } = await supabase
        .from("public_users")
        .select("alias, quote, local_store, avatar_url, created_at")
        .eq("id", claim.user_id)
        .maybeSingle();

      /* Fetch email (admin RPC must allow this) */
      const { data: userInfo } = await supabase.rpc("admin_get_user_by_id", {
        uid: claim.user_id
      });

      const email = userInfo?.email || "Unknown";

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>
          <strong>${claim.slug}</strong><br>
          <span class="small">Requested ${new Date(claim.created_at).toLocaleString()}</span>
        </td>

        <td>
          ${profile?.avatar_url ? `<img src="${profile.avatar_url}" class="avatar-small"><br>` : ""}
          <strong>Email:</strong> ${email}<br>
          <strong>User ID:</strong> ${claim.user_id}<br>
          <strong>Alias:</strong> ${profile?.alias || "—"}<br>
          <strong>Store:</strong> ${profile?.local_store || "—"}<br>
          <strong>Quote:</strong> ${profile?.quote || "—"}<br>
          <strong>Account Created:</strong> ${profile?.created_at ? new Date(profile.created_at).toLocaleString() : "—"}
        </td>

        <td>
          <button data-id="${claim.id}" data-action="approve">Approve</button>
          <button data-id="${claim.id}" data-action="deny">Deny</button>
        </td>
      `;

      table.appendChild(row);
    }
  }

  await loadPending();

  document.addEventListener("click", async (e) => {
    if (!e.target.dataset.action) return;

    const id = e.target.dataset.id;
    const action = e.target.dataset.action;

    if (action === "approve") {
      await supabase.from("player_claims")
        .update({ status: "approved" })
        .eq("id", id);
    }

    if (action === "deny") {
      await supabase.from("player_claims")
        .delete()
        .eq("id", id);
    }

    await loadPending();
  });

});
</script>

</body>
</html>
