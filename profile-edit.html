<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Profile · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
body{
  background:#ffffff;
  color:#000;
  transition:background 0.4s ease;
}

.wrap{
  max-width:680px;
  margin:6rem auto 4rem;
  padding:0 1.5rem;
}

.logo{
  width:70px;
  margin-bottom:2rem;
}

h1{ margin-bottom:0.5rem; }

.email-display{
  font-size:1.2rem;
  font-weight:900;
  margin-bottom:2rem;
}

.welcome-banner{
  font-size:1.7rem;
  font-weight:900;
  margin-bottom:2rem;
}

label{
  display:block;
  font-weight:700;
  margin:24px 0 6px;
}

input, textarea, select{
  width:100%;
  padding:8px 0;
  border:none;
  border-bottom:1px solid #ccc;
  background:transparent;
  font-size:1rem;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.avatar-box{
  width:130px;
  height:130px;
  border:1px solid #ddd;
  position:relative;
  overflow:hidden;
  background:#f5f5f5;
}

.avatar-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.avatar-remove{
  position:absolute;
  top:8px;
  right:8px;
  width:26px;
  height:26px;
  border-radius:50%;
  background:#c0392b;
  color:#fff;
  border:none;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hidden{ display:none; }

.slider-labels{
  display:flex;
  justify-content:space-between;
  font-size:0.8rem;
  margin-top:4px;
}

.remote-checks{
  margin-top:12px;
}

.remote-checks label{
  font-weight:600;
  display:block;
  margin-top:6px;
}

.claim-section{
  margin-top:40px;
}

.claim-state{
  font-weight:700;
  margin-top:8px;
}

.claim-state.approved{ color:#2e7d32; }
.claim-state.pending{ color:#c0392b; }
.claim-state.none{ color:#666; }

.action-btn{
  margin-top:14px;
  padding:10px 14px;
  border:2px solid #000;
  background:#fff;
  font-weight:700;
  cursor:pointer;
}

.save-btn{
  margin-top:40px;
  padding:16px;
  font-weight:900;
  border:2px solid #000;
  background:#fff;
  cursor:pointer;
  width:100%;
  font-size:1rem;
}

hr{
  margin:36px 0;
  border:none;
  border-top:1px solid #eee;
}
</style>
</head>

<body>
<div id="global-menu-root"></div>

<div class="wrap">

<img src="/assets/BCPMMsvg.png" class="logo">

<h1>Your Profile</h1>

<div id="welcome" class="welcome-banner hidden">
WELCOME TO MAGIC1.ca!
</div>

<div id="email-display" class="email-display"></div>

<label>Avatar</label>
<div class="avatar-box">
  <img id="avatar-preview">
  <button id="remove-avatar" class="avatar-remove hidden">×</button>
</div>
<input type="file" id="avatar-file" accept="image/*">

<label>Alias</label>
<input id="alias">

<label>Quote</label>
<textarea id="quote"></textarea>

<label>Local Store</label>
<select id="store">
  <option value="">—</option>
  <option>Magic Stronghold</option>
  <option>Connections Renfrew</option>
  <option>Freelance Mage</option>
</select>

<label>Remote Play Preference (0–5)</label>
<input type="range" id="remote-slider" min="0" max="5" value="0">

<div class="slider-labels">
  <span>0 No</span>
  <span>1 Rare</span>
  <span>2 Occasional</span>
  <span>3 Neutral</span>
  <span>4 Prefer</span>
  <span>5 Remote Only</span>
</div>

<div id="remote-checks" class="remote-checks hidden">
  <label><input type="checkbox" id="remote-mtgo"> MTGO</label>
  <label><input type="checkbox" id="remote-webcam"> Webcam</label>
</div>

<hr>

<div class="claim-section">
  <h2>Tournament Identity</h2>
  <select id="slug-select"></select>
  <div id="claim-state" class="claim-state"></div>

  <button id="request-claim" class="action-btn hidden">
    Request Verification
  </button>

  <button id="cancel-claim" class="action-btn hidden">
    Cancel Request
  </button>
</div>

<button id="save-profile" class="save-btn">SAVE PROFILE</button>
<div id="save-status"></div>

</div>

<script>
const AVATAR_BUCKET = "avatars";

/* Color spectrum for slider */
function backgroundForRemote(val){
  const colors = [
    "#ffffff",
    "#e3f2fd",
    "#e8f5e9",
    "#fff8e1",
    "#f3e5f5",
    "#fdecea"
  ];
  return colors[val];
}

function prettify(slug){
  return slug.split("-").map(w=>w[0].toUpperCase()+w.slice(1)).join(" ");
}

async function init(){

  if(!window.auth) return;

  const supabase = auth._client;
  const user = await auth.getUser();
  if(!user){
    window.location.href="/join.html";
    return;
  }

  document.getElementById("email-display").textContent = user.email;

  const alias = document.getElementById("alias");
  const quote = document.getElementById("quote");
  const store = document.getElementById("store");
  const slider = document.getElementById("remote-slider");
  const remoteChecks = document.getElementById("remote-checks");
  const mtgo = document.getElementById("remote-mtgo");
  const webcam = document.getElementById("remote-webcam");
  const avatarPreview = document.getElementById("avatar-preview");
  const avatarFile = document.getElementById("avatar-file");
  const removeAvatar = document.getElementById("remove-avatar");
  const saveStatus = document.getElementById("save-status");

  const slugSelect = document.getElementById("slug-select");
  const claimState = document.getElementById("claim-state");
  const requestBtn = document.getElementById("request-claim");
  const cancelBtn = document.getElementById("cancel-claim");

  const { data:draft } = await supabase
    .from("user_profiles")
    .select("*")
    .eq("user_id", user.id)
    .maybeSingle();

  if(!draft){
    document.getElementById("welcome").classList.remove("hidden");
  }

  if(draft){
    alias.value = draft.alias || "";
    quote.value = draft.quote || "";
    store.value = draft.store || "";
    slider.value = draft.remote_pref || 0;

    document.body.style.background = backgroundForRemote(slider.value);

    if(draft.remote_pref > 0){
      remoteChecks.classList.remove("hidden");
      mtgo.checked = !!draft.remote_mtgo;
      webcam.checked = !!draft.remote_webcam;
    }

    if(draft.avatar_url){
      avatarPreview.src = draft.avatar_url + "?t=" + Date.now();
      removeAvatar.classList.remove("hidden");
    }
  }

  slider.oninput = ()=>{
    document.body.style.background = backgroundForRemote(slider.value);
    if(slider.value > 0){
      remoteChecks.classList.remove("hidden");
    } else {
      remoteChecks.classList.add("hidden");
      mtgo.checked = false;
      webcam.checked = false;
    }
  };

  /* Load slugs */
  const { data:slugs } = await supabase.from("player_profiles").select("slug");
  slugSelect.innerHTML='<option value="">— Select yourself —</option>';
  (slugs||[]).forEach(p=>{
    const opt=document.createElement("option");
    opt.value=p.slug;
    opt.textContent=prettify(p.slug);
    slugSelect.appendChild(opt);
  });

  /* Claim state */
  const { data:approved } = await supabase
    .from("player_claims")
    .select("slug")
    .eq("user_id",user.id)
    .eq("status","approved")
    .maybeSingle();

  const { data:pending } = await supabase
    .from("player_claims")
    .select("slug")
    .eq("user_id",user.id)
    .eq("status","pending")
    .maybeSingle();

  if(approved){
    slugSelect.value = approved.slug;
    slugSelect.disabled = true;
    claimState.textContent = "Verified ✓";
    claimState.className="claim-state approved";
  }
  else if(pending){
    slugSelect.value = pending.slug;
    slugSelect.disabled = true;
    claimState.textContent = "Verification pending";
    claimState.className="claim-state pending";
    cancelBtn.classList.remove("hidden");
  }
  else{
    claimState.textContent = "Not verified";
    claimState.className="claim-state none";
    requestBtn.classList.remove("hidden");
  }

  requestBtn.onclick = async ()=>{
    if(!slugSelect.value) return;

    await supabase.from("player_claims").insert({
      user_id:user.id,
      slug:slugSelect.value,
      status:"pending"
    });

    slugSelect.disabled = true;
    requestBtn.classList.add("hidden");
    cancelBtn.classList.remove("hidden");
    claimState.textContent = "Verification pending";
    claimState.className="claim-state pending";
  };

  cancelBtn.onclick = async ()=>{
    await supabase
      .from("player_claims")
      .delete()
      .eq("user_id",user.id)
      .eq("status","pending");

    slugSelect.disabled = false;
    cancelBtn.classList.add("hidden");
    requestBtn.classList.remove("hidden");
    claimState.textContent = "Not verified";
    claimState.className="claim-state none";
  };

}

window.addEventListener("load", init);
</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
