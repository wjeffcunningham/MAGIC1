<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Profile · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
body {
  background: #ffffff;
  color: #000;
  transition: background 0.4s ease;
}

.wrap {
  max-width: 720px;
  margin: 6rem auto 4rem;
  padding: 0 1.5rem;
}

.card {
  padding: 24px 0;
}

h1 {
  margin-bottom: 0.5rem;
}

.email-display {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 2rem;
}

.welcome-banner {
  font-size: 1.6rem;
  font-weight: 800;
  margin-bottom: 2rem;
}

label {
  display:block;
  font-weight:700;
  margin:22px 0 6px;
}

input, textarea, select {
  width:100%;
  padding:10px 0;
  border:none;
  border-bottom:1px solid #ccc;
  background:transparent;
  color:inherit;
  font-size:1rem;
}

textarea { min-height:80px; resize:vertical; }

.avatar-box {
  width:120px;
  height:120px;
  border:1px solid #ccc;
  position:relative;
  overflow:hidden;
  margin-bottom:10px;
}

.avatar-box img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.avatar-remove {
  position:absolute;
  top:6px;
  right:6px;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#c0392b;
  color:#fff;
  border:none;
  cursor:pointer;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
}

.remote-checks {
  margin-top:10px;
}

.remote-checks label {
  font-weight:600;
  display:block;
  margin-top:6px;
}

.claim-state {
  font-weight:700;
  margin-top:10px;
}

.claim-state.approved { color:#2e7d32; }
.claim-state.pending { color:#c0392b; }
.claim-state.none { color:#999; }

.subtle {
  font-size:0.85rem;
  opacity:.7;
}

.save-btn {
  margin-top:40px;
  padding:14px;
  font-weight:800;
  border:2px solid #000;
  background:#fff;
  cursor:pointer;
  width:100%;
}

.logo {
  width:80px;
  margin-bottom:1rem;
}
</style>
</head>

<body>
<div id="global-menu-root"></div>

<div class="wrap">

<img src="/assets/BCPMMsvg.png" class="logo">

<h1>Your Profile</h1>

<div class="card">

<div id="welcome" class="welcome-banner hidden">
  WELCOME TO MAGIC1.ca!
</div>

<div class="email-display" id="email-display"></div>

<!-- Avatar -->
<label>Avatar</label>
<div class="avatar-box" id="avatar-box">
  <img id="avatar-preview">
  <button class="avatar-remove hidden" id="remove-avatar">×</button>
</div>
<input type="file" id="avatar-file" accept="image/*">

<!-- Alias -->
<label>Alias</label>
<input id="alias">

<!-- Quote -->
<label>Quote</label>
<textarea id="quote"></textarea>

<!-- Local Store -->
<label>Local Store</label>
<select id="store">
  <option value="">—</option>
  <option>Magic Stronghold</option>
  <option>Connections Renfrew</option>
  <option>Freelance Mage</option>
</select>

<!-- Remote Preference -->
<label>Remote Play Preference (0–5)</label>
<input type="range" id="remote-slider" min="0" max="5" value="0">

<div class="remote-checks hidden" id="remote-checks">
  <label><input type="checkbox" id="remote-mtgo"> MTGO</label>
  <label><input type="checkbox" id="remote-webcam"> Webcam</label>
</div>

<!-- Sponsored -->
<label>
  <input type="checkbox" disabled> Sponsored (coming soon)
</label>

<hr>

<!-- Claim -->
<h2>Claim Tournament Identity</h2>
<div class="subtle">Select yourself from the tournament list.</div>

<select id="slug-select"></select>

<div class="claim-state" id="claim-state"></div>

<div id="cancel-wrap" class="hidden">
  <button id="cancel-claim">Cancel Request</button>
</div>

<button class="save-btn" id="save-profile">SAVE PROFILE</button>

<div id="save-status" class="subtle"></div>

</div>
</div>

<script>
const AVATAR_BUCKET = "avatars";

function prettify(slug){
  return slug.split("-").map(w=>w[0].toUpperCase()+w.slice(1)).join(" ");
}

function backgroundForRemote(val){
  const shade = 255 - (val * 12);
  return `rgb(${shade}, ${shade}, ${shade})`;
}

async function init(){

  if(!window.auth) return;

  const supabase = auth._client;
  const user = await auth.getUser();
  if(!user){
    window.location.href="/join.html";
    return;
  }

  document.getElementById("email-display").textContent = user.email;

  const { data: draft } = await supabase
    .from("user_profiles")
    .select("*")
    .eq("user_id", user.id)
    .maybeSingle();

  if(!draft){
    document.getElementById("welcome").classList.remove("hidden");
  }

  const alias = document.getElementById("alias");
  const quote = document.getElementById("quote");
  const store = document.getElementById("store");
  const slider = document.getElementById("remote-slider");
  const remoteChecks = document.getElementById("remote-checks");
  const mtgo = document.getElementById("remote-mtgo");
  const webcam = document.getElementById("remote-webcam");
  const avatarPreview = document.getElementById("avatar-preview");
  const avatarFile = document.getElementById("avatar-file");
  const removeAvatar = document.getElementById("remove-avatar");
  const saveStatus = document.getElementById("save-status");

  if(draft){
    alias.value = draft.alias || "";
    quote.value = draft.quote || "";
    store.value = draft.store || "";
    slider.value = draft.remote_pref || 0;
    if(draft.avatar_url){
      avatarPreview.src = draft.avatar_url;
      removeAvatar.classList.remove("hidden");
    }
  }

  document.body.style.background = backgroundForRemote(slider.value);

  slider.oninput = () => {
    document.body.style.background = backgroundForRemote(slider.value);
    if(slider.value > 0){
      remoteChecks.classList.remove("hidden");
    } else {
      remoteChecks.classList.add("hidden");
      mtgo.checked=false;
      webcam.checked=false;
    }
  };

  avatarFile.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    avatarPreview.src = URL.createObjectURL(file);
    removeAvatar.classList.remove("hidden");
  };

  removeAvatar.onclick = () => {
    avatarPreview.src="";
    avatarFile.value="";
    removeAvatar.classList.add("hidden");
  };

  /* Load slugs */
  const { data: slugs } = await supabase
    .from("player_profiles")
    .select("slug");

  const { data: approved } = await supabase
    .from("player_claims")
    .select("*")
    .eq("user_id", user.id)
    .eq("status","approved")
    .maybeSingle();

  const { data: pending } = await supabase
    .from("player_claims")
    .select("*")
    .eq("user_id", user.id)
    .eq("status","pending")
    .maybeSingle();

  const slugSelect = document.getElementById("slug-select");
  slugSelect.innerHTML='<option value="">— Select yourself —</option>';

  (slugs||[]).forEach(p=>{
    const opt=document.createElement("option");
    opt.value=p.slug;
    opt.textContent=prettify(p.slug);
    slugSelect.appendChild(opt);
  });

  const claimState=document.getElementById("claim-state");
  const cancelWrap=document.getElementById("cancel-wrap");

  if(approved){
    claimState.textContent="Verified ✓";
    claimState.className="claim-state approved";
    slugSelect.value=approved.slug;
    slugSelect.disabled=true;
  }
  else if(pending){
    claimState.textContent="Verification pending";
    claimState.className="claim-state pending";
    slugSelect.value=pending.slug;
    slugSelect.disabled=true;
    cancelWrap.classList.remove("hidden");
  }
  else{
    claimState.textContent="Not verified";
    claimState.className="claim-state none";
  }

  document.getElementById("cancel-claim").onclick=async()=>{
    await supabase
      .from("player_claims")
      .delete()
      .eq("user_id", user.id)
      .eq("status","pending");

    location.reload();
  };

  document.getElementById("save-profile").onclick=async()=>{

    saveStatus.textContent="Saving…";

    let avatar_url=draft?.avatar_url||null;

    const file=avatarFile.files[0];
    if(file){
      const path=user.id+"/"+Date.now()+"-"+file.name;
      await supabase.storage.from(AVATAR_BUCKET).upload(path,file,{upsert:true});
      avatar_url=supabase.storage.from(AVATAR_BUCKET).getPublicUrl(path).data.publicUrl;
    }

    await supabase.from("user_profiles").upsert({
      user_id:user.id,
      alias:alias.value.trim()||null,
      quote:quote.value.trim()||null,
      store:store.value||null,
      remote_pref:parseInt(slider.value),
      remote_mtgo:mtgo.checked,
      remote_webcam:webcam.checked,
      avatar_url,
      updated_at:new Date().toISOString()
    });

    if(slugSelect.value && !approved && !pending){
      await supabase.from("player_claims").insert({
        user_id:user.id,
        slug:slugSelect.value,
        status:"pending"
      });
    }

    saveStatus.textContent="Saved.";
  };
}

window.addEventListener("load",init);
</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
