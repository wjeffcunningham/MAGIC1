<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Edit Profile · B.C. Premodern Masters</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
body { background: var(--bg); color: var(--fg); }

.wrap {
  max-width: 760px;
  margin: 6rem auto 4rem;
  padding: 0 1.5rem;
}

.card {
  border: 1px solid var(--muted);
  border-radius: 16px;
  padding: 28px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(6px);
}

h1 { margin-bottom: 1.5rem; }

label {
  display:block;
  font-weight:700;
  margin:18px 0 6px;
}

input, textarea, select {
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--muted);
  background:transparent;
  color:inherit;
  font-size:0.95rem;
}

textarea { min-height:90px; }

.avatar-preview {
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid var(--muted);
  display:block;
  margin-bottom:12px;
  background:rgba(0,0,0,0.15);
}

.checks {
  display:flex;
  gap:20px;
  margin-top:8px;
}

button {
  padding:12px 20px;
  border-radius:14px;
  border:1px solid var(--fg);
  background:transparent;
  color:inherit;
  font-weight:800;
  cursor:pointer;
  margin-top:22px;
  letter-spacing:0.5px;
}

button.secondary {
  border-color: var(--muted);
  margin-left:12px;
}

.status {
  margin-top:12px;
  opacity:.8;
  font-size:0.9rem;
}
</style>
</head>

<body>
<div id="global-menu-root"></div>

<div class="wrap">
  <h1>Edit Profile</h1>

  <div class="card">
    <label>Alias (optional)</label>
    <input id="alias" placeholder="Displayed instead of slug" />

    <label>Quote</label>
    <textarea id="quote"></textarea>

    <label>Local Store</label>
    <select id="store">
      <option value="">—</option>
      <option>Magic Stronghold</option>
      <option>Connections Renfrew</option>
      <option>Freelance Mage</option>
    </select>

    <label>Remote Play</label>
    <div class="checks">
      <label><input type="checkbox" id="remote_mtgo"> MTGO</label>
      <label><input type="checkbox" id="remote_webcam"> Webcam</label>
    </div>

    <label>Avatar</label>
    <img id="avatar_preview" class="avatar-preview">
    <input type="file" id="avatar_file" accept="image/*">

    <button id="save_btn">Save Profile</button>
    <button id="delete_avatar_btn" class="secondary" type="button">Delete Avatar</button>

    <div class="status" id="status"></div>
  </div>
</div>

<script>
const AVATAR_BUCKET = "avatars";

function normalizeSlug(s){
  return (s||"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}

let existingProfile = null;
let slug = null;

async function init(){
  const supabase = auth._client;
  const user = await auth.getUser();

  if(!user){
    document.querySelector(".wrap").innerHTML = 'Sign in first.';
    return;
  }

  const { data: claim } = await supabase
    .from("player_claims")
    .select("slug")
    .eq("user_id", user.id)
    .eq("status","approved")
    .limit(1)
    .maybeSingle();

  if(!claim){
    document.querySelector(".wrap").innerHTML =
      'You must have an approved claim first.';
    return;
  }

  slug = normalizeSlug(claim.slug);

  const { data: profile } = await supabase
    .from("player_profiles")
    .select("*")
    .eq("slug", slug)
    .maybeSingle();

  existingProfile = profile || null;

  if(existingProfile){
    document.getElementById("alias").value = existingProfile.alias || "";
    document.getElementById("quote").value = existingProfile.quote || "";
    document.getElementById("store").value = existingProfile.store || "";
    document.getElementById("remote_mtgo").checked = !!existingProfile.remote_mtgo;
    document.getElementById("remote_webcam").checked = !!existingProfile.remote_webcam;
    if(existingProfile.avatar_url){
      document.getElementById("avatar_preview").src = existingProfile.avatar_url;
    }
  }

  document.getElementById("avatar_file").addEventListener("change", e=>{
    const file = e.target.files[0];
    if(file){
      const preview = URL.createObjectURL(file);
      document.getElementById("avatar_preview").src = preview;
    }
  });

  document.getElementById("save_btn").onclick = saveProfile;
  document.getElementById("delete_avatar_btn").onclick = deleteAvatar;
}

async function saveProfile(){
  const supabase = auth._client;
  const status = document.getElementById("status");
  status.textContent = "Saving...";

  try{
    let avatar_url = existingProfile?.avatar_url || null;
    const file = document.getElementById("avatar_file").files[0];

    if(file){
      const path = slug + "/" + Date.now() + "-" + file.name;
      const { error } = await supabase
        .storage
        .from(AVATAR_BUCKET)
        .upload(path,file,{upsert:true});

      if(error) throw error;

      avatar_url = supabase
        .storage
        .from(AVATAR_BUCKET)
        .getPublicUrl(path).data.publicUrl;
    }

    const row = {
      slug,
      alias: document.getElementById("alias").value.trim() || null,
      quote: document.getElementById("quote").value.trim() || null,
      store: document.getElementById("store").value || null,
      remote_mtgo: document.getElementById("remote_mtgo").checked,
      remote_webcam: document.getElementById("remote_webcam").checked,
      avatar_url,
      updated_at: new Date().toISOString()
    };

    await supabase.from("player_profiles").upsert(row);

    existingProfile = row;
    status.textContent = "Saved.";
  }catch(e){
    console.error(e);
    status.textContent = "Save failed. Check console.";
  }
}

async function deleteAvatar(){
  const supabase = auth._client;
  const status = document.getElementById("status");

  if(!existingProfile?.avatar_url){
    status.textContent = "No avatar to delete.";
    return;
  }

  try{
    await supabase.from("player_profiles").update({
      avatar_url: null
    }).eq("slug", slug);

    document.getElementById("avatar_preview").removeAttribute("src");
    existingProfile.avatar_url = null;

    status.textContent = "Avatar removed.";
  }catch(e){
    console.error(e);
    status.textContent = "Failed to delete avatar.";
  }
}

window.addEventListener("load", init);
</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
