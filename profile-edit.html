<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Profile · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
body { background: var(--bg); color: var(--fg); }

.wrap {
  max-width: 720px;
  margin: 6rem auto 4rem;
  padding: 0 1.25rem;
}

.card {
  border: 1px solid var(--muted);
  border-radius: 18px;
  padding: 28px;
  background: rgba(255,255,255,0.02);
}

.header-row {
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:20px;
}

.header-row img {
  width:42px;
  height:42px;
}

.user-email {
  font-size:1.1rem;
  font-weight:700;
}

label {
  display:block;
  font-weight:700;
  margin:18px 0 6px;
}

input, textarea, select {
  width:100%;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid var(--muted);
  background:transparent;
  color:inherit;
  font-size:0.95rem;
}

textarea { min-height:90px; resize:vertical; }

button {
  padding:10px 16px;
  border-radius:12px;
  border:1px solid var(--fg);
  background:transparent;
  font-weight:700;
  cursor:pointer;
  margin-top:16px;
}

.notice { font-weight:700; margin-bottom:16px; }
.notice.approved { color:#4caf50; }
.notice.pending { color:#ff6666; }
.notice.none { color:#ffaa00; }

.subtle { font-size:0.85rem; opacity:.7; }

hr { margin:28px 0; opacity:.15; }

.hidden { display:none; }

/* Avatar */

.avatar-box {
  position:relative;
  width:120px;
  height:120px;
  border-radius:14px;
  border:1px solid var(--muted);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.04);
}

.avatar-box img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.avatar-remove {
  position:absolute;
  top:6px;
  right:6px;
  background:#c0392b;
  color:white;
  border:none;
  border-radius:50%;
  width:22px;
  height:22px;
  font-size:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.remote-options {
  margin-top:8px;
  display:flex;
  gap:16px;
}

.remote-options label {
  font-weight:600;
  display:flex;
  gap:6px;
  align-items:center;
}

.sponsored {
  opacity:0.4;
}
</style>
</head>

<body>
<div id="global-menu-root"></div>

<div class="wrap">
<div class="card">

<div class="header-row">
  <img src="/assets/BCPMMsvg.png" alt="BCPMM">
  <div class="user-email" id="user-email"></div>
</div>

<div id="claim-state" class="notice"></div>

<!-- Avatar -->

<label>Avatar</label>
<div class="avatar-box">
  <img id="avatar-preview" src="" class="hidden">
  <button id="avatar-remove" class="avatar-remove hidden">✕</button>
</div>
<input type="file" id="avatar-file" accept="image/*">

<!-- Profile fields -->

<label>Alias (public display name)</label>
<input id="alias">

<label>Quote</label>
<textarea id="quote"></textarea>

<label>Local Store</label>
<select id="store">
  <option value="">—</option>
  <option>Magic Stronghold</option>
  <option>Connections Renfrew</option>
  <option>Freelance Mage</option>
</select>

<label>Remote Play Preference (0–5)</label>
<input type="range" id="remote-slider" min="0" max="5" value="0">
<div class="subtle">0 = never · 5 = remote only</div>

<div id="remote-options" class="remote-options hidden">
  <label><input type="checkbox" id="remote-mtgo"> MTGO</label>
  <label><input type="checkbox" id="remote-webcam"> Webcam</label>
</div>

<label class="sponsored">
  <input type="checkbox" disabled> Sponsored (coming soon)
</label>

<hr>

<h2>Claim Tournament Identity</h2>
<div class="subtle">
Select yourself from the tournament list. Complete profile first.
</div>

<select id="slug-select"></select>

<button id="submit-claim">Request Verification</button>
<button id="retract-claim" class="hidden">Retract Request</button>

<label class="hidden" id="claim-note-label">
Optional note to admin (150 chars max)
</label>
<textarea id="claim-note" maxlength="150" class="hidden"></textarea>

<button id="save-profile">Save Profile</button>
<div id="save-status" class="subtle"></div>

</div>
</div>

<script>
const AVATAR_BUCKET = "avatars";

function prettify(slug){
  return slug.split("-").map(w=>w[0].toUpperCase()+w.slice(1)).join(" ");
}

async function init(){

  if(!window.auth) return;

  const supabase = auth._client;
  const user = await auth.getUser();
  if(!user){
    window.location.href = "/join.html";
    return;
  }

  document.getElementById("user-email").textContent = user.email;

  const avatarPreview = document.getElementById("avatar-preview");
  const avatarFile = document.getElementById("avatar-file");
  const avatarRemove = document.getElementById("avatar-remove");

  const alias = document.getElementById("alias");
  const quote = document.getElementById("quote");
  const store = document.getElementById("store");
  const remoteSlider = document.getElementById("remote-slider");
  const remoteOptions = document.getElementById("remote-options");
  const remoteMtgo = document.getElementById("remote-mtgo");
  const remoteWebcam = document.getElementById("remote-webcam");

  const slugSelect = document.getElementById("slug-select");
  const claimState = document.getElementById("claim-state");
  const submitClaim = document.getElementById("submit-claim");
  const retractClaim = document.getElementById("retract-claim");
  const claimNote = document.getElementById("claim-note");
  const claimNoteLabel = document.getElementById("claim-note-label");

  const saveBtn = document.getElementById("save-profile");
  const saveStatus = document.getElementById("save-status");

  /* Load profile */

  const { data: draft } = await supabase
    .from("user_profiles")
    .select("*")
    .eq("user_id", user.id)
    .maybeSingle();

  if(draft){
    alias.value = draft.alias || "";
    quote.value = draft.quote || "";
    store.value = draft.store || "";
    remoteSlider.value = draft.remote_pref ?? 0;
    remoteMtgo.checked = !!draft.remote_mtgo;
    remoteWebcam.checked = !!draft.remote_webcam;

    if(draft.avatar_url){
      avatarPreview.src = draft.avatar_url;
      avatarPreview.classList.remove("hidden");
      avatarRemove.classList.remove("hidden");
    }
  }

  /* Remote toggle visibility */
  function updateRemoteVisibility(){
    if(Number(remoteSlider.value) > 0){
      remoteOptions.classList.remove("hidden");
    } else {
      remoteOptions.classList.add("hidden");
    }
  }
  updateRemoteVisibility();
  remoteSlider.oninput = updateRemoteVisibility;

  /* Avatar preview */
  avatarFile.onchange = () => {
    const file = avatarFile.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = e => {
      avatarPreview.src = e.target.result;
      avatarPreview.classList.remove("hidden");
      avatarRemove.classList.remove("hidden");
    };
    reader.readAsDataURL(file);
  };

  avatarRemove.onclick = () => {
    avatarPreview.src = "";
    avatarPreview.classList.add("hidden");
    avatarRemove.classList.add("hidden");
    avatarFile.value = "";
  };

  /* Populate slug dropdown */

  const { data: profiles } = await supabase.from("player_profiles").select("slug");
  const { data: approvedClaims } = await supabase
    .from("player_claims")
    .select("slug")
    .eq("status","approved");

  const taken = new Set((approvedClaims||[]).map(x=>x.slug));

  slugSelect.innerHTML = `<option value="">— Select yourself —</option>`;
  (profiles||[]).forEach(p=>{
    if(taken.has(p.slug)) return;
    const opt = document.createElement("option");
    opt.value = p.slug;
    opt.textContent = prettify(p.slug);
    slugSelect.appendChild(opt);
  });

  /* Save */

  saveBtn.onclick = async () => {

    saveStatus.textContent = "Saving…";

    let avatarUrl = draft?.avatar_url || null;

    if(avatarFile.files[0]){
      const path = user.id + "/" + Date.now() + "-" + avatarFile.files[0].name;
      await supabase.storage.from(AVATAR_BUCKET).upload(path, avatarFile.files[0], { upsert:true });
      avatarUrl = supabase.storage.from(AVATAR_BUCKET).getPublicUrl(path).data.publicUrl;
    }

    await supabase.from("user_profiles").upsert({
      user_id: user.id,
      alias: alias.value.trim() || null,
      quote: quote.value.trim() || null,
      store: store.value || null,
      remote_pref: Number(remoteSlider.value),
      remote_mtgo: remoteMtgo.checked,
      remote_webcam: remoteWebcam.checked,
      avatar_url: avatarUrl,
      updated_at: new Date().toISOString()
    });

    saveStatus.textContent = "Saved.";
  };

}

window.addEventListener("load", init);
</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
