<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Profile · B.C. Premodern Masters</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
body { background: var(--bg); color: var(--fg); }

.wrap {
  max-width: 760px;
  margin: 6rem auto 4rem;
  padding: 0 1.5rem;
}

.card {
  border: 1px solid var(--muted);
  border-radius: 16px;
  padding: 24px;
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(6px);
}

h1 { margin-bottom: 1.5rem; }

label {
  display:block;
  font-weight:700;
  margin:18px 0 6px;
}

input, textarea, select {
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--muted);
  background:transparent;
  color:inherit;
  font-size:0.95rem;
}

textarea { min-height:100px; }

.avatar-preview {
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid var(--muted);
  display:block;
  margin-bottom:12px;
}

.checks {
  display:flex;
  gap:18px;
  margin-top:10px;
}

.checks label {
  font-weight:600;
  display:flex;
  gap:8px;
  align-items:center;
}

button {
  padding:14px 20px;
  border-radius:14px;
  border:1px solid var(--fg);
  background:transparent;
  font-weight:800;
  cursor:pointer;
  margin-top:24px;
}

.status {
  margin-top:14px;
  opacity:.85;
  font-size:0.9rem;
}

.notice {
  margin-bottom:1rem;
  font-weight:700;
}

.notice.pending { color:#ff6666; }
.notice.approved { color:#4caf50; }
.notice.none { color:#ffaa00; }

.locked {
  opacity:0.6;
  pointer-events:none;
}
</style>
</head>

<body>
<div id="global-menu-root"></div>

<div class="wrap">
<h1>Your Profile</h1>

<div class="card">

<div id="state-msg" class="notice"></div>

<label>Alias (public display name)</label>
<input id="alias">

<label>Quote</label>
<textarea id="quote"></textarea>

<label>Local Store</label>
<select id="store">
  <option value="">—</option>
  <option>Magic Stronghold</option>
  <option>Connections Renfrew</option>
  <option>Freelance Mage</option>
</select>

<label>Remote Play</label>
<div class="checks">
  <label><input type="checkbox" id="remote_mtgo"> MTGO</label>
  <label><input type="checkbox" id="remote_webcam"> Webcam</label>
</div>

<label>Make this profile public</label>
<select id="is_public">
  <option value="true">Yes</option>
  <option value="false">No</option>
</select>

<label>Avatar</label>
<img id="avatar_preview" class="avatar-preview">
<input type="file" id="avatar_file" accept="image/*">

<hr style="margin:30px 0; opacity:.2;">

<label>Claim Tournament Identity</label>
<select id="slug-select"></select>

<button id="save_btn">Save Profile</button>
<div class="status" id="status"></div>

</div>
</div>

<script>

const AVATAR_BUCKET = "avatars";

function normalizeSlug(s){
  return (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

function prettify(slug){
  return slug.split("-").map(w=>w[0].toUpperCase()+w.slice(1)).join(" ");
}

async function loadAllSlugs(){
  const paths = [
    "/leaguetracker/data/raw/events/bcpmm-2026-01-10.json",
    "/leaguetracker/data/raw/events/connections-2026-01-12.json",
    "/leaguetracker/data/raw/events/connections-2026-01-26.json",
    "/leaguetracker/data/raw/events/connections-2026-02-09.json",
    "/leaguetracker/data/raw/events/stronghold-2026-02-01.json",
    "/leaguetracker/data/raw/events/bcwl-2026-01-26-r1.json",
    "/leaguetracker/data/raw/events/bcwl-2026-02-02-r2.json"
  ];

  const set = new Set();

  for(const p of paths){
    try{
      const r = await fetch(p);
      const j = await r.json();
      (j.standings||[]).forEach(s=>set.add(normalizeSlug(s.player)));
    }catch{}
  }

  return [...set].sort();
}

async function init(){

  if(!window.auth) return;

  const supabase = auth._client;
  const user = await auth.getUser();
  if(!user){
    document.body.innerHTML="Sign in first.";
    return;
  }

  /* Explicit bindings */
  const aliasInput = document.getElementById("alias");
  const quoteInput = document.getElementById("quote");
  const storeSelect = document.getElementById("store");
  const remoteMtgo = document.getElementById("remote_mtgo");
  const remoteWebcam = document.getElementById("remote_webcam");
  const isPublic = document.getElementById("is_public");
  const avatarPreview = document.getElementById("avatar_preview");
  const avatarFile = document.getElementById("avatar_file");
  const slugSelect = document.getElementById("slug-select");
  const stateMsg = document.getElementById("state-msg");
  const saveBtn = document.getElementById("save_btn");
  const statusDiv = document.getElementById("status");

  /* Load draft profile */
  const { data: draft } = await supabase
    .from("user_profiles")
    .select("*")
    .eq("user_id", user.id)
    .maybeSingle();

  if(draft){
    aliasInput.value = draft.alias || "";
    quoteInput.value = draft.quote || "";
    storeSelect.value = draft.store || "";
    remoteMtgo.checked = !!draft.remote_mtgo;
    remoteWebcam.checked = !!draft.remote_webcam;
    isPublic.value = draft.is_public ? "true":"false";
    if(draft.avatar_url) avatarPreview.src = draft.avatar_url;
  }

  /* Claim resolution (approved always wins) */
  const { data: approvedClaim } = await supabase
    .from("player_claims")
    .select("slug")
    .eq("user_id", user.id)
    .eq("status","approved")
    .maybeSingle();

  const { data: pendingClaim } = await supabase
    .from("player_claims")
    .select("slug")
    .eq("user_id", user.id)
    .eq("status","pending")
    .maybeSingle();

  const allSlugs = await loadAllSlugs();
  const { data: approvedClaims } = await supabase
    .from("player_claims")
    .select("slug")
    .eq("status","approved");

  const takenSet = new Set((approvedClaims||[]).map(x=>x.slug));

  slugSelect.innerHTML='<option value="">— Select your tournament name —</option>';

  allSlugs.forEach(sl=>{
    const opt = document.createElement("option");
    opt.value = sl;
    opt.textContent = prettify(sl);
    if(takenSet.has(sl)) opt.disabled = true;
    slugSelect.appendChild(opt);
  });

  if(approvedClaim){
    slugSelect.value = approvedClaim.slug;
    slugSelect.disabled = true;
    stateMsg.textContent = "Verified ✓";
    stateMsg.className="notice approved";
    isPublic.disabled = false;

    const viewLink = document.createElement("div");
    viewLink.innerHTML = `<a href="/players/${approvedClaim.slug}.html">View My Player Page</a>`;
    stateMsg.appendChild(document.createElement("br"));
    stateMsg.appendChild(viewLink);

  } else if(pendingClaim){
    slugSelect.value = pendingClaim.slug;
    slugSelect.disabled = true;
    stateMsg.textContent = "Verification pending";
    stateMsg.className="notice pending";
    isPublic.disabled = true;
  } else {
    stateMsg.textContent = "Not yet verified";
    stateMsg.className="notice none";
    isPublic.disabled = true;
  }

  /* Save */
  saveBtn.onclick = async ()=>{
    statusDiv.textContent="Saving…";

    let avatar_url = draft?.avatar_url || null;
    const file = avatarFile.files[0];
    if(file){
      const path = user.id+"/"+Date.now()+"-"+file.name;
      await supabase.storage.from(AVATAR_BUCKET).upload(path,file,{upsert:true});
      avatar_url = supabase.storage.from(AVATAR_BUCKET).getPublicUrl(path).data.publicUrl;
    }

    await supabase.from("user_profiles").upsert({
      user_id:user.id,
      alias:aliasInput.value.trim()||null,
      quote:quoteInput.value.trim()||null,
      store:storeSelect.value||null,
      remote_mtgo:remoteMtgo.checked,
      remote_webcam:remoteWebcam.checked,
      avatar_url,
      is_public:isPublic.value==="true" && approvedClaim,
      updated_at:new Date().toISOString()
    });

    if(slugSelect.value && !approvedClaim && !pendingClaim){
      await supabase.from("player_claims").insert({
        slug:slugSelect.value,
        user_id:user.id,
        status:"pending"
      });
      slugSelect.disabled=true;
      stateMsg.textContent="Verification pending";
      stateMsg.className="notice pending";
    }

    statusDiv.textContent="Saved.";
  };
}

window.addEventListener("load",init);
</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
