<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Profile · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>

body { background: var(--bg); color: var(--fg); }

.wrap {
  max-width: 720px;
  margin: 6rem auto 4rem;
  padding: 0 1.5rem;
}

.card {
  padding: 32px;
  background: rgba(255,255,255,0.02);
}

/* --- header --- */

.email-display {
  font-size: 1.2rem;
  font-weight: 800;
  margin-bottom: 30px;
}

.logo {
  width: 42px;
  margin-bottom: 20px;
}

/* --- fields --- */

.field {
  margin-bottom: 26px;
}

label {
  display:block;
  font-weight:700;
  margin-bottom:8px;
}

input,
textarea,
select {
  width:100%;
  padding:12px;
  border:1px solid var(--muted);
  background:transparent;
  color:inherit;
  font-size:0.95rem;
  border-radius:0;
  box-sizing:border-box;
}

textarea {
  resize:vertical;
  min-height:80px;
}

/* --- avatar --- */

.avatar-box {
  position:relative;
  width:150px;
  height:150px;
  border:1px solid var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  overflow:hidden;
}

.avatar-box img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.avatar-delete {
  position:absolute;
  top:8px;
  right:8px;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#c0392b;
  color:white;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:14px;
}

.file-input {
  margin-top:12px;
}

/* --- remote slider --- */

.remote-wrapper {
  padding:12px;
  border:1px solid var(--muted);
}

.remote-wrapper.level-0 { background:#111; }
.remote-wrapper.level-1 { background:#1e1e2e; }
.remote-wrapper.level-2 { background:#222240; }
.remote-wrapper.level-3 { background:#1f2a5a; }
.remote-wrapper.level-4 { background:#16326f; }
.remote-wrapper.level-5 { background:#0e3a87; }

.remote-options {
  margin-top:12px;
  display:none;
}

.remote-options label {
  font-weight:600;
  display:block;
  margin-bottom:6px;
}

/* --- claim --- */

.notice {
  font-weight:700;
  margin-bottom:20px;
}

.notice.approved { color:#4caf50; }
.notice.pending { color:#ff6666; }
.notice.none { color:#ffaa00; }

button.primary {
  padding:12px 18px;
  border:1px solid var(--fg);
  background:transparent;
  font-weight:700;
  cursor:pointer;
  margin-top:12px;
}

.subtle {
  font-size:0.85rem;
  opacity:.7;
  margin-top:6px;
}

</style>
</head>

<body>
<div id="global-menu-root"></div>

<div class="wrap">
<div class="card">

<img src="/assets/BCPMMsvg.png" class="logo">

<div class="email-display" id="email-display"></div>

<div id="claim-state" class="notice"></div>

<!-- Alias -->
<div class="field">
  <label>Alias</label>
  <input id="alias">
</div>

<!-- Quote -->
<div class="field">
  <label>Quote</label>
  <textarea id="quote"></textarea>
</div>

<!-- Store -->
<div class="field">
  <label>Local Store</label>
  <select id="store">
    <option value="">—</option>
    <option>Magic Stronghold</option>
    <option>Connections Renfrew</option>
    <option>Freelance Mage</option>
  </select>
</div>

<!-- Avatar -->
<div class="field">
  <label>Avatar</label>

  <div class="avatar-box" id="avatar-box">
    <img id="avatar-preview">
    <button class="avatar-delete hidden" id="avatar-delete">✕</button>
  </div>

  <input type="file" id="avatar-file" class="file-input" accept="image/*">
</div>

<!-- Remote Slider -->
<div class="field">
  <label>Remote Play Preference (0–5)</label>

  <div class="remote-wrapper level-0" id="remote-wrapper">
    <input type="range" id="remote-slider" min="0" max="5" value="0">
    <div class="subtle">0 = Never · 5 = Only remote</div>

    <div class="remote-options" id="remote-options">
      <label><input type="checkbox" id="remote-mtgo"> MTGO</label>
      <label><input type="checkbox" id="remote-webcam"> Webcam</label>
      <label><input type="checkbox" disabled> Sponsored (coming soon)</label>
    </div>
  </div>
</div>

<hr>

<!-- Claim -->
<h2>Claim Tournament Identity</h2>
<div class="subtle">Complete your profile first.</div>

<select id="slug-select"></select>

<textarea id="claim-note" maxlength="150" placeholder="Optional note to admin"></textarea>

<button id="submit-claim" class="primary">Request Verification</button>
<button id="retract-claim" class="primary hidden">Retract Request</button>

<button id="save-profile" class="primary">Save Profile</button>
<div id="save-status" class="subtle"></div>

</div>
</div>

<script>

const AVATAR_BUCKET = "avatars";

function prettify(slug){
  return slug.split("-").map(w=>w[0].toUpperCase()+w.slice(1)).join(" ");
}

async function init(){

  if(!window.auth) return;

  const supabase = auth._client;
  const user = await auth.getUser();
  if(!user){
    window.location.href = "/join.html";
    return;
  }

  document.getElementById("email-display").textContent = user.email;

  const alias = document.getElementById("alias");
  const quote = document.getElementById("quote");
  const store = document.getElementById("store");
  const slider = document.getElementById("remote-slider");
  const wrapper = document.getElementById("remote-wrapper");
  const options = document.getElementById("remote-options");
  const mtgo = document.getElementById("remote-mtgo");
  const webcam = document.getElementById("remote-webcam");
  const slugSelect = document.getElementById("slug-select");
  const submitClaim = document.getElementById("submit-claim");
  const retractClaim = document.getElementById("retract-claim");
  const claimState = document.getElementById("claim-state");
  const saveBtn = document.getElementById("save-profile");
  const saveStatus = document.getElementById("save-status");

  const avatarPreview = document.getElementById("avatar-preview");
  const avatarFile = document.getElementById("avatar-file");
  const avatarDelete = document.getElementById("avatar-delete");

  /* Load profile */
  const { data: draft } = await supabase
    .from("user_profiles")
    .select("*")
    .eq("user_id", user.id)
    .maybeSingle();

  if(draft){
    alias.value = draft.alias || "";
    quote.value = draft.quote || "";
    store.value = draft.store || "";
    slider.value = draft.remote_level || 0;
    mtgo.checked = draft.remote_mtgo || false;
    webcam.checked = draft.remote_webcam || false;

    if(draft.avatar_url){
      avatarPreview.src = draft.avatar_url;
      avatarDelete.classList.remove("hidden");
    }
  }

  /* Remote behavior */
  function updateRemoteUI(){
    const val = parseInt(slider.value);
    wrapper.className = "remote-wrapper level-" + val;

    if(val > 0){
      options.style.display = "block";
    } else {
      options.style.display = "none";
      mtgo.checked = false;
      webcam.checked = false;
    }
  }

  slider.oninput = updateRemoteUI;
  updateRemoteUI();

  /* Avatar preview */
  avatarFile.onchange = () => {
    const file = avatarFile.files[0];
    if(!file) return;
    avatarPreview.src = URL.createObjectURL(file);
    avatarDelete.classList.remove("hidden");
  };

  avatarDelete.onclick = () => {
    avatarPreview.src = "";
    avatarFile.value = "";
    avatarDelete.classList.add("hidden");
  };

  /* Save */
  saveBtn.onclick = async () => {

    saveStatus.textContent = "Saving…";

    let avatar_url = draft?.avatar_url || null;

    if(avatarFile.files[0]){
      const path = user.id + "/" + Date.now() + ".png";
      await supabase.storage.from(AVATAR_BUCKET).upload(path, avatarFile.files[0], { upsert:true });
      avatar_url = supabase.storage.from(AVATAR_BUCKET).getPublicUrl(path).data.publicUrl;
    }

    await supabase.from("user_profiles").upsert({
      user_id:user.id,
      alias:alias.value.trim() || null,
      quote:quote.value.trim() || null,
      store:store.value || null,
      remote_level:parseInt(slider.value),
      remote_mtgo:mtgo.checked,
      remote_webcam:webcam.checked,
      avatar_url,
      updated_at:new Date().toISOString()
    });

    saveStatus.textContent = "Saved.";
  };

}

window.addEventListener("load", init);

</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
