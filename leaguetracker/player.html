<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Player Stats · B.C. Premodern Masters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Global shell (menu + theme) -->
  <link rel="stylesheet" href="/css/bcpmm-shell.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>

  <style>
    body { background: var(--bg); color: var(--fg); }

    .player-wrap {
      max-width: 900px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }

    h1 { margin: 0 0 0.5rem; }
    .meta { opacity: 0.75; margin-bottom: 1.75rem; color: var(--muted); }

    .back { margin: 0 0 1.5rem; opacity: 0.9; }
    .back a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--muted);
    }
    .back a:hover { border-bottom-color: var(--fg); }

    table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }

    th, td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--muted);
      vertical-align: top;
    }

    th { text-align: left; opacity: 0.75; }
    td.num, th.num { text-align: right; }

    .delta.pos { color: #4caf50; }
    .delta.neg { color: #f44336; }

    a { color: inherit; text-decoration: underline; }
    .decklinks a { text-decoration: none; border-bottom: 1px solid var(--muted); }
    .decklinks a:hover { border-bottom-color: var(--fg); }
    .decklinks { white-space: nowrap; font-size: 0.9em; opacity: 0.9; }

    #claim-slot {
      margin-bottom: 1.25rem;
    }

    #claim-slot button {
      padding: 6px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="player-wrap">
  <div class="back">
    <a href="/leaguetracker/">← Back to League Tracker</a>
  </div>

  <h1 id="player-name"></h1>
  <div id="claim-slot"></div>
  <div class="meta" id="player-meta"></div>

  <h2>Points Breakdown</h2>
  <table id="points-table">
    <thead>
      <tr>
        <th>Category</th>
        <th class="num">Points</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Match History (Elo)</h2>
  <table id="history-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Event</th>
        <th>Opponent</th>
        <th>Score</th>
        <th class="num">Δ Elo</th>
        <th class="num">Elo</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
/* ===============================
   CLAIM SYSTEM (MODERATED)
================================ */

async function renderClaimUI(slug) {
  if (!window.auth) return;

  const slot = document.getElementById("claim-slot");
  if (!slot) return;

  const user = await auth.getUser();
  const supabase = auth.supabase;

  if (!user) {
    slot.innerHTML = `<a href="/join.html">Sign in to claim this profile</a>`;
    return;
  }

  // Check approved claim
  const { data: approved } = await supabase
    .from("player_claims")
    .select("*")
    .eq("slug", slug)
    .eq("status", "approved")
    .limit(1);

  if (approved && approved.length > 0) {
    slot.innerHTML = `<span style="opacity:.7">Profile claimed</span>`;
    return;
  }

  // Check if this user already requested
  const { data: mine } = await supabase
    .from("player_claims")
    .select("*")
    .eq("slug", slug)
    .eq("user_id", user.id)
    .limit(1);

  if (mine && mine.length > 0) {
    slot.innerHTML = `<em>Claim pending moderator approval.</em>`;
    return;
  }

  // Otherwise show claim button
  slot.innerHTML = `<button id="claim-btn">Claim this profile</button>`;

  document.getElementById("claim-btn").onclick = async () => {
    if (!confirm("Request to claim this profile? A moderator must approve.")) return;

    await supabase.from("player_claims").insert({
      slug: slug,
      user_id: user.id,
      status: "pending"
    });

    renderClaimUI(slug);
  };
}
</script>

<script>
/* ===============================
   LEAGUE LOGIC (UNCHANGED)
================================ */

const qs = (name) =>
  new URLSearchParams(window.location.search).get(name);

function toSlug(input) {
  return (input || "")
    .toString()
    .trim()
    .normalize("NFKD")
    .toLowerCase()
    .replace(/['’]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}

async function init() {
  const param = qs("player");
  if (!param) return;

  const viewedSlug = toSlug(param);

  document.getElementById("player-name").textContent =
    viewedSlug.replace(/-/g, " ");

  document.getElementById("player-meta").textContent =
    `Player slug: ${viewedSlug}`;

  renderClaimUI(viewedSlug);
}

init();
</script>

<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
