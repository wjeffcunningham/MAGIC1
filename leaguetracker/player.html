<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Player Stats · B.C. Premodern Masters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Global shell (menu + theme) -->
  <link rel="stylesheet" href="/css/bcpmm-shell.css" />

  <style>
    body {
      background: var(--bg);
      color: var(--fg);
    }

    .player-wrap {
      max-width: 900px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }

    h1 { margin: 0 0 0.5rem; }
    .meta { opacity: 0.75; margin-bottom: 1.75rem; color: var(--muted); }

    .back {
      margin: 0 0 1.5rem;
      opacity: 0.9;
    }

    .back a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--muted);
    }

    .back a:hover { border-bottom-color: var(--fg); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.75rem;
    }

    th, td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--muted);
      vertical-align: top;
    }

    th { text-align: left; opacity: 0.75; }
    td.num, th.num { text-align: right; }

    .delta.pos { color: #4caf50; }
    .delta.neg { color: #f44336; }

    a {
      color: inherit;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- GLOBAL MENU ROOT -->
  <div id="global-menu-root"></div>

  <div class="player-wrap">
    <div class="back">
      <a href="/leaguetracker/">← Back to League Tracker</a>
    </div>

    <h1 id="player-name"></h1>
    <div class="meta" id="player-meta"></div>

    <h2>Points Breakdown</h2>
    <table id="points-table">
      <thead>
        <tr>
          <th>Category</th>
          <th class="num">Points</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Match History (Elo)</h2>
    <table id="history-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Event</th>
          <th>Opponent</th>
          <th>Score</th>
          <th class="num">Δ Elo</th>
          <th class="num">Elo</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
  /* =========================================================
     Config
  ========================================================= */

  const EVENT_PATHS = [
    "/leaguetracker/data/raw/events/bcpmm-2026-01-10.json",
    "/leaguetracker/data/raw/events/connections-2026-01-12.json",
    "/leaguetracker/data/raw/events/connections-2026-01-26.json",
    "/leaguetracker/data/raw/events/stronghold-2026-02-01.json",
    "/leaguetracker/data/raw/events/bcwl-2026-01-26-r1.json",
    "/leaguetracker/data/raw/events/bcwl-2026-02-02-r2.json"
  ];

  const START_ELO = 1600;

  const POINT_MULTIPLIERS = {
    BCPMM: 6,
    SHG: 3,
    Connections: 2,
    BCWL: 1
  };

  const K_VALUES = {
    BCPMM: 64,
    SHG: 32,
    Connections: 24,
    BCWL: 16
  };

  /* =========================================================
     Helpers
  ========================================================= */

  function qs(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function slugToName(slug) {
    return (slug || "").replace(/-/g, " ");
  }

  function expectedScore(rA, rB) {
    return 1 / (1 + Math.pow(10, (rB - rA) / 400));
  }

  function scoreAFromMatch(m) {
    if (m.result === "D") return 0.5;

    if (typeof m.gamesA === "number" && typeof m.gamesB === "number") {
      if (m.gamesA === m.gamesB) return 0.5;
      return m.gamesA > m.gamesB ? 1 : 0;
    }

    if (m.winner) return m.winner === m.playerA ? 1 : 0;

    return null;
  }

  function displayScoreForViewed(m, viewed) {
    const isA = viewed === m.playerA;

    if (m.result === "D") return "1-1*";

    if (typeof m.gamesA === "number" && typeof m.gamesB === "number") {
      const a = m.gamesA;
      const b = m.gamesB;
      return isA ? `${a}-${b}` : `${b}-${a}`;
    }

    if (m.winner) {
      const win = m.winner === viewed;
      return win ? "2-0*" : "0-2*";
    }

    return "—";
  }

  function collectMatches(event) {
    const out = [];

    for (const round of event.rounds || []) {
      for (const m of round.matches || []) {
        if (m?.playerA && m?.playerB) out.push({ ...m });
      }
    }

    function walk(node) {
      if (!node) return;

      if (Array.isArray(node)) {
        for (const item of node) walk(item);
        return;
      }

      if (typeof node === "object") {
        if (node.playerA && node.playerB) {
          out.push({ ...node });
          return;
        }
        for (const v of Object.values(node)) walk(v);
      }
    }

    walk(event.elimination);

    return out;
  }

  async function loadEvents() {
    const out = [];
    for (const path of EVENT_PATHS) {
      try {
        const res = await fetch(path);
        if (res.ok) out.push(await res.json());
      } catch {}
    }
    return out;
  }

  /* =========================================================
     Points Breakdown
  ========================================================= */

  function computePoints(player, events) {
    const breakdown = { BCPMM: 0, SHG: 0, Connections: 0, BCWL: 0 };

    for (const event of events) {
      const series = event?.event?.series;
      const mult = POINT_MULTIPLIERS[series] || 1;

      for (const row of event.standings || []) {
        if (row.player === player) {
          breakdown[series] += row.match_points * mult;
        }
      }
    }

    return breakdown;
  }

  /* =========================================================
     Elo Replay (GLOBAL, then filter for viewed player)
  ========================================================= */

  function replayEloForPlayer(viewedPlayer, events) {
    const ratings = {};
    const history = [];

    function ensure(p) {
      if (!(p in ratings)) ratings[p] = START_ELO;
    }

    const ordered = [...events].sort(
      (a, b) => new Date(a.event.date) - new Date(b.event.date)
    );

    for (const event of ordered) {
      const series = event?.event?.series;
      const K = K_VALUES[series] || 16;

      for (const m of collectMatches(event)) {
        if (!m.playerA || !m.playerB) continue;

        const Sa = scoreAFromMatch(m);
        if (Sa === null) continue;

        ensure(m.playerA);
        ensure(m.playerB);

        const Ra = ratings[m.playerA];
        const Rb = ratings[m.playerB];
        const Ea = expectedScore(Ra, Rb);

        const deltaA = K * (Sa - Ea);

        ratings[m.playerA] = Ra + deltaA;
        ratings[m.playerB] = Rb - deltaA;

        if (viewedPlayer === m.playerA || viewedPlayer === m.playerB) {
          const viewedIsA = viewedPlayer === m.playerA;
          const opp = viewedIsA ? m.playerB : m.playerA;
          const deltaViewed = viewedIsA ? deltaA : -deltaA;

          history.push({
            date: event.event.date,
            event: series,
            opponent: opp,
            score: displayScoreForViewed(m, viewedPlayer),
            delta: Math.round(deltaViewed),
            elo: Math.round(ratings[viewedPlayer])
          });
        }
      }
    }

    return history.reverse(); // newest first
  }

  /* =========================================================
     Render
  ========================================================= */

  async function init() {
    const player = qs("player");
    if (!player) return;

    const events = await loadEvents();

    document.getElementById("player-name").textContent = slugToName(player);
    document.getElementById("player-meta").textContent = `Player slug: ${player}`;

    const breakdown = computePoints(player, events);
    const pointsBody = document.querySelector("#points-table tbody");
    pointsBody.innerHTML = "";

    Object.entries(breakdown).forEach(([k, v]) => {
      pointsBody.insertAdjacentHTML(
        "beforeend",
        `<tr><td>${k}</td><td class="num">${v}</td></tr>`
      );
    });

    const history = replayEloForPlayer(player, events);
    const histBody = document.querySelector("#history-table tbody");
    histBody.innerHTML = "";

    history.forEach(row => {
      histBody.insertAdjacentHTML(
        "beforeend",
        `
        <tr>
          <td>${row.date}</td>
          <td>${row.event}</td>
          <td>
            <a href="/leaguetracker/player.html?player=${row.opponent}">
              ${slugToName(row.opponent)}
            </a>
          </td>
          <td>${row.score}</td>
          <td class="num delta ${row.delta >= 0 ? "pos" : "neg"}">
            ${row.delta >= 0 ? "+" : ""}${row.delta}
          </td>
          <td class="num">${row.elo}</td>
        </tr>
        `
      );
    });
  }

  init();
  </script>

  <!-- GLOBAL SHELL LOGIC -->
  <script src="/js/bcpmm-shell.js"></script>

</body>
</html>
