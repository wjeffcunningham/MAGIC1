<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Player Stats · B.C. Premodern Masters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/bcpmm-shell.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>

  <style>
    body { background: var(--bg); color: var(--fg); }

    .player-wrap {
      max-width: 900px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }

    h1 { margin: 0 0 0.5rem; }
    .meta { opacity: 0.75; margin-bottom: 1.75rem; color: var(--muted); }
    .back { margin: 0 0 1.5rem; opacity: 0.9; }

    table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }

    th, td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--muted);
    }

    td.num, th.num { text-align: right; }
    #claim-slot { margin-bottom: 1.25rem; }

    .profile-card {
      margin-bottom: 1.75rem;
      padding: 1.25rem;
      border: 1px solid var(--muted);
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
    }

    .profile-avatar {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--muted);
      margin-bottom: 0.75rem;
      display:block;
    }

    .profile-name {
      font-size: 1.25rem;
      font-weight: 700;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .verified {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .profile-quote {
      font-style: italic;
      opacity: 0.8;
      margin-top: 0.5rem;
    }

    .profile-meta {
      font-size: 0.9em;
      opacity: 0.75;
      margin-top: 0.75rem;
    }

    .claim-box textarea {
      width: 100%;
      max-width: 420px;
      min-height: 80px;
      margin-bottom: 8px;
    }

    .pending {
      color: #c0392b;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="player-wrap">
  <div class="back">
    <a href="/leaguetracker/">← Back to League Tracker</a>
  </div>

  <h1 id="player-name"></h1>
  <div id="profile-display"></div>
  <div id="claim-slot"></div>
  <div class="meta" id="player-meta"></div>

  <h2>Points Breakdown</h2>
  <table id="points-table">
    <thead>
      <tr>
        <th>Category</th>
        <th class="num">Points</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Match History (Elo)</h2>
  <table id="history-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Event</th>
        <th>Opponent</th>
        <th>Score</th>
        <th class="num">Δ Elo</th>
        <th class="num">Elo</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="/leaguetracker/js/player.js"></script>

<script>
function normalizeSlug(input) {
  return (input || "")
    .toString()
    .trim()
    .normalize("NFKD")
    .toLowerCase()
    .replace(/['’]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}

function prettifySlug(slug) {
  return slug
    .split("-")
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(" ");
}

/* --------------------------------------------------
   Profile Display
-------------------------------------------------- */
async function renderProfile(slugRaw) {
  if (!window.auth) return;

  const slug = normalizeSlug(slugRaw);
  const container = document.getElementById("profile-display");
  const supabase = auth._client;

  const { data } = await supabase
    .from("player_profiles")
    .select("*")
    .eq("slug", slug)
    .maybeSingle();

  if (!data) {
    container.innerHTML = "";
    return;
  }

  const displayName = data.alias || prettifySlug(slug);

  const remoteList = [
    data.remote_mtgo ? "MTGO" : null,
    data.remote_webcam ? "Webcam" : null
  ].filter(Boolean);

  container.innerHTML = `
    <div class="profile-card">
      ${data.avatar_url ? `<img src="${data.avatar_url}" class="profile-avatar">` : ""}
      <div class="profile-name">
        ${displayName}
        <span class="verified">✓</span>
      </div>

      ${data.quote ? `<div class="profile-quote">"${data.quote}"</div>` : ""}

      <div class="profile-meta">
        ${remoteList.length ? `<div>Remote: ${remoteList.join(" · ")}</div>` : ""}
        ${data.store ? `<div>Local: ${data.store}</div>` : ""}
      </div>
    </div>
  `;
}

/* --------------------------------------------------
   Claim System (Note Required)
-------------------------------------------------- */
async function renderClaimUI(slugRaw) {
  if (!window.auth) return;

  const slug = normalizeSlug(slugRaw);
  const slot = document.getElementById("claim-slot");
  const user = await auth.getUser();
  const supabase = auth._client;

  if (!user) {
    slot.innerHTML = `<a href="/join.html">Sign in to claim this profile</a>`;
    return;
  }

  const { data: approvedElsewhere } = await supabase
    .from("player_claims")
    .select("slug")
    .eq("user_id", user.id)
    .eq("status", "approved")
    .limit(1);

  if (approvedElsewhere?.length && approvedElsewhere[0].slug !== slug) {
    slot.innerHTML = `<em>You are already verified as ${approvedElsewhere[0].slug}. Each user may only claim one profile.</em>`;
    return;
  }

  const { data: approved } = await supabase
    .from("player_claims")
    .select("*")
    .eq("slug", slug)
    .eq("status", "approved")
    .limit(1);

  if (approved?.length) {
    slot.innerHTML = `<span style="opacity:.7">Profile claimed</span>`;
    return;
  }

  const { data: mine } = await supabase
    .from("player_claims")
    .select("*")
    .eq("slug", slug)
    .eq("user_id", user.id)
    .order("created_at", { ascending: false })
    .limit(1);

  if (mine?.length) {
    const latest = mine[0];

    if (latest.status === "pending") {
      slot.innerHTML = `
        <div class="pending">Verification pending</div>
        <div style="font-size:0.9em; opacity:.7;">
          Your claim is awaiting moderator approval.
        </div>
      `;
      return;
    }

    if (latest.status === "rejected") {
      slot.innerHTML = `
        <div class="claim-box">
          <div style="margin-bottom:6px;">Your previous claim was rejected. Submit again:</div>
          <textarea id="claim-note" placeholder="Short note to admin..."></textarea>
          <button id="claim-btn">Submit Claim</button>
        </div>
      `;

      document.getElementById("claim-btn").onclick = async () => {
        const note = document.getElementById("claim-note").value.trim();
        if (!note) {
          alert("Please include a short note for verification.");
          return;
        }

        await supabase.from("player_claims").insert({
          slug,
          user_id: user.id,
          status: "pending",
          note,
          contact_email: user.email
        });

        renderClaimUI(slug);
      };

      return;
    }
  }

  slot.innerHTML = `
    <div class="claim-box">
      <div style="font-weight:700; margin-bottom:6px;">
        Claim your profile
      </div>
      <textarea id="claim-note"
        placeholder="Short note to admin (e.g. 'This is me, Jeff from Stronghold.')"></textarea>
      <button id="claim-btn">Submit Claim</button>
      <div style="margin-top:6px; font-size:0.9em; opacity:.7;">
        A moderator must verify your identity before approval.
      </div>
    </div>
  `;

  document.getElementById("claim-btn").onclick = async () => {
    const note = document.getElementById("claim-note").value.trim();

    if (!note) {
      alert("Please include a short note for verification.");
      return;
    }

    await supabase.from("player_claims").insert({
      slug,
      user_id: user.id,
      status: "pending",
      note,
      contact_email: user.email
    });

    renderClaimUI(slug);
  };
}

/* --------------------------------------------------
   INIT
-------------------------------------------------- */
window.addEventListener("load", () => {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("player");
  if (!slug) return;

  renderProfile(slug);
  renderClaimUI(slug);
});
</script>

<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
