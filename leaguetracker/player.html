<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Player Stats · B.C. Premodern Masters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/bcpmm-shell.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>

  <style>
    body { background: var(--bg); color: var(--fg); }

    .player-wrap {
      max-width: 900px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }

    h1 { margin: 0 0 0.5rem; }
    .meta { opacity: 0.75; margin-bottom: 1.75rem; color: var(--muted); }

    .back { margin: 0 0 1.5rem; opacity: 0.9; }

    table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }

    th, td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--muted);
    }

    td.num, th.num { text-align: right; }

    #claim-slot { margin-bottom: 1rem; }
  </style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="player-wrap">
  <div class="back">
    <a href="/leaguetracker/">← Back to League Tracker</a>
  </div>

  <h1 id="player-name"></h1>
  <div id="claim-slot"></div>
  <div class="meta" id="player-meta"></div>

  <h2>Points Breakdown</h2>
  <table id="points-table">
    <thead>
      <tr>
        <th>Category</th>
        <th class="num">Points</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Match History (Elo)</h2>
  <table id="history-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Event</th>
        <th>Opponent</th>
        <th>Score</th>
        <th class="num">Δ Elo</th>
        <th class="num">Elo</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- 1️⃣ Load canonical league engine -->
<script src="/js/player.js"></script>

<!-- 2️⃣ Add claim system ONLY -->
<script>
async function renderClaimUI(slug) {
  if (!window.auth) return;

  const slot = document.getElementById("claim-slot");
  if (!slot) return;

  const user = await auth.getUser();
  const supabase = auth._client;

  // Check approved claim
  const { data: approved } = await supabase
    .from("player_claims")
    .select("*")
    .eq("slug", slug)
    .eq("status", "approved")
    .limit(1);

  if (approved && approved.length > 0) {
    slot.innerHTML = `<span style="opacity:.7">Profile claimed</span>`;
    return;
  }

  if (!user) {
    slot.innerHTML = `<a href="/join.html">Sign in to claim this profile</a>`;
    return;
  }

  // Check if this user already requested
  const { data: mine } = await supabase
    .from("player_claims")
    .select("*")
    .eq("slug", slug)
    .eq("user_id", user.id)
    .limit(1);

  if (mine && mine.length > 0) {
    slot.innerHTML = `<em>Claim pending moderator approval.</em>`;
    return;
  }

  slot.innerHTML = `<button id="claim-btn">Claim this profile</button>`;

  document.getElementById("claim-btn").onclick = async () => {
    await supabase.from("player_claims").insert({
      slug: slug,
      user_id: user.id,
      status: "pending"
    });
    renderClaimUI(slug);
  };
}

// Hook into existing page once player.js finishes rendering
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("player");
  if (slug) renderClaimUI(slug);
});
</script>

<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
