<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Player Stats · B.C. Premodern Masters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Global shell (menu + theme) -->
  <link rel="stylesheet" href="/css/bcpmm-shell.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

  <style>
    body { background: var(--bg); color: var(--fg); }

    .player-wrap {
      max-width: 900px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }

    h1 { margin: 0 0 0.5rem; }
    .meta { opacity: 0.75; margin-bottom: 1.75rem; color: var(--muted); }

    .back { margin: 0 0 1.5rem; opacity: 0.9; }
    .back a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--muted);
    }
    .back a:hover { border-bottom-color: var(--fg); }

    table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }

    th, td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--muted);
      vertical-align: top;
    }

    th { text-align: left; opacity: 0.75; }
    td.num, th.num { text-align: right; }

    .delta.pos { color: #4caf50; }
    .delta.neg { color: #f44336; }

    a { color: inherit; text-decoration: underline; }
    .decklinks a { text-decoration: none; border-bottom: 1px solid var(--muted); }
    .decklinks a:hover { border-bottom-color: var(--fg); }
    .decklinks { white-space: nowrap; font-size: 0.9em; opacity: 0.9; }


/* =========================================================
   Points Breakdown highlighting
========================================================= */

#points-table tr.row-bcpmm td.num {
  font-weight: 800;
  background: linear-gradient(90deg, #caa94b, #f6e39a, #caa94b);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

#points-table tr.row-bcwl td.num {
  font-weight: 800;
  color: #8b5cf6;
}

#points-table tr.row-connections td.num {
  font-weight: 700;
  color: var(--fg);
  opacity: 0.9;
}

#points-table tr.row-shg td.num {
  font-weight: 700;
  color: var(--fg);
  opacity: 0.9;
}

  </style>
</head>

<body>

  <!-- GLOBAL MENU ROOT -->
  <div id="global-menu-root"></div>

  <div class="player-wrap">
    <div class="back">
      <a href="/leaguetracker/">← Back to League Tracker</a>
    </div>

    <h1 id="player-name"></h1>
    <div class="meta" id="player-meta"></div>

    <h2>Points Breakdown</h2>
    <table id="points-table">
      <thead>
        <tr>
          <th>Category</th>
          <th class="num">Points</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Match History (Elo)</h2>
    <table id="history-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Event</th>
          <th>Opponent</th>
          <th>Score</th>
          <th class="num">Δ Elo</th>
          <th class="num">Elo</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
  /* =========================================================
     Config
  ========================================================= */

  const EVENT_PATHS = [
    "/leaguetracker/data/raw/events/bcpmm-2026-01-10.json",
    "/leaguetracker/data/raw/events/connections-2026-01-12.json",
    "/leaguetracker/data/raw/events/connections-2026-01-26.json",
    "/leaguetracker/data/raw/events/connections-2026-02-09.json",
    "/leaguetracker/data/raw/events/stronghold-2026-02-01.json",
    "/leaguetracker/data/raw/events/bcwl-2026-01-26-r1.json",
    "/leaguetracker/data/raw/events/bcwl-2026-02-02-r2.json"
  ];

  const START_ELO = 1600;

  const POINT_MULTIPLIERS = {
    BCPMM: 6,
    SHG: 3,
    Connections: 2,
    BCWL: 1
  };

  const K_VALUES = {
    BCPMM: 64,
    SHG: 32,
    Connections: 24,
    BCWL: 16
  };

  // Optional: top-8 decklist mapping (fill in as you like)
  // Keys must be canonical slugs (the same ones used in URLs)
  const DECKLIST_BY_PLAYER = {
    // "caitlyn-bethune": "https://mtgdecks.net/Premodern/goblins-decklist-by-caitlyn-bethune-2765275",
    // "andrew-kidston": "https://mtgdecks.net/Premodern/stiflenought-decklist-by-andrew-kidston-2765276",
  };

  /* =========================================================
     Canonicalization (THE FIX)
  ========================================================= */

  function toSlug(input) {
    return (input || "")
      .toString()
      .trim()
      .normalize("NFKD")
      .toLowerCase()
      .replace(/['’]/g, "")           // remove apostrophes
      .replace(/[^a-z0-9]+/g, "-")    // non-alnum -> hyphen
      .replace(/-+/g, "-")
      .replace(/^-|-$/g, "");
  }

  function prettyFromSlug(slug) {
    return (slug || "").replace(/-/g, " ");
  }

  /* =========================================================
     Helpers
  ========================================================= */

  function qs(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function expectedScore(rA, rB) {
    return 1 / (1 + Math.pow(10, (rB - rA) / 400));
  }

  function scoreAFromMatch(m) {
    if (m.result === "D") return 0.5;

    if (typeof m.gamesA === "number" && typeof m.gamesB === "number") {
      if (m.gamesA === m.gamesB) return 0.5;
      return m.gamesA > m.gamesB ? 1 : 0;
    }

    if (m.winner) return m.winner === m.playerA ? 1 : 0;

    return null;
  }

  function displayScoreForViewed(m, viewedSlug) {
    const isA = viewedSlug === m.playerA;

    if (m.result === "D") return "1-1*";

    if (typeof m.gamesA === "number" && typeof m.gamesB === "number") {
      const a = m.gamesA;
      const b = m.gamesB;
      return isA ? `${a}-${b}` : `${b}-${a}`;
    }

    if (m.winner) {
      const win = m.winner === viewedSlug;
      return win ? "2-0*" : "0-2*";
    }

    return "—";
  }

  function collectMatches(event) {
    const out = [];

    for (const round of event.rounds || []) {
      for (const raw of round.matches || []) {
        if (!raw?.playerA || !raw?.playerB) continue;
        out.push({
          ...raw,
          playerA: toSlug(raw.playerA),
          playerB: toSlug(raw.playerB),
          winner: raw.winner ? toSlug(raw.winner) : null
        });
      }
    }

    function walk(node) {
      if (!node) return;
      if (Array.isArray(node)) return node.forEach(walk);

      if (typeof node === "object") {
        if (node.playerA && node.playerB) {
          out.push({
            ...node,
            playerA: toSlug(node.playerA),
            playerB: toSlug(node.playerB),
            winner: node.winner ? toSlug(node.winner) : null
          });
          return;
        }
        Object.values(node).forEach(walk);
      }
    }

    walk(event.elimination);
    return out;
  }

  async function loadEvents() {
    const out = [];
    for (const path of EVENT_PATHS) {
      try {
        const res = await fetch(path);
        if (res.ok) out.push(await res.json());
      } catch {}
    }
    return out;
  }

  /* =========================================================
     Points Breakdown
     - For BCWL, use latest standings snapshot only (prevents 9 from r1+r2)
  ========================================================= */

  function computePoints(viewedSlug, events) {
    const breakdown = { BCPMM: 0, SHG: 0, Connections: 0, BCWL: 0 };

    // For non-BCWL, sum across events normally
    for (const event of events) {
      const series = event?.event?.series;
      if (!series || series === "BCWL") continue;

      const mult = POINT_MULTIPLIERS[series] || 1;

      for (const row of event.standings || []) {
        if (toSlug(row.player) === viewedSlug) {
          breakdown[series] += row.match_points * mult;
        }
      }
    }

    // For BCWL, take the MOST RECENT standings only (snapshot model)
    const latestBCWL = [...events]
      .filter(e => e?.event?.series === "BCWL" && Array.isArray(e.standings))
      .sort((a, b) => new Date(b.event.date) - new Date(a.event.date))[0];

    if (latestBCWL) {
      for (const row of latestBCWL.standings || []) {
        if (toSlug(row.player) === viewedSlug) {
          breakdown.BCWL = row.match_points * (POINT_MULTIPLIERS.BCWL || 1);
        }
      }
    }

    return breakdown;
  }

  /* =========================================================
     Elo Replay (GLOBAL, then filter for viewed player)
     - Ratings keyed by canonical slug for EVERYONE (fixes Bethune/Marcus issues)
  ========================================================= */

  function replayEloForPlayer(viewedSlug, events, displayNameBySlug) {
    const ratings = {};
    const history = [];

    function ensure(p) {
      if (!(p in ratings)) ratings[p] = START_ELO;
    }

    const ordered = [...events].sort(
      (a, b) => new Date(a.event.date) - new Date(b.event.date)
    );

    for (const event of ordered) {
      const series = event?.event?.series;
      const K = K_VALUES[series] || 16;

      for (const m of collectMatches(event)) {
        if (!m.playerA || !m.playerB) continue;

        const Sa = scoreAFromMatch(m);
        if (Sa === null) continue;

        ensure(m.playerA);
        ensure(m.playerB);

        const Ra = ratings[m.playerA];
        const Rb = ratings[m.playerB];
        const Ea = expectedScore(Ra, Rb);

        const deltaA = K * (Sa - Ea);

        ratings[m.playerA] = Ra + deltaA;
        ratings[m.playerB] = Rb - deltaA;

        if (viewedSlug === m.playerA || viewedSlug === m.playerB) {
          const viewedIsA = viewedSlug === m.playerA;
          const opp = viewedIsA ? m.playerB : m.playerA;
          const deltaViewed = viewedIsA ? deltaA : -deltaA;

          history.push({
            date: event.event.date,
            event: series,
            opponent: opp,
            opponentLabel: displayNameBySlug[opp] || prettyFromSlug(opp),
            score: displayScoreForViewed(m, viewedSlug),
            delta: Math.round(deltaViewed),
            elo: Math.round(ratings[viewedSlug]),

            // decklist linking (optional)
            deckViewed: DECKLIST_BY_PLAYER[viewedSlug] || null,
            deckOpp: DECKLIST_BY_PLAYER[opp] || null
          });
        }
      }
    }

    return history.reverse(); // newest first
  }

  /* =========================================================
     Build display-name map (best-effort)
  ========================================================= */

  function buildDisplayNameMap(events) {
    const map = {}; // slug -> best display string seen

    function consider(rawName) {
      const slug = toSlug(rawName);
      if (!slug) return;

      const pretty =
        (rawName || "").toString().trim().length
          ? rawName.toString().trim()
          : prettyFromSlug(slug);

      // keep first “nice” version we see
      if (!map[slug]) map[slug] = pretty;
    }

    for (const e of events) {
      for (const row of e.standings || []) consider(row.player);
      for (const round of e.rounds || []) {
        for (const m of round.matches || []) {
          consider(m.playerA);
          consider(m.playerB);
        }
      }

      // elimination can be messy; collectMatches already canonicalizes, so just skip here
    }

    return map;
  }

  /* =========================================================
     Render
  ========================================================= */

  async function init() {
    const playerParam = qs("player");
    if (!playerParam) return;

    const viewedSlug = toSlug(playerParam);
    const events = await loadEvents();
    const displayNameBySlug = buildDisplayNameMap(events);

    document.getElementById("player-name").textContent =
      displayNameBySlug[viewedSlug] || prettyFromSlug(viewedSlug);

    document.getElementById("player-meta").textContent =
      `Player slug: ${viewedSlug}`;

    const breakdown = computePoints(viewedSlug, events);
    const pointsBody = document.querySelector("#points-table tbody");
    pointsBody.innerHTML = "";

Object.entries(breakdown).forEach(([k, v]) => {
  const cls =
    k === "BCPMM" ? "row-bcpmm" :
    k === "BCWL" ? "row-bcwl" :
    k === "Connections" ? "row-connections" :
    k === "SHG" ? "row-shg" : "";

  pointsBody.insertAdjacentHTML(
    "beforeend",
    `<tr class="${cls}"><td>${k}</td><td class="num">${v}</td></tr>`
  );
});

    const history = replayEloForPlayer(viewedSlug, events, displayNameBySlug);
    const histBody = document.querySelector("#history-table tbody");
    histBody.innerHTML = "";

    history.forEach(row => {
      const deckLinks =
        row.event === "BCPMM" && (row.deckViewed || row.deckOpp)
          ? `
            <span class="decklinks">
              ${row.deckViewed ? ` · <a href="${row.deckViewed}" target="_blank" rel="noopener">deck</a>` : ""}
              ${row.deckOpp ? ` · <a href="${row.deckOpp}" target="_blank" rel="noopener">opp deck</a>` : ""}
            </span>
          `
          : "";

      histBody.insertAdjacentHTML(
        "beforeend",
        `
        <tr>
          <td>${row.date}</td>
          <td>${row.event}</td>
          <td>
            <a href="/leaguetracker/player.html?player=${row.opponent}">
              ${row.opponentLabel}
            </a>
            ${deckLinks}
          </td>
          <td>${row.score}</td>
          <td class="num delta ${row.delta >= 0 ? "pos" : "neg"}">
            ${row.delta >= 0 ? "+" : ""}${row.delta}
          </td>
          <td class="num">${row.elo}</td>
        </tr>
        `
      );
    });
  }

  init();
  </script>

  <!-- GLOBAL SHELL LOGIC -->
  <script src="/js/bcpmm-shell.js"></script>

</body>
</html>
