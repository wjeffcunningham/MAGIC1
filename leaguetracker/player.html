<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Player Stats · B.C. Premodern Masters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/bcpmm-shell.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>

  <style>
    body { background: var(--bg); color: var(--fg); }

    .player-wrap {
      max-width: 900px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }

    th, td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--muted);
    }

    td.num, th.num { text-align: right; }

    .bonus-icons { margin-left: 6px; }
  </style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="player-wrap">
  <div><a href="/leaguetracker/">← Back to League Tracker</a></div>

  <h1 id="player-name"></h1>
  <div id="player-meta"></div>

  <h2>Points Breakdown</h2>
  <table id="points-table">
    <tbody></tbody>
  </table>

  <h2>Match History (Elo)</h2>
  <table id="history-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Event</th>
        <th>Opponent</th>
        <th>Score</th>
        <th class="num">Δ Elo</th>
        <th class="num">Elo</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="/leaguetracker/js/player.js?v=20260216-1"></script>
<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
