<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Player Stats · B.C. Premodern Masters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/bcpmm-shell.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>

  <style>
    body { background: var(--bg); color: var(--fg); }

    .player-wrap {
      max-width: 900px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }

    h1 { margin: 0 0 0.5rem; }
    .meta { opacity: 0.75; margin-bottom: 1.75rem; color: var(--muted); }

    .back { margin: 0 0 1.5rem; opacity: 0.9; }

    table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }

    th, td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--muted);
    }

    td.num, th.num { text-align: right; }

    #claim-slot { margin-bottom: 1rem; }

    .profile-card {
      margin-bottom: 1.25rem;
      padding: 1rem;
      border: 1px solid var(--muted);
      border-radius: 6px;
    }

    .profile-card img {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 0.5rem;
    }

    .profile-quote {
      font-style: italic;
      opacity: 0.8;
      margin-top: 0.5rem;
    }

    .profile-meta {
      font-size: 0.9em;
      opacity: 0.75;
      margin-top: 0.5rem;
    }
  </style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="player-wrap">
  <div class="back">
    <a href="/leaguetracker/">← Back to League Tracker</a>
  </div>

  <h1 id="player-name"></h1>
  <div id="profile-display"></div>
  <div id="claim-slot"></div>
  <div class="meta" id="player-meta"></div>

  <h2>Points Breakdown</h2>
  <table id="points-table">
    <thead>
      <tr>
        <th>Category</th>
        <th class="num">Points</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Match History (Elo)</h2>
  <table id="history-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Event</th>
        <th>Opponent</th>
        <th>Score</th>
        <th class="num">Δ Elo</th>
        <th class="num">Elo</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Load canonical league engine -->
<script src="/leaguetracker/js/player.js"></script>

<script>
function normalizeSlug(input) {
  return (input || "")
    .toString()
    .trim()
    .normalize("NFKD")
    .toLowerCase()
    .replace(/['’]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}

/* --------------------------------------------------
   Load public profile display
-------------------------------------------------- */
async function renderProfile(slugRaw) {
  if (!window.auth) return;

  const slug = normalizeSlug(slugRaw);
  const container = document.getElementById("profile-display");
  if (!container) return;

  const supabase = auth._client;

  const { data } = await supabase
    .from("player_profiles")
    .select("*")
    .eq("slug", slug)
    .single();

  if (!data) {
    container.innerHTML = "";
    return;
  }

  container.innerHTML = `
    <div class="profile-card">
      ${data.avatar_url ? `<img src="${data.avatar_url}" alt="Avatar">` : ""}
      <div><strong>${data.display_name || slug}</strong></div>
      ${data.quote ? `<div class="profile-quote">"${data.quote}"</div>` : ""}
      <div class="profile-meta">
        ${data.remote_mtgo ? "MTGO " : ""}
        ${data.remote_webcam ? "Webcam " : ""}
        ${data.store ? `<div>Local Store: ${data.store}</div>` : ""}
      </div>
    </div>
  `;
}

/* --------------------------------------------------
   Claim system
-------------------------------------------------- */
async function renderClaimUI(slugRaw) {
  if (!window.auth) return;

  const slug = normalizeSlug(slugRaw);
  const slot = document.getElementById("claim-slot");
  if (!slot) return;

  const user = await auth.getUser();
  const supabase = auth._client;

  if (!user) {
    slot.innerHTML = `<a href="/join.html">Sign in to claim this profile</a>`;
    return;
  }

  const { data: approvedElsewhere } = await supabase
    .from("player_claims")
    .select("slug")
    .eq("user_id", user.id)
    .eq("status", "approved")
    .limit(1);

  if (approvedElsewhere && approvedElsewhere.length > 0) {
    const approvedSlug = approvedElsewhere[0].slug;
    if (approvedSlug !== slug) {
      slot.innerHTML = `<em>You are already verified as ${approvedSlug}. Each user may only claim one profile.</em>`;
      return;
    }
  }

  const { data: approved } = await supabase
    .from("player_claims")
    .select("*")
    .eq("slug", slug)
    .eq("status", "approved")
    .limit(1);

  if (approved && approved.length > 0) {
    slot.innerHTML = `<span style="opacity:.7">Profile claimed</span>`;
    return;
  }

  const { data: mine } = await supabase
    .from("player_claims")
    .select("*")
    .eq("slug", slug)
    .eq("user_id", user.id)
    .order("created_at", { ascending: false })
    .limit(1);

  if (mine && mine.length > 0) {
    const latest = mine[0];

    if (latest.status === "pending") {
      slot.innerHTML = `<em>Claim pending moderator approval.</em>`;
      return;
    }

    if (latest.status === "rejected") {
      slot.innerHTML = `<em>Your previous claim was rejected. You may submit again.</em><br>
      <button id="claim-btn">Request Claim Again</button>`;

      document.getElementById("claim-btn").onclick = async () => {
        await supabase.from("player_claims").insert({
          slug,
          user_id: user.id,
          status: "pending"
        });
        renderClaimUI(slug);
      };
      return;
    }
  }

  slot.innerHTML = `<button id="claim-btn">Claim this profile</button>`;

  document.getElementById("claim-btn").onclick = async () => {
    await supabase.from("player_claims").insert({
      slug,
      user_id: user.id,
      status: "pending"
    });
    renderClaimUI(slug);
  };
}

/* --------------------------------------------------
   INIT
-------------------------------------------------- */
window.addEventListener("load", () => {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("player");
  if (!slug) return;

  renderProfile(slug);
  renderClaimUI(slug);
});
</script>

<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
