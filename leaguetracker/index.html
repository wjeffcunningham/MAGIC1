<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>League Tracker · B.C. Premodern Masters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/css/bcpmm-shell.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>

  <style>
    body { background: var(--bg); color: var(--fg); }

    .tracker {
      max-width: 900px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 1rem;
    }

    .logo-wrap img {
      width: 90px;
      opacity: 0.95;
    }

    .tabs {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .tabs button {
      background: transparent;
      border: 1px solid var(--muted);
      color: var(--fg);
      padding: 0.5rem 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tabs button.active {
      background: var(--fg);
      color: var(--bg);
    }

    .filter-box {
      margin-bottom: 1rem;
      display: none;
      font-weight: 700;
    }

    table.ladder {
      width: 100%;
      border-collapse: collapse;
    }

    .ladder th,
    .ladder td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--muted);
    }

    .ladder td.num,
    .ladder th.num {
      text-align: right;
    }

    .ladder td.rank,
    .ladder th.rank {
      width: 3rem;
      text-align: right;
    }
  </style>
</head>

<body>

<div id="global-menu-root"></div>

<main class="tracker">

  <div class="logo-wrap">
    <img src="/assets/BCPMMsvg.png" alt="BCPMM Logo">
  </div>

  <h1>League Tracker</h1>

  <div class="tabs">
    <button data-mode="bcpmm" class="active">BCPMM Points</button>
    <button data-mode="league">League (January)</button>
    <button data-mode="elo">Elo</button>
  </div>

  <div class="filter-box" id="bcpmm-filter">
    <label>
      <input type="checkbox" id="bcpmm-only">
      🏆 only
    </label>
  </div>

  <table class="ladder">
    <thead>
      <tr>
        <th class="rank">#</th>
        <th>Player</th>
        <th class="num">Points</th>
      </tr>
    </thead>
    <tbody id="ladder-body"></tbody>
  </table>

</main>

<script src="./js/league.js?v=20260216-1"></script>
<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
