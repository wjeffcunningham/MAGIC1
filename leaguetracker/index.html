<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>League Tracker · B.C. Premodern Masters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Global shell (menu + theme) -->
  <link rel="stylesheet" href="/css/bcpmm-shell.css">

  <!-- PAGE-SPECIFIC STYLES (INLINE, THEME-AWARE) -->
  <style>
    body {
      background: var(--bg);
      color: var(--fg);
    }

    .tracker {
      max-width: 900px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
      background: var(--bg);
      color: var(--fg);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
      color: var(--fg);
    }

    h1 {
      margin-bottom: 1.5rem;
    }

    .tabs {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .tabs button {
      background: transparent;
      border: 1px solid var(--muted);
      color: var(--fg);
      padding: 0.5rem 0.75rem;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .tabs button.active {
      background: var(--fg);
      color: var(--bg);
    }

    table.ladder {
      width: 100%;
      border-collapse: collapse;
    }

    .ladder th,
    .ladder td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--muted);
    }

    .ladder th {
      text-align: left;
      opacity: 0.7;
    }

    .ladder td.num,
    .ladder th.num {
      text-align: right;
    }

    .ladder th.rank,
    .ladder td.rank {
      width: 3rem;
      text-align: right;
    }

    .ladder th.player {
      width: 60%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<!-- GLOBAL MENU ROOT -->
<div id="global-menu-root"></div>

<!-- PAGE CONTENT -->
<main class="tracker">

  <a href="/" class="back-link">← Back to main</a>

  <h1>League Tracker</h1>

  <div class="tabs">
    <button type="button" data-mode="bcpmm" class="active">
      BCPMM Points
    </button>

    <button type="button" data-mode="league">
      League (Feb)
    </button>

    <button type="button" data-mode="elo">
      Elo
    </button>
  </div>

  <table class="ladder">
    <thead>
      <tr>
        <th class="rank">#</th>
        <th class="player">Player</th>
        <th class="num">Value</th>
      </tr>
    </thead>
    <tbody id="ladder-body">
      <!-- populated by JS -->
    </tbody>
  </table>
</main>

<!-- Main league logic -->
<script src="./js/league.js?v=20260208-2"></script>

<!-- Global shell logic -->
<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
