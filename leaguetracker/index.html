<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>League Tracker · B.C. Premodern Masters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/css/bcpmm-shell.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>

  <style>
    body { background: var(--bg); color: var(--fg); }

    .tracker {
      max-width: 900px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 1rem;
    }

    .logo-wrap img {
      width: 90px;
      opacity: 0.95;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .info-btn {
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--muted);
      padding: 0.35rem 0.6rem;
      color: var(--fg);
      background: transparent;
    }

    .info-btn:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .tabs {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .tabs button {
      background: transparent;
      border: 1px solid var(--muted);
      color: var(--fg);
      padding: 0.5rem 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tabs button.active {
      background: var(--fg);
      color: var(--bg);
    }

    .filter-box {
      margin-bottom: 1rem;
      display: none;
      font-weight: 700;
    }

    table.ladder {
      width: 100%;
      border-collapse: collapse;
    }

    .ladder th,
    .ladder td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--muted);
    }

    .ladder td.num,
    .ladder th.num {
      text-align: right;
    }

    .ladder td.rank,
    .ladder th.rank {
      width: 3rem;
      text-align: right;
    }

.tracker {
  position: relative;
  border-left: 3px solid var(--accent-color);
  padding-left: 1.75rem;
}
  </style>
</head>

<body>

<div id="global-menu-root"></div>

<main class="tracker">

  <div class="logo-wrap">
    <img src="/assets/BCPMMsvg.png" alt="BCPMM Logo">
  </div>

  <div class="header-row">
    <h1 style="margin:0;">League Tracker</h1>
    <a href="./leagueinfo.html" class="info-btn">ⓘ Info</a>
  </div>

  <div class="tabs">
    <button data-mode="bcpmm" class="active">BCPMM Points (2026)</button>
    <button data-mode="league">League (March)</button>
    <button data-mode="elo">Elo</button>
  </div>

  <div class="filter-box" id="bcpmm-filter">
    <label>
      <input type="checkbox" id="bcpmm-only">
      🏆 only
    </label>
  </div>

  <table class="ladder">
    <thead>
      <tr>
        <th class="rank">#</th>
        <th>Player</th>
        <th class="num">Points</th>
      </tr>
    </thead>
    <tbody id="ladder-body"></tbody>
  </table>

<p><i>4/12/26</i></p>
</main>

<!-- CORRECT SCRIPT -->
<script src="./js/league.js?v=20260303-2"></script>

<script src="/js/bcpmm-shell.js"></script>

<script>
  const accents = ["#c0392b", "#2471a3", "#1e8449"];
  const pick = accents[Math.floor(Math.random() * accents.length)];
  document.documentElement.style.setProperty("--accent-color", pick);
</script>

</body>
</html>
