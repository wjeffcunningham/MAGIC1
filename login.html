<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Login / Sign Up · magic1.ca</title>

<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding:40px; }
  .shell { max-width: 420px; margin: 0 auto; }
  input, button {
    width:100%; padding:12px; margin:8px 0;
    border-radius:8px; border:1px solid #000;
    font-size:16px;
  }
  button { background:black; color:white; cursor:pointer; }
</style>
</head>
<body>

<div class="shell">
  <h1>Login / Sign-Up</h1>

  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="password">

  <button id="login-btn">Log in</button>
  <button id="signup-btn">Sign up</button>
  <button id="forgot-btn" style="background:#444;">Forgot Password</button>

  <p id="msg"></p>
</div>

<script type="module">
import { supabase } from "/js/config.js";

const email = document.getElementById("email");
const pw = document.getElementById("password");
const msg = document.getElementById("msg");

// ---------------------- LOGIN -----------------------
document.getElementById("login-btn").onclick = async () => {
  const { error } = await supabase.auth.signInWithPassword({
    email: email.value,
    password: pw.value
  });
  msg.textContent = error ? error.message : "Logged in!";
  if (!error) location.href = "/user-settings.html";
};

// ---------------------- SIGN UP -----------------------
document.getElementById("signup-btn").onclick = async () => {
  msg.textContent = "Creating account…";

  const { data, error } = await supabase.auth.signUp({
    email: email.value,
    password: pw.value
  });

  if (error) { msg.textContent = error.message; return; }

  // Insert profile row
  await supabase.from("users").insert({
    id: data.user.id,
    email: email.value,
    name: email.value,
    verified: false,
    is_mod: false
  });

  msg.textContent = "Welcome!";
  alert("Welcome to Magic1.ca! Your account is pending moderator approval. You will receive an email once approved.");
  location.href = "/";
};

// ---------------------- FORGOT PASSWORD -----------------------
document.getElementById("forgot-btn").onclick = async () => {
  const { error } = await supabase.auth.resetPasswordForEmail(email.value);
  msg.textContent = error ? error.message : "Password reset email sent!";
};
</script>

</body>
</html>
