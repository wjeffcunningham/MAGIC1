<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login / Sign Up · magic1.ca</title>
<style>
  body { font-family:-apple-system, BlinkMacSystemFont, sans-serif; padding:40px; }
  .shell { max-width:420px; margin:0 auto; }
  input, button {
    width:100%; padding:12px; margin:6px 0;
    border-radius:8px; border:1px solid #000; font-size:16px;
  }
  button { background:#000; color:#fff; cursor:pointer; }
  #msg { min-height:1.5em; margin-top:10px; }
</style>
</head>

<body>
<div class="shell">
  <h1>Login / Sign-Up</h1>

  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="password">
  <input id="handle" placeholder="handle (league display)" />

  <button id="login-btn">Log In</button>
  <button id="signup-btn">Sign Up</button>

  <p id="msg"></p>
</div>

<script type="module">
import { supabase } from "/js/config.js";

const emailField = document.getElementById("email");
const pwField    = document.getElementById("password");
const handleFld  = document.getElementById("handle");
const msg        = document.getElementById("msg");

function show(m) { msg.textContent = m; }
function busy(x) {
  document.getElementById("login-btn").disabled  = x;
  document.getElementById("signup-btn").disabled = x;
}

/* ---------------------
      LOGIN
---------------------- */
document.getElementById("login-btn").onclick = async () => {
  busy(true);

  const { data, error } = await supabase.auth.signInWithPassword({
    email: emailField.value.trim(),
    password: pwField.value
  });

  if (error) { show(error.message); busy(false); return; }

  const uid = data.user.id;

  const { data: prof } = await supabase
    .from("site_users")
    .select("status")
    .eq("id", uid)
    .single();

  if (!prof) {
    show("Profile missing.");
    busy(false);
    return;
  }

  if (prof.status === "pending") {
    show("Your account is pending approval.");
    busy(false);
    return;
  }

  window.location.href = "/bcwl-hub.html";
};

/* ---------------------
      SIGN UP
---------------------- */
document.getElementById("signup-btn").onclick = async () => {
  busy(true);

  const email = emailField.value.trim();
  const password = pwField.value.trim();
  const handle = handleFld.value.trim();

  if (!email || !password || !handle) {
    show("Email, password, and handle are required.");
    busy(false);
    return;
  }

  // 1. Create Supabase Auth user
  const { data, error } = await supabase.auth.signUp({ email, password });

  if (error) {
    show(error.message);
    busy(false);
    return;
  }

  const user = data.user;

  // 2. Insert profile row with required handle
  const { error: profileErr } = await supabase
    .from("site_users")
    .insert({
      id: user.id,
      email,
      handle,
      status: "pending"
    });

  if (profileErr) {
    show("Profile error: " + profileErr.message);
    busy(false);
    return;
  }

  show("Signup successful. Pending approval.");
  busy(false);
};
</script>

<script type="module" src="/js/global-menu-loader.js"></script>
</body>
</html>
