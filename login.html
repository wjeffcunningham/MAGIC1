<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login · magic1.ca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">

  <!-- GLOBAL MENU LOADER -->
  <script type="module" src="/js/global-menu-loader.js"></script>

  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md space-y-8">

      <!-- ========================= -->
      <!-- Already Logged In -->
      <!-- ========================= -->
      <section id="logged-in-panel" class="hidden">
        <h1 class="text-xl font-semibold mb-2">You're already logged in</h1>
        <p class="text-sm text-slate-700 mb-4">
          Logged in as <span id="session-name"></span>
          (<span id="session-username"></span>)
        </p>
        <a id="session-next-link"
           class="block text-center bg-sky-600 text-white py-2 rounded mb-2"
           href="/">
          Continue
        </a>
        <button id="logout-btn"
                class="block w-full bg-slate-200 text-slate-800 py-2 rounded">
          Log out
        </button>
      </section>


      <!-- ========================= -->
      <!-- LOGIN FORM -->
      <!-- ========================= -->
      <section id="email-login-panel">
        <h2 class="text-2xl font-bold mb-4 text-center">Log In</h2>

        <form id="email-login-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" name="email"
                   class="w-full border rounded px-3 py-2 text-sm"
                   placeholder="you@example.com" required />
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" name="password"
                   class="w-full border rounded px-3 py-2 text-sm"
                   placeholder="********" required />
          </div>

          <p id="email-login-error" class="text-sm text-red-600 hidden"></p>

          <button class="w-full bg-slate-800 text-white py-2 rounded text-sm">
            Log in
          </button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-3">
          Don’t have an account?
          <a href="#signup" class="text-sky-600 underline">Create one</a>
        </p>
      </section>


      <!-- ========================= -->
      <!-- SIGNUP FORM (UPDATED) -->
      <!-- ========================= -->
      <section id="signup-section">
        <h2 class="text-2xl font-bold mb-4 text-center" id="signup">Create Account</h2>
        <p class="text-sm text-slate-600 mb-4 text-center">
          Use the same email you used when registering at Stronghold.
        </p>

        <form id="signup-form" class="space-y-4">

          <!-- Full name -->
          <div>
            <label class="block text-sm font-medium mb-1">Full Name</label>
            <input type="text" name="full_name"
                   class="w-full border rounded px-3 py-2 text-sm"
                   placeholder="Your Name Here" required />
          </div>

          <!-- Email -->
          <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" name="email"
                   class="w-full border rounded px-3 py-2 text-sm"
                   placeholder="you@example.com" required />
          </div>

          <!-- HOME STORE -->
          <div>
            <label class="block text-sm font-medium mb-1">Home Store</label>
            <select name="home_store" id="signup-home-store"
                    class="w-full border rounded px-3 py-2 text-sm" required>
              <option value="">Select one…</option>
              <option value="Stronghold Games (Boundary & Kingsway)">
                Stronghold Games (Boundary & Kingsway)
              </option>
              <option value="The Connection Games (Renfrew)">
                The Connection Games (Renfrew)
              </option>
              <option value="Freelancer">Freelancer</option>
              <option value="Remote Only">Remote Only</option>
            </select>
            <p class="text-[11px] text-slate-500 mt-1">
              Used to help form pods & pairings that make sense geographically.
            </p>
          </div>

          <!-- REMOTE LOCATION -->
          <div id="signup-remote-location-wrapper" class="hidden">
            <label class="block text-sm font-medium mb-1">Your location (optional)</label>
            <input type="text" name="remote_location"
                   class="w-full border rounded px-3 py-2 text-sm"
                   placeholder="City / region / time zone" />
          </div>

          <!-- REMOTE PREFERENCE -->
          <div>
            <label class="block text-sm font-medium mb-1">Remote Play</label>
            <select name="remote_preference" id="signup-remote-pref"
                    class="w-full border rounded px-3 py-2 text-sm" required>
              <option value="">Select one…</option>
              <option value="yes">Yes — I frequently play remote</option>
              <option value="sometimes">Sometimes — I can play remote if needed</option>
              <option value="no">No — Local games only</option>
            </select>
          </div>

          <!-- REMOTE METHODS -->
          <div id="signup-remote-methods-wrapper" class="hidden">
            <label class="block text-sm font-medium mb-1">Remote methods</label>
            <div class="flex flex-col gap-1 text-sm">
              <label class="inline-flex items-center gap-2">
                <input type="checkbox" name="remote_methods" value="MTGO" />
                <span>Remote — MTGO</span>
              </label>
              <label class="inline-flex items-center gap-2">
                <input type="checkbox" name="remote_methods" value="Webcam" />
                <span>Remote — Webcam</span>
              </label>
            </div>
          </div>

          <!-- PASSWORDS -->
          <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" name="password"
                   class="w-full border rounded px-3 py-2 text-sm"
                   placeholder="At least 8 characters"
                   minlength="8" required />
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Confirm Password</label>
            <input type="password" name="password_confirm"
                   class="w-full border rounded px-3 py-2 text-sm"
                   placeholder="Re-enter password"
                   minlength="8" required />
          </div>

          <p id="signup-error" class="text-sm text-red-600 hidden"></p>
          <p id="signup-success" class="text-sm text-emerald-700 hidden"></p>

          <button type="submit"
                  class="w-full bg-sky-600 text-white py-2 rounded text-sm font-semibold">
            Create Account
          </button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-3">
          Already have an account?
          <a href="#top" class="text-sky-600 underline">Log in</a>
        </p>
      </section>

    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
  <script type="module" src="/js/signup.js"></script>

  <!-- Visibility logic for remote fields -->
  <script>
    const homeSelect = document.getElementById("signup-home-store");
    const remotePrefSelect = document.getElementById("signup-remote-pref");
    const remoteLocationWrapper = document.getElementById("signup-remote-location-wrapper");
    const remoteMethodsWrapper = document.getElementById("signup-remote-methods-wrapper");

    function updateRemoteVisibility() {
      const home = homeSelect?.value;
      const pref = remotePrefSelect?.value;

      // Remote-only → show location
      if (home === "Remote Only") {
        remoteLocationWrapper?.classList.remove("hidden");
      } else {
        remoteLocationWrapper?.classList.add("hidden");
      }

      // Show methods if home=Remote Only or pref!=no
      const showMethods =
        home === "Remote Only" ||
        (pref && pref !== "no");

      if (showMethods) {
        remoteMethodsWrapper?.classList.remove("hidden");
      } else {
        remoteMethodsWrapper?.classList.add("hidden");
      }
    }

    homeSelect?.addEventListener("change", updateRemoteVisibility);
    remotePrefSelect?.addEventListener("change", updateRemoteVisibility);

    updateRemoteVisibility();
  </script>

</body>
</html>
