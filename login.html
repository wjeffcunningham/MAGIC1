<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login / Sign Up · magic1.ca</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body {
    margin:0;
    padding:0;
    font-family:-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    background:#f9f0f5;
  }
  .shell {
    max-width:400px;
    margin:80px auto;
    padding:24px 20px 28px;
    background:white;
    border-radius:16px;
    border:2px solid #000;
    box-shadow:0 8px 24px rgba(0,0,0,0.15);
  }
  h1 {
    text-align:center;
    margin:0 0 20px;
    font-size:1.8rem;
  }
  label {
    display:block;
    font-weight:600;
    margin-top:10px;
    margin-bottom:4px;
  }
  input {
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #999;
    font-size:0.95rem;
    box-sizing:border-box;
  }
  .btn-row {
    display:flex;
    gap:8px;
    margin-top:16px;
  }
  button {
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #111;
    background:#eee;
    cursor:pointer;
    font-weight:600;
  }
  .primary {
    background:#000;
    color:#fff;
  }
  .link-row {
    margin-top:10px;
    font-size:0.85rem;
    text-align:right;
  }
  .link-row button {
    flex:none;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    text-decoration:underline;
    color:#444;
  }
  #msg {
    margin-top:12px;
    font-size:0.9rem;
    min-height:1.2em;
  }
  #msg.error { color:#b00020; }
  #msg.ok { color:#006400; }

  /* Welcome modal */
  #welcome-overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:6000;
  }
  #welcome-box {
    background:white;
    border-radius:18px;
    border:2px solid #000;
    max-width:360px;
    padding:18px 18px 16px;
    text-align:center;
    box-shadow:0 10px 28px rgba(0,0,0,0.4);
  }
  #welcome-box h2 {
    margin-top:8px;
    margin-bottom:6px;
  }
  #welcome-box p {
    margin-top:6px;
    margin-bottom:10px;
    font-size:0.95rem;
  }
  #welcome-close {
    margin-top:8px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid #111;
    background:#000;
    color:#fff;
    cursor:pointer;
    font-weight:600;
  }
</style>
</head>
<body>

<div class="shell">
  <h1>Login / Sign-Up</h1>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" placeholder="you@example.com">

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">

  <div class="btn-row">
    <button id="login-btn" class="primary">Log in</button>
    <button id="signup-btn">Sign up</button>
  </div>

  <div class="link-row">
    <button id="forgot-btn">Forgot your password?</button>
  </div>

  <p id="msg"></p>
</div>

<!-- One-time welcome modal -->
<div id="welcome-overlay">
  <div id="welcome-box">
    <div style="font-size:3rem;">🐻</div>
    <h2>Welcome to Magic1.ca!</h2>
    <p>Bear with us as we get started. Create an account once, then you can join the league, update your profile, and more.</p>
    <button id="welcome-close">Let me in</button>
  </div>
</div>

<script type="module">
import { supabase } from "/js/config.js";

const emailInput   = document.getElementById("email");
const pwInput      = document.getElementById("password");
const msg          = document.getElementById("msg");
const loginBtn     = document.getElementById("login-btn");
const signupBtn    = document.getElementById("signup-btn");
const forgotBtn    = document.getElementById("forgot-btn");

// Welcome modal logic
const overlay      = document.getElementById("welcome-overlay");
const closeWelcome = document.getElementById("welcome-close");

if (!localStorage.getItem("magic1_welcome_shown")) {
  overlay.style.display = "flex";
}
closeWelcome.onclick = () => {
  overlay.style.display = "none";
  localStorage.setItem("magic1_welcome_shown", "1");
};

function setMsg(text, ok=false) {
  msg.textContent = text;
  msg.classList.remove("error","ok");
  if (text) msg.classList.add(ok ? "ok" : "error");
}

function normalizeEmail() {
  return emailInput.value.trim().toLowerCase();
}

// LOGIN
loginBtn.onclick = async () => {
  setMsg("Logging in…", true);
  const email = normalizeEmail();
  const password = pwInput.value;
  if (!email || !password) {
    setMsg("Enter both email and password.");
    return;
  }

  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    setMsg(error.message || "Login failed.");
    return;
  }
  setMsg("Logged in!", true);
  location.href = "/user-settings.html";
};

// SIGNUP (immediate login if email-confirmation is disabled in Supabase)
signupBtn.onclick = async () => {
  setMsg("Creating account…", true);
  const email = normalizeEmail();
  const password = pwInput.value;
  if (!email || !password) {
    setMsg("Enter both email and password.");
    return;
  }

  const { data, error } = await supabase.auth.signUp({ email, password });
  if (error) {
    setMsg(error.message || "Sign-up failed.");
    return;
  }

  const user = data.user;
  if (!user) {
    // This usually means email confirmation is still required in Supabase
    setMsg("Account created. Check your email to confirm, then log in.", true);
    return;
  }

  // create profile row if it doesn't exist
  await supabase.from("users").upsert({
    id: user.id,
    email,
    name: email
  }, { onConflict: "id" });

  setMsg("Account created!", true);
  location.href = "/user-settings.html";
};

// FORGOT PASSWORD
forgotBtn.onclick = async () => {
  const email = normalizeEmail();
  if (!email) {
    setMsg("Enter your email first, then click ‘Forgot your password?’."); 
    return;
  }
  setMsg("Sending reset link…", true);
  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: "https://magic1.ca/login.html"
  });
  if (error) {
    setMsg(error.message || "Could not send reset email.");
    return;
  }
  setMsg("If that email exists, a reset link has been sent.", true);
};
</script>

</body>
</html>
