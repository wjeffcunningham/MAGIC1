<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin Dashboard · magic1.ca</title>

<style>
  body {
    margin:0;
    background:#f4f6ff;
    font-family:-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  .shell {
    max-width:800px;
    margin:80px auto;
    padding:20px;
    background:#fff;
    border-radius:12px;
    border:2px solid #000;
  }
  h1 { text-align:center; margin-bottom:8px; }
  h2 { font-size:1.1rem; margin-top:20px; }
  .muted { opacity:0.7; font-size:0.85rem; }
  .hidden { display:none; }
  .list {
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ddd;
    background:#fafafa;
    padding:10px;
  }
  .row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 0;
    border-bottom:1px solid #eee;
  }
  .row:last-child { border-bottom:none; }
  .row-main {
    font-size:0.9rem;
  }
  .row-main div:first-child { font-weight:600; }
  .tag {
    font-size:0.75rem;
    padding:1px 6px;
    border-radius:999px;
    border:1px solid #999;
    margin-left:6px;
  }
  .btn {
    padding:5px 9px;
    border-radius:8px;
    border:1px solid #111;
    background:#fff;
    cursor:pointer;
    font-size:0.8rem;
  }
  .btn.primary {
    background:#000;
    color:#fff;
  }
</style>
</head>
<body>

<div class="shell">
  <h1>Admin Dashboard</h1>
  <p class="muted">Mods can approve new site users here.</p>

  <div id="not-logged">
    <p>You need to be logged in to view this page.</p>
  </div>

  <div id="not-admin" class="hidden">
    <p>You must be a moderator to view this page.</p>
  </div>

  <div id="admin-panel" class="hidden">
    <h2>Pending Users</h2>
    <p class="muted" id="pending-count"></p>
    <div id="pending-list" class="list"></div>
  </div>
</div>

<script type="module" src="/js/db.js"></script>
<script type="module" src="/js/global-menu-loader.js"></script>
<script type="module" src="/js/admin-dashboard.js"></script>

</body>
</html>
