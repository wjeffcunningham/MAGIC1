<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Player · magic1.ca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900">

  <!-- MENU -->
  <script type="module" src="/js/global-menu-loader.js"></script>

  <div class="max-w-3xl mx-auto px-4 py-10">
    <h1 id="player-name" class="text-2xl font-bold mb-1">Player</h1>
    <p id="player-rating" class="text-sm text-slate-700 mb-4"></p>

    <h2 class="text-xl font-semibold mb-3">Match History</h2>
    <div id="player-matches" class="space-y-3">
      <!-- JS fills -->
    </div>

    <p id="player-error" class="hidden text-sm text-red-600 mt-4"></p>
  </div>

  <script type="module" src="/js/player.js"></script>
</body>
</html>
