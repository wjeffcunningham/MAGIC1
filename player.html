<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Player Profile · magic1.ca</title>

<style>
  body {
    margin:0;
    padding:0;
    font-family:-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    background:#fafafa;
  }
  .shell {
    max-width:800px;
    margin:80px auto;
    padding:24px;
    background:white;
    border:2px solid black;
    border-radius:12px;
  }
  h1 {
    text-align:center;
    margin:10px 0 6px;
  }
  .muted {
    opacity:0.7;
    font-size:0.9rem;
    text-align:center;
  }
  .section {
    margin-top:28px;
  }
  table {
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    font-size:0.9rem;
  }
  th, td {
    padding:8px;
    border-bottom:1px solid #ddd;
    text-align:left;
  }
  th {
    background:#f4f4f4;
  }
  .center {
    text-align:center;
  }
</style>
</head>

<body>

<div class="shell">

  <h1 id="player-name">Player</h1>
  <div class="muted" id="player-rating"></div>

  <img
  id="player-avatar"
  style="
    display:block;
    margin:12px auto;
    width:96px;
    height:96px;
    border-radius:12px;
    border:2px solid #000;
    object-fit:cover;
    background:#eee;
  "
  alt=""
/>

  <div class="section">
    <h2>League Standings</h2>
    <div id="standings-empty" class="muted">No league standings available.</div>
    <table id="standings-table" style="display:none;">
      <thead>
        <tr>
          <th>Month</th>
          <th class="center">Points</th>
          <th class="center">OW%</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Match History</h2>
    <div id="matches-empty" class="muted">No matches recorded.</div>
    <table id="matches-table" style="display:none;">
      <thead>
        <tr>
          <th>Date</th>
          <th>Event</th>
          <th>Opponent</th>
          <th>Result</th>
          <th class="center">Δ Elo</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script type="module" src="/js/db.js"></script>
<script type="module" src="/js/global-menu-loader.js"></script>
<script type="module" src="/js/player.js"></script>

<script type="module">
  import { renderAccountStateBanner } from "/js/account-state.js";
  renderAccountStateBanner({ page: "hub" });
</script>

</body>
</html>
