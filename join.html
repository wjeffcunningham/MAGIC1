<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Join · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="/css/bcpmm-shell.css" />

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Helvetica, Arial, sans-serif;
  padding: 2rem;
  max-width: 680px;
  margin: 0 auto;
}

.logo {
  width: 80px;
  margin-bottom: 1.5rem;
}

h1 {
  margin-bottom: 0.25rem;
}

button {
  font-size: 0.95rem;
  padding: 0.7rem 1rem;
  margin-bottom: 0.75rem;
  width: 100%;
  cursor: pointer;
  border: 1px solid #000;
  background: #fff;
  font-weight: 600;
}

button:hover {
  background: #f5f5f5;
}

.status {
  margin-top: 1rem;
  font-size: 0.9rem;
  opacity: 0.8;
}

.loading {
  opacity: 0.6;
}
</style>
</head>

<body>

<div id="global-menu-root"></div>

<img src="/assets/BCPMMsvg.png" class="logo">

<h1>Join Magic1.ca</h1>
<p>Create an account or sign in.</p>

<div id="auth-section"></div>
<div id="status" class="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>
<script src="/js/bcpmm-shell.js"></script>

<script>

const statusBox = document.getElementById("status");
const authSection = document.getElementById("auth-section");

async function render() {

  if (!window.auth) return;

  statusBox.textContent = "Checking session…";

  const user = await auth.getUser();

  if (!user) {

    statusBox.textContent = "";

    authSection.innerHTML = `
      <button onclick="login('google')">Continue with Google</button>
      <button onclick="login('discord')">Continue with Discord</button>
      <button onclick="login('facebook')">Continue with Facebook</button>
    `;
    return;
  }

  statusBox.textContent = "Signed in. Redirecting…";
  window.location.href = "/profile-edit.html";
}

async function login(provider) {

  statusBox.textContent = "Redirecting to " + provider + "…";
  authSection.classList.add("loading");

  const options = {
    redirectTo: window.location.origin + "/profile-edit.html"
  };

  if (provider === "google") {
    options.queryParams = { prompt: "select_account" };
  }

  await auth._client.auth.signInWithOAuth({
    provider,
    options
  });
}

window.addEventListener("load", render);

</script>

</body>
</html>
