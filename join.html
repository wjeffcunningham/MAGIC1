<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Join · Magic1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem;
      max-width: 640px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    button {
      font-size: 1rem;
      padding: 0.6rem 1rem;
      cursor: pointer;
    }

    #user {
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

<h1>Join Magic1.ca</h1>
<p>Create an account or sign in to claim your player profile.</p>

<div id="auth"></div>
<div id="user"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  // -----------------------------------------------------
  // Supabase client
  // -----------------------------------------------------
  const supabase = window.supabase.createClient(
    "https://dkzdfhzlewlvfmunywal.supabase.co",
    "sb_publishable_B1r1cUzqYm-aMel-yW-4TA_-s3kdZ7N"
  );

  // -----------------------------------------------------
  // Render auth state
  // -----------------------------------------------------
  async function render() {
    const { data: { user } } = await supabase.auth.getUser();

    const authDiv = document.getElementById("auth");
    const userDiv = document.getElementById("user");

    authDiv.innerHTML = "";
    userDiv.innerHTML = "";

    if (!user) {
      authDiv.innerHTML = `
        <button id="google">Sign in with Google</button>
      `;

      document.getElementById("google").onclick = () => {
        supabase.auth.signInWithOAuth({
          provider: "google",
          options: {
            // IMPORTANT: stay on this page
            redirectTo: window.location.href
          }
        });
      };
    } else {
      userDiv.innerHTML = `
        <p>Signed in as <strong>${user.email}</strong></p>
        <button id="logout">Sign out</button>
      `;

      document.getElementById("logout").onclick = async () => {
        await supabase.auth.signOut();
        render();
      };
    }
  }

  // Initial render + post-OAuth return
  render();
</script>

</body>
</html>
