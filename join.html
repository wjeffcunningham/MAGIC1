<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Join · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Helvetica, Arial, sans-serif;
  padding: 2rem;
  max-width: 700px;
  margin: 0 auto;
}

h1 { margin-bottom: 0.25rem; }

button {
  font-size: 0.95rem;
  padding: 0.6rem 1rem;
  margin-right: 0.5rem;
  margin-bottom: 0.5rem;
  cursor: pointer;
}

.notice {
  background: #f2f2f2;
  padding: 0.75rem;
  margin-top: 1rem;
  font-size: 0.9rem;
}
</style>
</head>

<body>

<h1>Join Magic1.ca</h1>
<p>Create an account or sign in.</p>

<div id="auth-section"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<script>

async function render() {

  if (!window.auth) return;

  const user = await auth.getUser();
  const authSection = document.getElementById("auth-section");

  authSection.innerHTML = "";

  if (!user) {
    authSection.innerHTML = `
      <button onclick="login('google')">Continue with Google</button><br>
      <button onclick="login('discord')">Continue with Discord</button><br>
      <button onclick="login('facebook')">Continue with Facebook</button>
    `;
    return;
  }

  // If already signed in, immediately send to profile-edit
  window.location.href = "/profile-edit.html";
}

async function login(provider) {
  await auth._client.auth.signInWithOAuth({
    provider,
    options: { redirectTo: window.location.origin + "/profile-edit.html" }
  });
}

window.addEventListener("load", render);

</script>
</body>
</html>
