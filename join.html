<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Join · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="/css/bcpmm-shell.css" />

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
  Roboto, Helvetica, Arial, sans-serif;
  padding: 2rem;
  max-width: 680px;
  margin: 0 auto;
}

.logo {
  width: 80px;
  margin-bottom: 1.5rem;
}

h1 { margin-bottom: 0.25rem; }

.section {
  margin-top: 2rem;
}

input {
  width: 100%;
  padding: 0.6rem;
  margin-bottom: 0.75rem;
  border: 1px solid #ccc;
}

button {
  font-size: 0.95rem;
  padding: 0.7rem 1rem;
  margin-bottom: 0.75rem;
  width: 100%;
  cursor: pointer;
  border: 1px solid #000;
  background: #fff;
  font-weight: 600;
}

button:hover {
  background: #f5f5f5;
}

.oauth button {
  margin-bottom: 0.5rem;
}

.status {
  margin-top: 1rem;
  font-size: 0.9rem;
  min-height: 1.2rem;
}

.error { color: #c0392b; font-weight: 600; }
.success { color: #2e7d32; font-weight: 600; }

.divider {
  margin: 2rem 0;
  text-align: center;
  opacity: 0.6;
}
</style>
</head>

<body>

<div id="global-menu-root"></div>

<img src="/assets/BCPMMsvg.png" class="logo">

<h1>Join Magic1.ca</h1>
<p>Create an account or sign in.</p>

<div id="status" class="status"></div>

<!-- EMAIL AUTH -->
<div class="section">
  <h3>Email</h3>

  <input type="email" id="email" placeholder="Email address">
  <input type="password" id="password" placeholder="Password">

  <button onclick="emailSignUp()">Sign Up</button>
  <button onclick="emailSignIn()">Sign In</button>
</div>

<div class="divider">— or —</div>

<!-- OAUTH -->
<div class="section oauth">
  <h3>Continue with</h3>

  <button onclick="oauthLogin('google')">Google</button>
  <button onclick="oauthLogin('discord')">Discord</button>
  <button onclick="oauthLogin('facebook')">Facebook</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>
<script src="/js/bcpmm-shell.js"></script>

<script>

const statusBox = document.getElementById("status");

function setStatus(msg, type="") {
  statusBox.className = "status " + type;
  statusBox.textContent = msg;
}

/* =========================
   SESSION CHECK
========================= */

async function checkSession() {

  if (!window.auth) return;

  const user = await auth.getUser();

  if (user) {
    setStatus("Signed in. Redirecting…", "success");
    window.location.href = "/profile-edit.html";
  }
}

window.addEventListener("load", checkSession);

/* =========================
   EMAIL SIGN UP
========================= */

async function emailSignUp() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    setStatus("Enter email and password.", "error");
    return;
  }

  setStatus("Creating account…");

  const { error } = await auth._client.auth.signUp({
    email,
    password,
    options: {
      emailRedirectTo: window.location.origin + "/profile-edit.html"
    }
  });

  if (error) {
    setStatus(error.message, "error");
    return;
  }

  setStatus("Check your email to confirm your account.", "success");
}

/* =========================
   EMAIL SIGN IN
========================= */

async function emailSignIn() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    setStatus("Enter email and password.", "error");
    return;
  }

  setStatus("Signing in…");

  const { error } = await auth._client.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    setStatus(error.message, "error");
    return;
  }

  setStatus("Success. Redirecting…", "success");
  window.location.href = "/profile-edit.html";
}

/* =========================
   OAUTH
========================= */

async function oauthLogin(provider) {

  setStatus("Redirecting to " + provider + "…");

  const options = {
    redirectTo: window.location.origin + "/profile-edit.html"
  };

  if (provider === "google") {
    options.queryParams = { prompt: "select_account" };
  }

  await auth._client.auth.signInWithOAuth({
    provider,
    options
  });
}

</script>

</body>
</html>
