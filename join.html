<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Join · Magic1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/bcpmm-shell.css" />

<style>
* { box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
  Roboto, Helvetica, Arial, sans-serif;
  padding: 3rem 2rem;
  max-width: 720px;
  margin: 0 auto;
  background: var(--bg);
  color: var(--fg);
}

.content {
  max-width: 520px;
  margin: 0 auto;
  text-align: center;
}

.logo {
  width: 170px;
  margin-bottom: 2.2rem;
}

/* =====================================================
   ORIGINAL METAL GLINT SWEEP (RECOVERED)
===================================================== */

.slogan {
  font-size: 2rem;
  font-weight: 900;
  font-style: italic;
  letter-spacing: 0.06em;
  position: relative;
  display: inline-block;
  margin-bottom: 1.6rem;
  overflow: hidden;
}

.slogan::after {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 60%;
  height: 100%;

  background: linear-gradient(
    120deg,
    transparent 0%,
    rgba(255,255,255,0.6) 30%,
    rgba(255,255,255,0.95) 45%,
    rgba(255,255,255,1) 50%,
    rgba(255,255,255,0.95) 55%,
    rgba(255,255,255,0.6) 70%,
    rgba(120,180,255,0.4) 90%,
    transparent 100%
  );

  transform: skewX(-18deg);
  animation: sunGlint 4.5s cubic-bezier(.55,0,.15,1) infinite;
  opacity: 0;
}

@keyframes sunGlint {
  0%   { left: -120%; opacity: 0; }
  10%  { opacity: 0; }
  20%  { left: -100%; opacity: 0.85; }
  40%  { left: -20%; opacity: 1; }
  55%  { left: 120%; opacity: 1; }
  70%  { opacity: 0.6; }
  85%  { opacity: 0; }
  100% { left: 120%; opacity: 0; }
}

/* =====================================================
   Form
===================================================== */

.section { margin-top: 2rem; }

input {
  width: 100%;
  padding: 0.75rem 1rem;
  margin-bottom: 0.7rem;
  border: 1px solid var(--border);
  font-size: 0.95rem;
  background: var(--surface);
  color: var(--fg);
}

input:focus {
  outline: none;
  border-color: #1f6feb;
}

button {
  font-size: 0.95rem;
  padding: 0.8rem 1rem;
  margin-bottom: 0.8rem;
  width: 100%;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  font-weight: 600;
  color: var(--fg);
}

button:hover { background: var(--border); }

.status {
  margin-top: 1rem;
  font-size: 0.9rem;
  min-height: 1.2rem;
}

.error { color: #c0392b; font-weight: 600; }
.success { color: #2e7d32; font-weight: 600; }

.divider {
  margin: 2rem 0;
  text-align: center;
  opacity: 0.6;
}
</style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="content">

<img src="/assets/BCPMMsvg.png" class="logo">

<h1>Join Magic1.ca</h1>
<div class="slogan">“Play Like a Legend”</div>
<p>Create an account or sign in.</p>

<div id="status" class="status"></div>

<div class="section">
  <h3>Email</h3>

  <input type="email" id="email" placeholder="Email address" autocomplete="email">
  <input type="password" id="password" placeholder="Password" minlength="8" autocomplete="current-password">

  <button id="signup-btn">Sign Up</button>
  <button id="signin-btn">Sign In</button>
</div>

<div class="divider">— or —</div>

<div class="section oauth">
  <h3>Continue with</h3>
  <button data-provider="google">Google</button>
  <button data-provider="discord">Discord</button>
  <button data-provider="facebook">Facebook</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>
<script src="/js/bcpmm-shell.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  if (!window.auth || !window.auth._client) {
    console.error("Auth client not ready.");
    return;
  }

  const supabase = window.auth._client;
  const statusBox = document.getElementById("status");

  function setStatus(msg, type="") {
    statusBox.className = "status " + type;
    statusBox.textContent = msg;
  }

  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    window.location.href = "/profile-edit.html";
    return;
  }

  document.getElementById("signup-btn").addEventListener("click", async () => {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
      setStatus("Enter email and password.", "error");
      return;
    }

    if (password.length < 8) {
      setStatus("Password must be at least 8 characters.", "error");
      return;
    }

    setStatus("Creating account…");

    const { error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: window.location.origin + "/profile-edit.html"
      }
    });

    if (error) {
      setStatus(error.message, "error");
      return;
    }

    setStatus("Check your email to confirm your account.", "success");
  });

  document.getElementById("signin-btn").addEventListener("click", async () => {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
      setStatus("Enter email and password.", "error");
      return;
    }

    setStatus("Signing in…");

    const { error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      setStatus(error.message, "error");
      return;
    }

    window.location.href = "/profile-edit.html";
  });

  document.querySelectorAll("[data-provider]").forEach(btn => {
    btn.addEventListener("click", async () => {

      const provider = btn.dataset.provider;

      await supabase.auth.signInWithOAuth({
        provider,
        options: {
          redirectTo: window.location.origin + "/profile-edit.html"
        }
      });
    });
  });

});
</script>

</body>
</html>
