<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B.C. Premodern Masters · magic1.ca</title>

<link rel="icon" type="image/svg+xml" href="./assets/BCPMM.svg" />

<!-- KEFA fallback via Alegreya -->
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700;800&display=swap" rel="stylesheet">

<!-- Main site CSS -->
<link rel="stylesheet" href="/css/style.css" />

<style>
  body {
    margin: 0;
    padding: 0;
    color: #000;
    font-family: "Kefa", "Alegreya", serif;
    text-align: center;
    transition: background 0.3s ease;
  }

  /* ================================
           POSTER
     ================================ */
  .poster-slider {
    max-width: 800px;
    margin: 100px auto 50px auto;
  }

  .poster {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    padding: 40px 30px;
    border-radius: 8px;
  }

  .logo-large {
    max-width: 280px;
    margin: 20px auto;
    display: block;
  }

  h1 {
    font-size: 2.6em;
    letter-spacing: 1.5px;
    font-weight: 800;
    text-transform: uppercase;
    margin: 0 0 0.3em;
    border-bottom: 4px double #000;
    display: inline-block;
    padding-bottom: 0.15em;
  }

  h3 {
    font-size: 1.3em;
    margin-top: 0;
    font-weight: 700;
    text-transform: uppercase;
    border-bottom: 2px solid #000;
    display: inline-block;
    padding-bottom: 0.1em;
  }

  /* ================================
           PAST EVENTS BOX
     ================================ */
  .past-events {
    margin: 28px auto 18px;
    padding: 18px 16px 20px;
    border: 3px double #000;
    max-width: 520px;
  }

  .past-events .event-title {
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .past-events ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .past-events li {
    margin: 0.5em 0;
  }

  .past-events a {
    font-weight: 700;
    text-transform: uppercase;
    text-decoration: none;
  }

  .past-events a:hover {
    text-decoration: underline;
  }

  /* ================================
           SPONSOR ICONS
     ================================ */
  .logos {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 22px;
  }

  .logos img {
    height: 60px;
    filter: grayscale(100%) contrast(130%);
    cursor: pointer;
  }

  .shg-logo { filter: none !important; }

  /* ================================
           LIGHTBOX
     ================================ */
  #card-lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  #card-lightbox img {
    max-width: 90vw;
    max-height: 90vh;
  }
</style>
</head>

<body>

<!-- POSTER -->
<div class="poster-slider">
  <div class="poster">

    <img src="./assets/BCPMM.svg" class="logo-large" />

    <h1>B.C. Premodern Masters</h1>

    <!-- PAST EVENTS -->
    <div class="past-events">
      <h3>Past Events</h3>

      <div class="event-title">
        BCPMM I · Saturday, January 10th, 2026
      </div>

      <ul>
        <li>
          <a href="bcpmm/flyers/">Flyers &amp; Posters</a>
        </li>
        <li>
          <a href="bcpmm/BCPMM_coverage.html">Tournament Coverage</a>
        </li>
      </ul>
    </div>

    <p>Watch this space! More to come.</p>

    <!-- <div class="logos">
      <a href="https://vvipmedia.net" target="_blank" rel="noopener">
        <img src="./assets/vvip.png" class="shg-logo" /> 
      </a>
    </div>-->

  </div>
</div>

<!-- LIGHTBOX -->
<div id="card-lightbox">
  <img src="" />
</div>

<script>
/* ---------------------------------
   RANDOM PRINT-SHOP BACKGROUND
-----------------------------------*/
(() => {
  const colors = ["#FFF9D6", "#FFE8EF", "#E8F4FF", "#EBFFE8"];
  document.body.style.background =
    colors[Math.floor(Math.random() * colors.length)];
})();

/* ---------------------------------
   LIGHTBOX FOR SPONSOR ICONS
-----------------------------------*/
const lightbox = document.getElementById("card-lightbox");
const lbImg = lightbox.querySelector("img");

document.querySelectorAll(".logos img").forEach(img => {
  img.addEventListener("click", () => {
    lbImg.src = img.src;
    lightbox.style.display = "flex";
  });
});

lightbox.addEventListener("click", () => {
  lightbox.style.display = "none";
  lbImg.src = "";
});
</script>

<!-- Global menu loader (safe to leave; no icon injected here) -->
<script type="module" src="/js/db.js"></script>
<script type="module" src="/js/global-menu-loader.js"></script>

</body>
</html>
