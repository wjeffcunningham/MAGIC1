<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B.C. Premodern Masters · magic1.ca</title>

<link rel="icon" type="image/svg+xml" href="./assets/BCPMM.svg" />
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700;800&display=swap" rel="stylesheet">

<style>
/* =====================================================
   BASE THEME
===================================================== */
:root {
  --bg: #ffffff;
  --fg: #000000;
  --muted: #666;
  --logo-width: 320px;
}

body.dark {
  --bg: #111111;
  --fg: #f4f4f4;
  --muted: #aaa;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Kefa", "Alegreya", serif;
  text-align: center;
  transition: background 0.25s ease, color 0.25s ease;
}

/* =====================================================
   MENU
===================================================== */
.menu-button {
  position: fixed;
  top: 22px;
  right: 24px;
  font-size: 40px;
  line-height: 1;
  cursor: pointer;
  user-select: none;
  z-index: 1001;
}

.menu-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 320px;
  height: 100vh;
  background: var(--bg);
  padding: 28px 24px;
  box-sizing: border-box;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  z-index: 1002;
}

.menu-panel.open {
  transform: translateX(0);
}

.menu-overlay {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 1000;
}

.menu-overlay.active {
  display: block;
}

.menu-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.menu-header strong {
  font-size: 1.3em;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.2px;
}

.menu-close {
  font-size: 26px;
  cursor: pointer;
}

.menu-item {
  margin-top: 36px;
  font-size: 28px;
  font-weight: 700;
  cursor: pointer;
}

/* =====================================================
   MAIN CONTENT
===================================================== */
.poster {
  max-width: 720px;
  margin: 140px auto 80px;
  padding: 0 28px;
}

.logo-large {
  width: 100%;
  max-width: var(--logo-width);
  height: auto;
  margin: 0 auto 24px;
  display: block;
}

h1 {
  font-size: 2.6em;
  font-weight: 800;
  letter-spacing: 1.5px;
  margin: 0 0 10px;
  text-transform: uppercase;
}

h2 {
  margin: 0 0 28px;
  font-weight: 400;
}

.main-links a {
  display: block;
  margin: 16px 0;
  font-size: 1.25em;
  font-weight: 800;
  text-transform: uppercase;
  text-decoration: none;
  color: inherit;
}

.main-links a:hover {
  text-decoration: underline;
}

.footer-note {
  margin-top: 40px;
  opacity: 0.7;
  color: var(--muted);
}

/* ================================
   SOCIAL BUTTONS
================================ */
.social-buttons {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin: 36px 0 10px;
}

.social-buttons a {
  display: inline-block;
}

.social-buttons img {
  height: 80px;
  width: auto;
  opacity: 0.85;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.social-buttons img:hover {
  opacity: 1;
  transform: translateY(-1px);
}

body.dark .social-buttons img {
  filter: brightness(0.9);
}
</style>
</head>

<body>

<div class="menu-button" id="menu-btn">☰</div>
<div class="menu-overlay" id="menu-overlay"></div>

<div class="menu-panel" id="menu-panel">
  <div class="menu-header">
    <strong>Menu</strong>
    <span class="menu-close" id="menu-close">✕</span>
  </div>

  <div class="menu-item" id="toggle-theme" title="Toggle light/dark">
    🌙
  </div>
</div>

<div class="poster">
  <img src="./assets/BCPMM.svg" class="logo-large" alt="BC Premodern Masters logo" />

  <h1>B.C. Premodern Masters</h1>
  <h2><i>"Magic Lives in B.C."</i></h2>

  <div class="main-links">
    <a href="/leaguetracker/">League Tracker</a>
    <a href="/leaguejoin/">Join Page</a>
    <a href="/buylist/">Buylist</a>
    <a href="/archive/">Archive</a>
  </div>

  <div class="social-buttons">
    <a href="https://vvipmedia.net" target="_blank" rel="noopener">
      <img src="./assets/vvip.png" alt="VVIP Media" />
    </a>

    <a href="https://discord.gg/zm6r4pVjNr" target="_blank" rel="noopener">
      <img src="./assets/discord.png" alt="Discord" />
    </a>

    <a href="https://www.instagram.com/bcpremodernmasters/" target="_blank" rel="noopener">
      <img src="./assets/instagram.png" alt="Instagram" />
    </a>
  </div>

  <div class="footer-note">
    Watch this space. More to come.
  </div>
</div>

<script>
const btn = document.getElementById("menu-btn");
const panel = document.getElementById("menu-panel");
const closeBtn = document.getElementById("menu-close");
const overlay = document.getElementById("menu-overlay");
const toggle = document.getElementById("toggle-theme");

btn.onclick = () => {
  panel.classList.add("open");
  overlay.classList.add("active");
};

closeBtn.onclick = overlay.onclick = () => {
  panel.classList.remove("open");
  overlay.classList.remove("active");
};

function syncIcon() {
  toggle.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
}

toggle.onclick = () => {
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "bcpmm-theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
  syncIcon();
};

(() => {
  if (localStorage.getItem("bcpmm-theme") === "dark") {
    document.body.classList.add("dark");
  }
  syncIcon();
})();
</script>

</body>
</html>
