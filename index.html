<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B.C. Premodern Masters · magic1.ca</title>

<link rel="icon" type="image/svg+xml" href="/assets/BCPMM.svg" />
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700;800&display=swap" rel="stylesheet">

<!-- GLOBAL SHELL (theme + menu) -->
<link rel="stylesheet" href="/css/bcpmm-shell.css" />

<style>
/* =====================================================
   MAIN INDEX CONTENT (THEME-AWARE)
===================================================== */
body {
  background: var(--bg);
  color: var(--fg);
  text-align: center;
}

.poster {
  max-width: 720px;
  margin: 6rem auto 5rem;
  padding: 0 1.75rem;
}

.logo-large {
  width: 100%;
  max-width: var(--logo-width);
  height: auto;
  margin: 0 auto 24px;
  display: block;
}

h1 {
  font-size: 2.6em;
  font-weight: 800;
  letter-spacing: 1.5px;
  margin: 0 0 10px;
  text-transform: uppercase;
}

h2 {
  margin: 0 0 28px;
  font-weight: 400;
}

.main-links a {
  display: block;
  margin: 16px 0;
  font-size: 1.25em;
  font-weight: 800;
  text-transform: uppercase;
  text-decoration: none;
  color: inherit;
}

.main-links a:hover {
  text-decoration: underline;
}

.footer-note {
  margin-top: 40px;
  opacity: 0.7;
  color: var(--muted);
}

/* ================================
   SOCIAL BUTTONS
================================ */
.social-buttons {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin: 36px 0 10px;
}

.social-buttons a {
  display: inline-block;
}

.social-buttons img {
  height: 80px;
  width: auto;
  opacity: 0.85;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.social-buttons img:hover {
  opacity: 1;
  transform: translateY(-1px);
}

body.dark .social-buttons img {
  filter: brightness(0.9);
}
</style>
</head>

<body>

<!-- GLOBAL MENU ROOT -->
<div id="global-menu-root"></div>

<!-- MAIN CONTENT -->
<div class="poster">
  <img src="/assets/BCPMM.svg" class="logo-large" alt="BC Premodern Masters logo" />

  <h1>B.C. Premodern Masters</h1>
  <h2><i>"Magic Lives in B.C."</i></h2>

  <div class="main-links">
    <a href="/leaguetracker/">League Tracker</a>
    <a href="/leaguejoin/">Join Page</a>
    <a href="/buylist/">Buylist</a>
    <a href="/archive/">Archive</a>
  </div>

<div class="social-icons">

  <a href="https://discord.gg/zm6r4pVjNr" target="_blank" rel="noopener" class="social">
    <img src="./assets/discord.png?v=20260208" alt="Discord" />
  </a>
  
  <a href="https://vvipmedia.net" target="_blank" rel="noopener" class="social">
    <img src="./assets/vvip.png?v=20260208" alt="VVIP Media" />
  </a>

  <a href="https://www.instagram.com/bcpremodernmasters/" target="_blank" rel="noopener" class="social">
    <img src="./assets/instagram.svg?v=20260208" alt="Instagram" />
  </a>

  </a>
</div>

  <div class="footer-note">
    Watch this space. More to come.
  </div>
</div>

<!-- GLOBAL SHELL LOGIC -->
<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
