<!DOCTYPE html>
<html>
<head>
<title>My Matches · BCWL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="poster">
  <h1>My Matches</h1>
  <div id="out">Loading…</div>
</div>

<script type="module">
import { supabase } from "./js/supabase.js";
import { getLocalSession } from "./js/session.js";

const out = document.getElementById("out");
const session = getLocalSession();

if (!session) {
  out.textContent = "Please log in.";
  throw "";
}

const { data } = await supabase
  .from("league_matches")
  .select("*, A:player_a(full_name), B:player_b(full_name)")
  .or(`player_a.eq.${session.playerId},player_b.eq.${session.playerId}`)
  .order("id", { ascending: true });

out.innerHTML = data.map(m => `
  <div style="margin:10px 0; padding:8px; border:1px solid #000;">
    <strong>${m.A.full_name}</strong> vs <strong>${m.B.full_name}</strong><br>
    Status: ${m.approved ? "✔ Approved" : "Pending"}<br>
    Result: ${m.winner ? (m.winner === session.playerId ? "You won" : "You lost") : "—"}<br>
  </div>
`).join("");
</script>

</body>
</html>
