<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BCPMM Buylist</title>

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
*{box-sizing:border-box}

/* ================= LAYOUT ================= */

.buylist-wrap{
  max-width:1500px;
  margin:6rem auto 4rem;
  padding:0 2rem;
}

header{
  display:flex;
  align-items:center;
  gap:1.25rem;
  margin-bottom:3rem;
}

.logo{ width:64px; }

header h1{
  margin:0;
  font-size:2rem;
}

header p{
  margin:.25rem 0 0;
  opacity:.7;
  font-size:.9rem;
}

.controls{
  margin:2rem 0 3rem;
  display:flex;
  gap:2rem;
  flex-wrap:wrap;
  align-items:center;
}

/* ================= ADMIN ================= */

.admin-upload{
  margin-bottom:1.25rem;
  padding:1.25rem;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,255,255,0.04);
  display:none;
}

.admin-upload button{
  margin-top:.5rem;
}

.admin-tools{
  margin-bottom:3rem;
  padding:1.25rem;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,255,255,0.04);
  display:none;
}

.admin-tools .row{
  display:flex;
  gap:.75rem;
  flex-wrap:wrap;
  align-items:center;
  margin-top:.75rem;
}

.admin-tools button{
  padding:.55rem .9rem;
}

.small-note{
  font-size:.85rem;
  opacity:.75;
  margin-top:.5rem;
  line-height:1.3;
}

.kpi{
  display:flex;
  gap:1rem;
  flex-wrap:wrap;
  margin-top:.75rem;
  font-size:.85rem;
  opacity:.85;
}

.progress{
  margin-top:.75rem;
  font-size:.85rem;
  opacity:.9;
}

/* ================= CATEGORY ================= */

.section{
  margin-bottom:4.5rem;
}

.category-pill{
  display:inline-block;
  padding:.55rem 1.25rem;
  border-radius:999px;
  border:1px solid var(--border);
  font-weight:800;
  letter-spacing:.4px;
  font-size:.95rem;
  margin-bottom:1.75rem;
}

/* ================= GRID ================= */

.grid{
  display:grid;
  grid-template-columns:repeat(8, 1fr);
  gap:0.9rem 0.7rem;
}

@media (max-width: 1400px){
  .grid{ grid-template-columns:repeat(6, 1fr); }
}

@media (max-width: 1000px){
  .grid{ grid-template-columns:repeat(4, 1fr); }
}

@media (max-width: 650px){
  .grid{ grid-template-columns:repeat(2, 1fr); }
}

/* ================= CARD ================= */

.card{
  text-align:center;
}

.card img{
  width:100%;
  border-radius:8px;
  box-shadow:0 6px 14px rgba(0,0,0,.45);
  transition:transform .15s ease;
}

.card img:hover{
  transform:translateY(-4px);
}

.price{
  margin-top:.35rem;
  font-weight:600;
  font-size:.8rem;
  display:flex;
  flex-direction:column;
  gap:.2rem;
}

.meta{
  opacity:.72;
  font-size:.78rem;
  line-height:1.2;
}

.admin-edit{
  margin-top:.45rem;
  display:none;
  gap:.35rem;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
}

.admin-edit input{
  width:110px;
  padding:.35rem .5rem;
  border-radius:8px;
  border:1px solid var(--border);
  background:rgba(0,0,0,.25);
  color:var(--fg);
}

.admin-edit button{
  padding:.35rem .6rem;
}
</style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="buylist-wrap">

<header>
<img src="/assets/BCPMM.svg" class="logo" />
<div>
<h1>BCPMM Buylist</h1>
<p>Near Mint prices via Scryfall → TCGplayer Market (USD). Converted live to CAD.</p>
</div>
</header>

<div class="controls">
<label>
Currency:
<select id="currencySelect">
<option value="USD">USD</option>
<option value="CAD">CAD</option>
</select>
</label>

<label id="adminToggleWrap" style="display:none">
<input type="checkbox" id="adminToggle">
Admin Mode
</label>

<span id="fxLabel"></span>
</div>

<!-- ================= ADMIN TOOLS ================= -->

<div class="admin-tools" id="adminTools">
<strong>Admin Tools</strong>
<div class="row">
  <button id="refreshF2FBtn">Refresh F2F Prices (All)</button>
  <button id="refreshF2FBlankBtn">Refresh F2F Prices (Only Blanks)</button>
</div>
<div class="small-note">
Runs in batches and may take several minutes. You can leave this tab open while it works. Cards that can’t be matched will be left blank.
</div>
<div class="kpi" id="f2fKpis"></div>
<div class="progress" id="f2fProgress"></div>
</div>

<!-- ================= ADMIN UPLOAD ================= -->

<div class="admin-upload" id="adminUpload">
<strong>Upload New Buylist CSV</strong><br>
<input type="file" id="csvFile" accept=".csv">
<br>
<button id="uploadCsvBtn">Upload & Replace Buylist</button>
<div id="uploadStatus" style="margin-top:.5rem;font-size:.85rem;"></div>
</div>

<div id="content">Loading…</div>

</div>

<script>
/* ================= STATE ================= */

let CARDS = [];
let CATEGORIES = [];
let FX = 1.35;
let IS_ADMIN = false;
let ADMIN_MODE = false;

/* ================= HELPERS ================= */

function currency(){ return document.getElementById("currencySelect").value; }
function convert(n){ return currency()==="CAD" ? n*FX : n; }
function money(n){
  if(!Number.isFinite(n) || n<=0) return "—";
  return (currency()==="CAD" ? "CA$" : "US$") + convert(n).toFixed(2);
}
function moneyRawUSD(n){
  if(!Number.isFinite(n) || n<=0) return "—";
  return "US$" + n.toFixed(2);
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(Number.isNaN(d.getTime())) return "—";
  return d.toLocaleString(undefined, { year:"numeric", month:"short", day:"2-digit", hour:"2-digit", minute:"2-digit" });
}
function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

/* ================= FX ================= */

async function fetchFX(){
  try{
    const r = await fetch("https://api.exchangerate.host/latest?base=USD&symbols=CAD");
    const d = await r.json();
    FX = d.rates.CAD;
  }catch(e){}
  document.getElementById("fxLabel").textContent = `1 USD = ${FX.toFixed(3)} CAD`;
}

/* ================= SCRYFALL ================= */

async function fetchMarket(card){
  if(card.market) return;

  const sb = window.auth._client;

  const r = await fetch(
    `${sb.supabaseUrl}/functions/v1/scryfall-proxy`,
    {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        id:card.scryfall_id,
        name:card.name,
        set:card.set_code
      })
    }
  );

  if(!r.ok) return;

  const d = await r.json();

  card.market = parseFloat(d.prices?.usd) || 0;
  card.image =
    d.image_uris?.normal ||
    d.card_faces?.[0]?.image_uris?.normal;
}

/* ================= ADMIN KPI ================= */

function renderAdminKpis(){
  const el = document.getElementById("f2fKpis");
  if(!el) return;

  const total = CARDS.length;
  const have = CARDS.filter(c => Number.isFinite(c.f2f_price) && c.f2f_price > 0).length;
  const blank = total - have;

  const newest = CARDS
    .map(c => c.f2f_last_updated)
    .filter(Boolean)
    .sort()
    .slice(-1)[0];

  el.innerHTML = `
    <span><strong>F2F filled:</strong> ${have}/${total}</span>
    <span><strong>Blanks:</strong> ${blank}</span>
    <span><strong>Latest update:</strong> ${fmtDate(newest)}</span>
  `;
}

/* ================= RENDER ================= */

function render(){

  const container = document.getElementById("content");
  container.innerHTML = "";

  const validCategories = CATEGORIES.filter(c =>
    c.name.toLowerCase() !== "maybeboard"
  );

  validCategories.sort((a,b)=>{
    if(a.name==="Reserved List Picks") return -1;
    if(b.name==="Reserved List Picks") return 1;
    return a.name.localeCompare(b.name);
  });

  validCategories.forEach(cat => {

    const cards = CARDS
      .filter(c => c.category_id === cat.id)
      .sort((a,b)=>(b.market||0)-(a.market||0));

    if(!cards.length) return;

    const section = document.createElement("div");
    section.className = "section";

    const pill = document.createElement("div");
    pill.className = "category-pill";
    pill.textContent = cat.name;

    const grid = document.createElement("div");
    grid.className = "grid";

    cards.forEach(c => {

      const marketLine = money(c.market);
      const f2fLine = (Number.isFinite(c.f2f_price) && c.f2f_price>0)
        ? money(c.f2f_price)
        : "—";

      const f2fMeta = c.f2f_last_updated ? `F2F: ${fmtDate(c.f2f_last_updated)}` : "";

      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `
        <img src="${c.image||""}" loading="lazy">
        <div class="price">
          <div><strong>Market:</strong> ${marketLine}</div>
          <div><strong>F2F buy:</strong> ${f2fLine}</div>
          <div class="meta">${f2fMeta}</div>

          <div class="admin-edit" data-id="${c.id}">
            <input type="number" step="0.01" min="0" placeholder="OUR BUY (USD)" data-field="our_buy" value="${Number.isFinite(c.our_buy)?c.our_buy:""}">
            <input type="number" step="0.01" min="0" placeholder="F2F buy (USD)" data-field="f2f_price" value="${Number.isFinite(c.f2f_price)?c.f2f_price:""}">
            <button data-action="save">Save</button>
          </div>
        </div>
      `;
      grid.appendChild(el);
    });

    section.appendChild(pill);
    section.appendChild(grid);
    container.appendChild(section);

  });

  // toggle admin edit UI visibility
  document.querySelectorAll(".admin-edit").forEach(row=>{
    row.style.display = (ADMIN_MODE && IS_ADMIN) ? "flex" : "none";
  });

  renderAdminKpis();
}

/* ================= LOAD ================= */

async function loadData(){

  const sb = window.auth ? window.auth._client : null;
  if(!sb) return;

  const { data: cats } = await sb.from("buylist_categories").select("*");
  CATEGORIES = cats || [];

  const { data: cards } = await sb.from("buylist_cards").select("*");
  CARDS = cards || [];

  await Promise.all(CARDS.map(fetchMarket));

  /* detect admin */
  const { data:{ session } } = await sb.auth.getSession();
  if(session){
    const { data: role } = await sb
      .from("user_roles")
      .select("role")
      .eq("user_id", session.user.id)
      .single();

    if(role?.role === "admin"){
      IS_ADMIN = true;
      document.getElementById("adminToggleWrap").style.display = "inline-block";
    }
  }

  render();
}

/* ================= CSV UPLOAD ================= */

document.getElementById("uploadCsvBtn")
.addEventListener("click", async () => {

  const fileInput = document.getElementById("csvFile");
  const status = document.getElementById("uploadStatus");

  if(!fileInput.files.length){
    status.textContent="Select a CSV file first.";
    return;
  }

  const file = fileInput.files[0];
  const text = await file.text();

  status.textContent="Uploading...";

  try{
    const sb = window.auth._client;
    const { data:{ session } } = await sb.auth.getSession();

    const res = await fetch(
      `${sb.supabaseUrl}/functions/v1/import-buylist`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":`Bearer ${session.access_token}`
        },
        body:JSON.stringify({ csv:text })
      }
    );

    const json = await res.json();

    if(res.ok){
      status.textContent=`Imported ${json.imported} cards.`;
      await loadData();
    }else{
      status.textContent="Error: " + JSON.stringify(json);
    }

  }catch(err){
    status.textContent="Upload failed.";
  }

});

/* ================= ADMIN: SAVE INLINE EDIT ================= */

document.addEventListener("click", async (e) => {
  const t = e.target;
  if(!(t instanceof HTMLElement)) return;
  if(t.dataset.action !== "save") return;

  const wrap = t.closest(".admin-edit");
  if(!wrap) return;

  const id = wrap.getAttribute("data-id");
  if(!id) return;

  const ourBuyEl = wrap.querySelector('input[data-field="our_buy"]');
  const f2fEl = wrap.querySelector('input[data-field="f2f_price"]');

  const our_buy = ourBuyEl && (ourBuyEl.value !== "") ? parseFloat(ourBuyEl.value) : null;
  const f2f_price = f2fEl && (f2fEl.value !== "") ? parseFloat(f2fEl.value) : null;

  try{
    const sb = window.auth._client;
    const { error } = await sb
      .from("buylist_cards")
      .update({
        our_buy,
        f2f_price,
        // if admin manually edits F2F, count that as an update timestamp too
        f2f_last_updated: f2f_price ? new Date().toISOString() : null
      })
      .eq("id", id);

    if(error){
      alert("Save failed: " + error.message);
      return;
    }

    // update local cache
    const c = CARDS.find(x => String(x.id) === String(id));
    if(c){
      c.our_buy = our_buy;
      c.f2f_price = f2f_price;
      c.f2f_last_updated = f2f_price ? new Date().toISOString() : null;
    }
    render();

  }catch(err){
    alert("Save failed.");
  }
});

/* ================= ADMIN: REFRESH F2F (BATCH LOOP) ================= */

/* ================= ADMIN: REFRESH F2F (BATCH LOOP) ================= */

async function refreshF2FPrices({ onlyBlank=false } = {}){

  const sb = window.auth._client;
  const { data:{ session } } = await sb.auth.getSession();

  const prog = document.getElementById("f2fProgress");
  const btnAll = document.getElementById("refreshF2FBtn");
  const btnBlank = document.getElementById("refreshF2FBlankBtn");

  const total = CARDS.length;
  let offset = 0;
  let updatedTotal = 0;
  let processedTotal = 0;
  let loops = 0;

  if(prog) prog.textContent = "Starting…";
  if(btnAll) btnAll.disabled = true;
  if(btnBlank) btnBlank.disabled = true;

  try{

    while(true){
      loops++;

      const res = await fetch(
        `${sb.supabaseUrl}/functions/v1/refresh-f2f-prices`,
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Authorization":`Bearer ${session.access_token}`
          },
          body: JSON.stringify({
            offset,
            only_blank: onlyBlank
          })
        }
      );

      const json = await res.json().catch(()=> ({}));

      if(!res.ok){
        throw new Error(json?.error || "F2F refresh failed");
      }

      updatedTotal += (json.updated || 0);
      processedTotal += (json.processed || 0);

      if(prog){
        prog.textContent =
          `Refreshing F2F… batch ${loops} · processed ${processedTotal} · updated ${updatedTotal}` +
          (onlyBlank ? " · only blanks" : "");
      }

      if((json.processed || 0) === 0) break;

      offset = json.next_offset ?? (offset + 40);

      await new Promise(res => setTimeout(res, 350));

      if(!onlyBlank && offset >= total) break;
      if(loops > 999) break;
    }

    if(prog) prog.textContent = `Done. Updated ${updatedTotal}. Reloading…`;
    await loadData();

    if(prog) prog.textContent = `Done. Updated ${updatedTotal}.`;

  }catch(err){
    if(prog) prog.textContent = `Error: ${err.message || "failed"}`;
  }finally{
    if(btnAll) btnAll.disabled = false;
    if(btnBlank) btnBlank.disabled = false;
  }
}

/* ================= INIT ================= */

(async function(){
  await fetchFX();
  await loadData();
})();

document.getElementById("currencySelect")
  .addEventListener("change", render);

document.getElementById("adminToggle")
?.addEventListener("change", function(){
  ADMIN_MODE = !!this.checked;

  document.getElementById("adminUpload").style.display =
    (ADMIN_MODE && IS_ADMIN) ? "block" : "none";

  document.getElementById("adminTools").style.display =
    (ADMIN_MODE && IS_ADMIN) ? "block" : "none";

  render();
});
</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
