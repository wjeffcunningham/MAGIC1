<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BCPMM Buylist</title>

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
*{box-sizing:border-box}

.buylist-wrap{
  max-width:1200px;
  margin:6rem auto 4rem;
  padding:0 1.5rem;
}

header{margin-bottom:2rem}
header h1{margin:0 0 .5rem}
header p{opacity:.75;font-size:.95rem}

.controls{
  margin:1.5rem 0 2rem;
  display:flex;
  gap:1.5rem;
  flex-wrap:wrap;
  align-items:center;
}

.admin-upload{
  margin-bottom:2rem;
  padding:1rem;
  border:1px solid var(--border);
  border-radius:10px;
  background:rgba(255,255,255,0.04);
  display:none;
}

.admin-upload input[type=file]{
  margin-bottom:.5rem;
}

.section{margin-top:4rem}
.category-headroom{margin-bottom:2.5rem}

.category-pill{
  display:inline-block;
  padding:.6rem 1.2rem;
  border-radius:999px;
  border:1px solid var(--border);
  font-weight:800;
  letter-spacing:.5px;
  font-size:1.05rem;
}

.stack{
  display:flex;
  align-items:flex-start;
  padding-top:1rem;
}

.card{
  width:140px;
  position:relative;
  transition:transform .15s ease;
}

.card:not(:first-child){margin-left:-55px}

.card:hover{
  transform:translateY(-10px);
  z-index:20;
}

.card img{
  width:100%;
  border-radius:10px;
  box-shadow:0 10px 22px rgba(0,0,0,.45);
}

.price{
  text-align:center;
  font-size:.9rem;
  margin-top:.5rem;
}

.row{
  display:flex;
  justify-content:space-between;
}

.red-dot{
  position:absolute;
  top:8px;
  right:8px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#ff3b30;
  box-shadow:0 0 8px rgba(255,0,0,.7);
}
</style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="buylist-wrap">

<header>
<h1>BCPMM Buylist</h1>
<p>Market prices from Scryfall (USD). Converted to CAD if selected.</p>
</header>

<div class="controls">
<label>
<input type="checkbox" id="hideMarginal">
Hide marginal editions
</label>

<label>
Currency:
<select id="currencySelect">
<option value="USD">USD</option>
<option value="CAD">CAD</option>
</select>
</label>

<label id="adminToggleWrap" style="display:none">
<input type="checkbox" id="adminToggle">
Admin Mode
</label>

<span id="fxLabel"></span>
</div>

<!-- CSV Upload Panel -->
<div class="admin-upload" id="adminUpload">
<strong>Import CSV</strong><br>
<input type="file" id="csvFile" accept=".csv">
<br>
<button id="uploadCsvBtn">Upload & Import</button>
<div id="uploadStatus" style="margin-top:.5rem;font-size:.9rem;"></div>
</div>

<div id="content">Loading…</div>

</div>

<script>

/* ================= CLIENT ================= */

function getClient(){
  return window.auth ? window.auth._client : null;
}

let CARDS=[];
let CATEGORIES=[];
let FX=1.35;
let IS_ADMIN=false;

/* ================= FX ================= */

function currency(){return document.getElementById("currencySelect").value}
function convert(n){return currency()==="CAD"?n*FX:n}
function money(n){
  if(!Number.isFinite(n)||n<=0)return "—";
  return (currency()==="CAD"?"CA$":"US$")+convert(n).toFixed(2);
}

async function fetchFX(){
  try{
    const r=await fetch("https://api.exchangerate.host/latest?base=USD&symbols=CAD");
    const d=await r.json();
    FX=d.rates.CAD;
  }catch(e){}
  document.getElementById("fxLabel").textContent=`1 USD = ${FX.toFixed(3)} CAD`;
}

/* ================= SCRYFALL ================= */

async function fetchMarket(card){
  if(card.lock_price)return;

  let url = card.scryfall_id
    ? "https://api.scryfall.com/cards/"+card.scryfall_id
    : `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card.name)}&set=${card.set_code}`;

  const r=await fetch(url);
  if(!r.ok)return;
  const d=await r.json();

  card.market=parseFloat(d.prices.usd)||0;
  card.image=d.image_uris?.small||d.card_faces?.[0]?.image_uris?.small;
}

/* ================= CSV IMPORT ================= */

document.getElementById("uploadCsvBtn").addEventListener("click", async () => {

  const fileInput = document.getElementById("csvFile");
  const status = document.getElementById("uploadStatus");

  if(!fileInput.files.length){
    status.textContent="Select a CSV file first.";
    return;
  }

  const file = fileInput.files[0];
  const text = await file.text();

  status.textContent="Uploading...";

  try{

    const sb = getClient();
    const { data:{ session } } = await sb.auth.getSession();

    const res = await fetch(`${sb.supabaseUrl}/functions/v1/import-buylist`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${session.access_token}`
      },
      body:JSON.stringify({ csv: text })
    });

    const json = await res.json();

    if(res.ok){
      status.textContent=`Imported ${json.imported} cards.`;
      await loadData();
    }else{
      status.textContent="Error: "+JSON.stringify(json);
    }

  }catch(err){
    status.textContent="Upload failed.";
  }

});

/* ================= RENDER ================= */

function render(){

const container=document.getElementById("content");
container.innerHTML="";

CATEGORIES.forEach(cat=>{

const cards=CARDS.filter(c=>c.category_id===cat.id);
if(!cards.length)return;

const section=document.createElement("div");
section.className="section";

const pill=document.createElement("div");
pill.className="category-pill";
pill.textContent=cat.name;

section.appendChild(pill);

const stack=document.createElement("div");
stack.className="stack";

cards.forEach(c=>{
const el=document.createElement("div");
el.className="card";

el.innerHTML=`
<img src="${c.image||""}">
<div class="price">
<div class="row"><span>Mkt</span><span>${money(c.market)}</span></div>
</div>
`;

stack.appendChild(el);
});

section.appendChild(stack);
container.appendChild(section);
});
}

/* ================= LOAD ================= */

async function loadData(){

const sb=getClient();
if(!sb)return;

const {data:cats}=await sb.from("buylist_categories").select("*").order("name");
CATEGORIES=cats||[];

const {data:cards}=await sb.from("buylist_cards").select("*");
CARDS=cards||[];

await Promise.all(CARDS.map(fetchMarket));

/* detect admin */
const {data:{session}}=await sb.auth.getSession();
if(session){
const {data:role}=await sb
.from("user_roles")
.select("role")
.eq("user_id",session.user.id)
.single();

if(role?.role==="admin"){
IS_ADMIN=true;
document.getElementById("adminToggleWrap").style.display="inline-block";
}
}

render();
}

/* ================= INIT ================= */

(async function(){
await fetchFX();
await loadData();
})();

/* Show upload panel when admin mode toggled */

document.getElementById("adminToggle").addEventListener("change",function(){
  document.getElementById("adminUpload").style.display=
    this.checked && IS_ADMIN ? "block" : "none";
});

</script>

<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
