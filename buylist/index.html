<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buylist · B.C. Premodern Masters</title>

<link rel="icon" type="image/svg+xml" href="/assets/BCPMM.svg" />
<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
.buylist-wrap {
  max-width: 1100px;
  margin: 6rem auto 4rem;
  padding: 0 1.5rem;
}

.back-link {
  display: inline-block;
  margin-bottom: 1.25rem;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--muted);
  text-decoration: none;
}

.back-link:hover {
  color: var(--fg);
  text-decoration: underline;
}

h1 { text-align:center; margin-bottom:0.25rem; }

.subtitle {
  text-align:center;
  color:var(--muted);
  margin-bottom:0.5rem;
}

.edition-flag {
  text-align:center;
  font-size:0.8rem;
  color:var(--muted);
  margin-bottom:1.5rem;
}

.section-title {
  margin:2.5rem 0 1rem;
  font-size:1.1rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.5px;
  border-bottom:1px solid var(--muted);
  padding-bottom:0.4rem;
}

.view-bar {
  text-align:center;
  margin-bottom:1.5rem;
}

.view-bar button {
  font-weight:700;
  padding:0.35rem 0.7rem;
  margin:0 0.25rem;
  border:1px solid var(--muted);
  background:transparent;
  cursor:pointer;
}

.view-bar button.active {
  background:var(--fg);
  color:var(--bg);
}

.card-grid {
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:18px;
}

.card-tile { text-align:center; }

.card-tile img {
  width:60px;
  height:auto;
  border-radius:6px;
  display:block;
  margin:0 auto;
}

.card-meta {
  margin-top:0.35rem;
  font-size:0.72rem;
}

.card-name { font-weight:700; }
.card-set { color:var(--muted); }
.card-price { font-weight:700; }

.hidden { display:none; }

.footer-email {
  margin-top:3rem;
  text-align:center;
  font-size:0.9rem;
  color:var(--muted);
}

@media(max-width:1000px){
  .card-grid{grid-template-columns:repeat(6,1fr);}
}
@media(max-width:700px){
  .card-grid{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="buylist-wrap">

<a href="/" class="back-link">← Back to main</a>

<h1>Buylist</h1>
<div class="subtitle">NM only · Prices in CAD</div>
<div class="edition-flag">March 2026 Update</div>

<div class="view-bar">
  View:
  <button id="tile-btn" class="active">Tile</button>
  <button id="list-btn">List</button>
</div>

<div class="section-title">Reserved List Buys</div>
<div id="reserved-grid" class="card-grid"></div>

<div class="section-title">All Other Buys</div>
<div id="normal-grid" class="card-grid"></div>

<div class="footer-email">
  Contact: <a href="mailto:bcpremodermasters@gmail.com">bcpremodermasters@gmail.com</a>
</div>

</div>

<script>

/* =====================================================
   FULL SOURCE LIST (UNCHANGED)
===================================================== */

const cards = [

{ name:"Intuition", set:"tmp", tag:"Tutor", price:220, previous:200 },
{ name:"Survival of the Fittest", set:"wc98", tag:"Tutor", price:80, previous:75 },
{ name:"Eladamri, Lord of Leaves", set:"tmp", tag:"Lord", price:80, previous:80 },
{ name:"Aluren", set:"tmp", tag:"Combo", price:50, previous:40 },
{ name:"Phyrexian Devourer", set:"all", tag:"Combo", price:50, previous:50 },
{ name:"Powder Keg", set:"uds", tag:"Removal", price:80, previous:80 },
{ name:"Squee, Goblin Nabob", set:"mmq", tag:"Recursion", price:40, previous:40 },
{ name:"City of Brass", set:"chr", tag:"Land", price:30, previous:30 },
{ name:"Recurring Nightmare", set:"wc98", tag:"Recursion", price:25, previous:20 },
{ name:"Hermit Druid", set:"sth", tag:"Mill", price:10, previous:20 },
{ name:"Engineered Plague", set:"ulg", tag:"Removal", price:10, previous:10 },
{ name:"Elvish Champion", set:"inv", tag:"Lord", price:20, previous:20 },
{ name:"Merchant Scroll", set:"hml", tag:"Tutor", price:5, previous:5 },
{ name:"Karplusan Forest", set:"dkm", tag:"Land", price:7, previous:7 },
{ name:"Underground River", set:"dkm", tag:"Land", price:7, previous:7 },
{ name:"Elvish Spirit Guide", set:"all", tag:"Ramp", price:4, previous:4 },
{ name:"Snow-Covered Forest", set:"ice", tag:"Land", price:3, previous:3 },
{ name:"Snow-Covered Island", set:"ice", tag:"Land", price:3, previous:3 },
{ name:"Snow-Covered Mountain", set:"ice", tag:"Land", price:3, previous:3 },
{ name:"Snow-Covered Swamp", set:"ice", tag:"Land", price:3, previous:3 },
{ name:"Snow-Covered Plains", set:"ice", tag:"Land", price:2, previous:2 },
{ name:"Quirion Dryad", set:"pls", tag:"Creature", price:2, previous:2 },
{ name:"Fyndhorn Elves", set:"dkm", tag:"Creature", price:2, previous:2 },
{ name:"Grim Lavamancer", set:"tor", tag:"Creature", price:12, previous:12 },
{ name:"Academy Rector", set:"wc99", tag:"Tutor", price:25, previous:25 },
{ name:"Shallow Grave", set:"mir", tag:"Recursion", price:60, previous:40 },
{ name:"Deranged Hermit", set:"ulg", tag:"Creature", price:70, previous:70 },
{ name:"Replenish", set:"wc99", tag:"Recursion", price:40, previous:35 },
{ name:"Humility", set:"tmp", tag:"Control", price:90, previous:60 },
{ name:"Palinchron", set:"ulg", tag:"Combo", price:80, previous:70 },
{ name:"Mind Over Matter", set:"exo", tag:"Combo", price:70, previous:65 },
{ name:"Lotus Vale", set:"wth", tag:"Land", price:40, previous:30 },
{ name:"Abeyance", set:"wth", tag:"Control", price:15, previous:15 },
{ name:"Krovikan Horror", set:"all", tag:"Recursion", price:10, previous:10 },
{ name:"Volrath's Shapeshifter", set:"sth", tag:"Combo", price:35, previous:20 },
{ name:"Opalescence", set:"uds", tag:"Combo", price:60, previous:50 },
{ name:"Meditate", set:"tmp", tag:"Draw", price:20, previous:20 },
{ name:"Sarcomancy", set:"tmp", tag:"Enchantment", price:12, previous:12 }

];

let enriched = [];

function fireIcons(card) {
  const delta = card.price - card.previous;
  if (delta >= 25) return " 🔥🔥";
  if (delta >= 5) return " 🔥";
  return "";
}

async function enrichCards() {

  enriched = [];

  for (let card of cards) {

    try {

      const url = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card.name)}&set=${card.set}`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.object === "error") continue;

      enriched.push({
        ...card,
        image: data.image_uris?.small ?? "",
        setName: data.set_name ?? card.set,
        collector: data.collector_number ?? "",
        reserved: data.reserved
      });

    } catch (err) {
      console.error("Fetch failed:", card.name, err);
    }
  }

  render();
}

function render() {

  const reservedGrid = document.getElementById("reserved-grid");
  const normalGrid = document.getElementById("normal-grid");

  reservedGrid.innerHTML = "";
  normalGrid.innerHTML = "";

  enriched.forEach(card => {

    const fire = fireIcons(card);

    const tile = `
      <div class="card-tile">
        <img src="${card.image}" />
        <div class="card-meta">
          <div class="card-name">${card.name}${fire}</div>
          <div class="card-set">${card.setName} · #${card.collector}</div>
          <div>${card.tag}</div>
          <div class="card-price">$${card.price}</div>
        </div>
      </div>
    `;

    if (card.reserved) {
      reservedGrid.insertAdjacentHTML("beforeend", tile);
    } else {
      normalGrid.insertAdjacentHTML("beforeend", tile);
    }

  });
}

document.getElementById("tile-btn").onclick = () => {
  document.getElementById("reserved-grid").classList.remove("hidden");
  document.getElementById("normal-grid").classList.remove("hidden");
};

document.getElementById("list-btn").onclick = () => {
  document.getElementById("reserved-grid").classList.add("hidden");
  document.getElementById("normal-grid").classList.add("hidden");
};

enrichCards();

</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
