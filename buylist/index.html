<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BCPMM Buylist</title>

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
*{box-sizing:border-box}
.buylist-wrap{max-width:1500px;margin:6rem auto 4rem;padding:0 2rem;}
header{display:flex;align-items:center;gap:1.25rem;margin-bottom:2rem;}
.logo{width:64px;}
header h1{margin:0;font-size:2rem;}
header p{margin:.25rem 0 0;opacity:.7;font-size:.9rem;}
.kpi-row{opacity:.85;font-size:.9rem;margin-top:.35rem;line-height:1.35}
.status-row{margin-top:.4rem;font-size:.85rem;opacity:.85}
.controls{margin:1.5rem 0 2rem;display:flex;gap:2rem;flex-wrap:wrap;align-items:center;}
.section{margin-bottom:4.5rem;}
.category-pill{
  display:inline-block;padding:.55rem 1.25rem;border-radius:999px;
  border:1px solid var(--border);
  font-weight:800;font-size:.95rem;margin-bottom:1.3rem;
}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:0.9rem 0.7rem;}
@media (max-width:1400px){.grid{grid-template-columns:repeat(6,1fr);}}
@media (max-width:1000px){.grid{grid-template-columns:repeat(4,1fr);}}
@media (max-width:650px){.grid{grid-template-columns:repeat(2,1fr);}}
.card{text-align:center;position:relative;}
.card img{width:100%;border-radius:8px;box-shadow:0 6px 14px rgba(0,0,0,.45);}
.noimg{
  width:100%;aspect-ratio:0.714;border-radius:8px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  display:flex;align-items:center;justify-content:center;
  padding:.75rem;font-size:.85rem;opacity:.8;
}
.badge{
  position:absolute;top:8px;left:8px;
  background:rgba(0,0,0,.75);
  padding:.25rem .5rem;border-radius:10px;
  font-size:.72rem;font-weight:700;
}
.price{margin-top:.35rem;font-size:.8rem;display:flex;flex-direction:column;gap:.18rem;}
.line{display:flex;justify-content:center;gap:.35rem;flex-wrap:wrap;}
.k{opacity:.72}
.v{font-weight:700}
.meta{opacity:.78;font-size:.78rem;line-height:1.25}
.dim{opacity:.5;filter:saturate(.6);}
.admin-edit{
  margin-top:.45rem;display:none;gap:.35rem;
  flex-wrap:wrap;justify-content:center;
}
.admin-edit input{
  width:150px;padding:.35rem .5rem;border-radius:8px;
  border:1px solid var(--border);
  background:rgba(0,0,0,.25);color:var(--fg);
}
.admin-edit .wide{width:260px;}
.admin-edit button{padding:.35rem .65rem;}
</style>
</head>

<body>
<div id="global-menu-root"></div>
<div class="buylist-wrap">

<header>
  <img src="/assets/BCPMM.svg" class="logo" />
  <div>
    <h1>BCPMM Buylist</h1>
    <p>Market = USD (TCGplayer Market). F2F = CAD.</p>
    <div class="kpi-row" id="globalKpi"></div>
    <div class="status-row" id="statusRow"></div>
  </div>
</header>

<div class="controls">
  <label>Currency:
    <select id="currencySelect">
      <option value="USD">USD</option>
      <option value="CAD">CAD</option>
    </select>
  </label>

  <label id="adminToggleWrap" style="display:none">
    <input type="checkbox" id="adminToggle"> Admin Mode
  </label>

  <span id="fxLabel"></span>
</div>

<div id="content">Loading…</div>
</div>

<script>
let CARDS = [];
let CATEGORIES = [];
let FX = 1.35;
let IS_ADMIN = false;
let ADMIN_MODE = false;

function currency(){
  return document.getElementById("currencySelect").value;
}

function moneyUSD(n){
  if(!Number.isFinite(n)||n<=0) return "—";
  return currency()==="USD"
    ? "US$"+n.toFixed(2)
    : "CA$"+(n*FX).toFixed(2);
}

function moneyCAD(n){
  if(!Number.isFinite(n)||n<=0) return "—";
  return currency()==="CAD"
    ? "CA$"+n.toFixed(2)
    : "US$"+(n/FX).toFixed(2);
}

async function fetchFX(){
  try{
    const r=await fetch("https://api.exchangerate.host/latest?base=USD&symbols=CAD");
    const d=await r.json();
    if(d?.rates?.CAD) FX=d.rates.CAD;
  }catch(e){}
  document.getElementById("fxLabel").textContent=
    `1 USD = ${FX.toFixed(3)} CAD`;
}

function effectiveBuyNM(c){
  return Number.isFinite(c.f2f_buy_nm_override_cad)
    ? c.f2f_buy_nm_override_cad
    : c.f2f_buy_nm_cad;
}

function effectiveBuyLP(c){
  return Number.isFinite(c.f2f_buy_lp_override_cad)
    ? c.f2f_buy_lp_override_cad
    : c.f2f_buy_lp_cad;
}

function render(){
  const container=document.getElementById("content");
  container.innerHTML="";

  const cats=CATEGORIES.sort((a,b)=>a.name.localeCompare(b.name));

  for(const cat of cats){
    const cards=CARDS.filter(c=>c.category_id===cat.id)
      .sort((a,b)=>(b.market_usd||0)-(a.market_usd||0));
    if(!cards.length) continue;

    const section=document.createElement("div");
    section.className="section";

    section.innerHTML=`<div class="category-pill">${cat.name}</div>`;

    const grid=document.createElement("div");
    grid.className="grid";

    for(const c of cards){
      const displayBuy =
        Number.isFinite(c.our_buy_usd)
          ? (currency()==="USD"
              ? c.our_buy_usd
              : c.our_buy_usd*FX)
          : "";

      const el=document.createElement("div");
      el.className="card"+(c.not_buying?" dim":"");

      el.innerHTML=`
        ${c.not_buying?`<div class="badge">NOT BUYING</div>`:""}
        ${c.image_url
          ? `<img src="${c.image_url}" loading="lazy">`
          : `<div class="noimg">${c.name}</div>`}
        <div class="price">
          <div class="line"><span class="k">Market</span><span class="v">${moneyUSD(c.market_usd)}</span></div>
          <div class="line"><span class="k">Our Buy</span><span class="v">${moneyUSD(c.our_buy_usd)}</span></div>
          <div class="meta">
            <div class="line">
              <span class="k">F2F Buy</span>
              <span class="v">NM ${moneyCAD(effectiveBuyNM(c))}</span>
              <span class="k">/</span>
              <span class="v">LP ${moneyCAD(effectiveBuyLP(c))}</span>
            </div>
          </div>

          <div class="admin-edit" data-id="${c.id}">
            <input type="number" step="0.01"
              placeholder="OUR BUY (${currency()})"
              data-field="our_buy_display"
              value="${displayBuy}">

            <input type="number" step="0.01"
              placeholder="F2F NM Override CAD"
              data-field="f2f_buy_nm_override_cad"
              value="${c.f2f_buy_nm_override_cad||""}">

            <input type="number" step="0.01"
              placeholder="F2F LP Override CAD"
              data-field="f2f_buy_lp_override_cad"
              value="${c.f2f_buy_lp_override_cad||""}">

            <label>
              <input type="checkbox"
                data-field="not_buying"
                ${c.not_buying?"checked":""}>
              Not Buying
            </label>

            <input class="wide" type="text"
              placeholder="F2F handle or URL override"
              data-field="f2f_url_override"
              value="${c.f2f_url_override||""}">

            <button data-action="save">Save</button>
          </div>
        </div>
      `;

      grid.appendChild(el);
    }

    section.appendChild(grid);
    container.appendChild(section);
  }

  document.querySelectorAll(".admin-edit")
    .forEach(el=>el.style.display=
      (ADMIN_MODE&&IS_ADMIN)?"flex":"none");
}

async function loadData(){
  const sb=window.auth._client;

  const {data:cats}=await sb
    .from("buylist_categories")
    .select("id,name");

  const {data:cards}=await sb
    .from("buylist_cards")
    .select("*");

  CATEGORIES=cats||[];
  CARDS=cards||[];

  const {data:{session}}=await sb.auth.getSession();
  if(session){
    const {data:role}=await sb
      .from("user_roles")
      .select("role")
      .eq("user_id",session.user.id)
      .single();
    if(role?.role==="admin"){
      IS_ADMIN=true;
      document.getElementById("adminToggleWrap")
        .style.display="inline-block";
    }
  }

  render();
}

document.addEventListener("click",async(e)=>{
  const t=e.target;
  if(!(t instanceof HTMLElement)) return;
  if(t.dataset.action!=="save") return;

  const wrap=t.closest(".admin-edit");
  const id=wrap.getAttribute("data-id");
  const sb=window.auth._client;

  const getNum=sel=>{
    const el=wrap.querySelector(sel);
    if(!el||el.value==="") return null;
    const n=parseFloat(el.value);
    return Number.isFinite(n)?n:null;
  };

  const displayBuy=getNum('[data-field="our_buy_display"]');
  const ourBuyUSD=
    Number.isFinite(displayBuy)
      ? (currency()==="USD"
          ? displayBuy
          : displayBuy/FX)
      : null;

  const payload={
    our_buy_usd:ourBuyUSD,
    f2f_buy_nm_override_cad:getNum('[data-field="f2f_buy_nm_override_cad"]'),
    f2f_buy_lp_override_cad:getNum('[data-field="f2f_buy_lp_override_cad"]'),
    f2f_url_override:
      wrap.querySelector('[data-field="f2f_url_override"]')?.value.trim()||null,
    not_buying:
      !!wrap.querySelector('[data-field="not_buying"]')?.checked
  };

  await sb.from("buylist_cards")
    .update(payload)
    .eq("id",id);

  Object.assign(CARDS.find(c=>c.id==id),payload);
  render();
});

document.getElementById("adminToggle")
  ?.addEventListener("change",function(){
    ADMIN_MODE=this.checked;
    render();
});

document.getElementById("currencySelect")
  .addEventListener("change",render);

(async function(){
  await fetchFX();
  await loadData();
})();
</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
