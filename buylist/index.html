<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BCPMM Buylist</title>

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
*{box-sizing:border-box}

/* ================= LAYOUT ================= */

.buylist-wrap{
  max-width:1500px;
  margin:6rem auto 4rem;
  padding:0 2rem;
}

header{
  display:flex;
  align-items:center;
  gap:1.25rem;
  margin-bottom:3rem;
}

.logo{ width:64px; }

header h1{
  margin:0;
  font-size:2rem;
}

header p{
  margin:.25rem 0 0;
  opacity:.7;
  font-size:.9rem;
}

.controls{
  margin:2rem 0 3rem;
  display:flex;
  gap:2rem;
  flex-wrap:wrap;
  align-items:center;
}

/* ================= ADMIN ================= */

.admin-upload{
  margin-bottom:3rem;
  padding:1.25rem;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,255,255,0.04);
  display:none;
}

.admin-upload button{
  margin-top:.5rem;
}

/* ================= CATEGORY ================= */

.section{
  margin-bottom:4.5rem;
}

.category-pill{
  display:inline-block;
  padding:.55rem 1.25rem;
  border-radius:999px;
  border:1px solid var(--border);
  font-weight:800;
  letter-spacing:.4px;
  font-size:.95rem;
  margin-bottom:1.75rem;
}

/* ================= GRID ================= */

.grid{
  display:grid;
  grid-template-columns:repeat(8, 1fr);
  gap:0.9rem 0.7rem;
}

@media (max-width: 1400px){
  .grid{ grid-template-columns:repeat(6, 1fr); }
}

@media (max-width: 1000px){
  .grid{ grid-template-columns:repeat(4, 1fr); }
}

@media (max-width: 650px){
  .grid{ grid-template-columns:repeat(2, 1fr); }
}

/* ================= CARD ================= */

.card{
  text-align:center;
}

.card img{
  width:100%;
  border-radius:8px;
  box-shadow:0 6px 14px rgba(0,0,0,.45);
  transition:transform .15s ease;
}

.card img:hover{
  transform:translateY(-4px);
}

.price{
  margin-top:.35rem;
  font-weight:600;
  font-size:.8rem;
}
</style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="buylist-wrap">

<header>
<img src="/assets/BCPMM.svg" class="logo" />
<div>
<h1>BCPMM Buylist</h1>
<p>Near Mint prices via Scryfall → TCGplayer Market (USD). Converted live to CAD.</p>
</div>
</header>

<div class="controls">
<label>
Currency:
<select id="currencySelect">
<option value="USD">USD</option>
<option value="CAD">CAD</option>
</select>
</label>

<label id="adminToggleWrap" style="display:none">
<input type="checkbox" id="adminToggle">
Admin Mode
</label>

<span id="fxLabel"></span>
</div>

<!-- ================= ADMIN UPLOAD ================= -->

<div class="admin-upload" id="adminUpload">
<strong>Upload New Buylist CSV</strong><br>
<input type="file" id="csvFile" accept=".csv">
<br>
<button id="uploadCsvBtn">Upload & Replace Buylist</button>
<div id="uploadStatus" style="margin-top:.5rem;font-size:.85rem;"></div>
</div>

<div id="content">Loading…</div>

</div>

<script>

/* ================= STATE ================= */

let CARDS=[];
let CATEGORIES=[];
let FX=1.35;
let IS_ADMIN=false;

/* ================= FX ================= */

function currency(){return document.getElementById("currencySelect").value}
function convert(n){return currency()==="CAD"?n*FX:n}
function money(n){
  if(!Number.isFinite(n)||n<=0)return "—";
  return (currency()==="CAD"?"CA$":"US$")+convert(n).toFixed(2);
}

async function fetchFX(){
  try{
    const r=await fetch("https://api.exchangerate.host/latest?base=USD&symbols=CAD");
    const d=await r.json();
    FX=d.rates.CAD;
  }catch(e){}
  document.getElementById("fxLabel").textContent=
    `1 USD = ${FX.toFixed(3)} CAD`;
}

/* ================= SCRYFALL ================= */

async function fetchMarket(card){

  if(card.market) return;

  const sb = window.auth._client;

  const r = await fetch(
    `${sb.supabaseUrl}/functions/v1/scryfall-proxy`,
    {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        id:card.scryfall_id,
        name:card.name,
        set:card.set_code
      })
    }
  );

  if(!r.ok) return;

  const d = await r.json();

  card.market = parseFloat(d.prices?.usd)||0;

  card.image =
    d.image_uris?.normal ||
    d.card_faces?.[0]?.image_uris?.normal;
}

/* ================= RENDER ================= */

function render(){

const container=document.getElementById("content");
container.innerHTML="";

const validCategories = CATEGORIES.filter(c =>
  c.name.toLowerCase() !== "maybeboard"
);

validCategories.sort((a,b)=>{
  if(a.name==="Reserved List Picks") return -1;
  if(b.name==="Reserved List Picks") return 1;
  return a.name.localeCompare(b.name);
});

validCategories.forEach(cat=>{

const cards=CARDS
  .filter(c=>c.category_id===cat.id)
  .sort((a,b)=>(b.market||0)-(a.market||0));

if(!cards.length) return;

const section=document.createElement("div");
section.className="section";

const pill=document.createElement("div");
pill.className="category-pill";
pill.textContent=cat.name;

const grid=document.createElement("div");
grid.className="grid";

cards.forEach(c=>{
const el=document.createElement("div");
el.className="card";
el.innerHTML=`
<img src="${c.image||""}">
<div class="price">${money(c.market)}</div>
`;
grid.appendChild(el);
});

section.appendChild(pill);
section.appendChild(grid);
container.appendChild(section);

});

}

/* ================= LOAD ================= */

async function loadData(){

const sb = window.auth? window.auth._client : null;
if(!sb) return;

const {data:cats}=await sb.from("buylist_categories").select("*");
CATEGORIES=cats||[];

const {data:cards}=await sb.from("buylist_cards").select("*");
CARDS=cards||[];

await Promise.all(CARDS.map(fetchMarket));

/* detect admin */
const {data:{session}}=await sb.auth.getSession();
if(session){
  const {data:role}=await sb
    .from("user_roles")
    .select("role")
    .eq("user_id",session.user.id)
    .single();

  if(role?.role==="admin"){
    IS_ADMIN=true;
    document.getElementById("adminToggleWrap").style.display="inline-block";
  }
}

render();
}

/* ================= CSV UPLOAD ================= */

document.getElementById("uploadCsvBtn")
.addEventListener("click", async () => {

  const fileInput = document.getElementById("csvFile");
  const status = document.getElementById("uploadStatus");

  if(!fileInput.files.length){
    status.textContent="Select a CSV file first.";
    return;
  }

  const file = fileInput.files[0];
  const text = await file.text();

  status.textContent="Uploading...";

  try{
    const sb = window.auth._client;
    const { data:{ session } } = await sb.auth.getSession();

    const res = await fetch(
      `${sb.supabaseUrl}/functions/v1/import-buylist`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":`Bearer ${session.access_token}`
        },
        body:JSON.stringify({ csv:text })
      }
    );

    const json = await res.json();

    if(res.ok){
      status.textContent=`Imported ${json.imported} cards.`;
      await loadData();
    }else{
      status.textContent="Error: "+JSON.stringify(json);
    }

  }catch(err){
    status.textContent="Upload failed.";
  }

});

/* ================= INIT ================= */

(async function(){
await fetchFX();
await loadData();
})();

document.getElementById("currencySelect")
.addEventListener("change",render);

document.getElementById("adminToggle")
?.addEventListener("change",function(){
  document.getElementById("adminUpload").style.display=
    this.checked && IS_ADMIN ? "block" : "none";
});

</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
