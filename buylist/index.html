<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buylist · B.C. Premodern Masters</title>

<link rel="icon" type="image/svg+xml" href="/assets/BCPMM.svg" />
<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>
.buylist-wrap {
  max-width: 1100px;
  margin: 6rem auto 4rem;
  padding: 0 1.5rem;
}

.back-link {
  display: inline-block;
  margin-bottom: 1.25rem;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--muted);
  text-decoration: none;
}

.back-link:hover {
  color: var(--fg);
  text-decoration: underline;
}

h1 { text-align:center; margin-bottom:0.25rem; }

.subtitle {
  text-align:center;
  color:var(--muted);
  margin-bottom:1.25rem;
}

/* SORT BAR */
.sort-bar {
  text-align:center;
  margin-bottom:1.5rem;
}

.sort-bar button {
  font-weight:700;
  padding:0.35rem 0.7rem;
  margin:0 0.25rem;
  border:1px solid var(--muted);
  background:transparent;
  cursor:pointer;
}

.sort-bar button.active {
  background:var(--fg);
  color:var(--bg);
}

/* GRID */
.card-grid {
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:18px;
}

.card-tile { text-align:center; }

.card-tile img {
  width:60px;   /* 1/8 size */
  height:auto;
  border-radius:6px;
  display:block;
  margin:0 auto;
}

.card-meta {
  margin-top:0.35rem;
  font-size:0.72rem;
}

.card-name { font-weight:700; }
.card-set { color:var(--muted); }
.card-price { font-weight:700; }

/* LIST */
table.buylist {
  width:100%;
  border-collapse:collapse;
}

.buylist th,
.buylist td {
  padding:0.5rem 0.75rem;
  border-bottom:1px solid var(--muted);
}

.buylist td.num { text-align:right; }

.hidden { display:none; }

@media(max-width:1000px){
  .card-grid{grid-template-columns:repeat(6,1fr);}
}
@media(max-width:700px){
  .card-grid{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="buylist-wrap">

<a href="/" class="back-link">← Back to main</a>

<h1>Buylist</h1>
<div class="subtitle">NM only · Prices in CAD</div>

<div class="sort-bar">
  Sort:
  <button data-sort="name" class="active">Name</button>
  <button data-sort="price">Price</button>
  <button data-sort="date">Set Release</button>
</div>

<div id="grid-view" class="card-grid"></div>

<table id="list-view" class="buylist hidden">
<thead>
<tr>
<th>#</th>
<th>Card</th>
<th>Set</th>
<th>Tag</th>
<th class="num">Price</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

/* =====================================================
   SOURCE DATA  (ONLY NAME + SET REQUIRED)
===================================================== */

const cards = [

{ name:"Intuition", set:"tmp", tag:"Tutor", price:200 },
{ name:"Survival of the Fittest", set:"wc98", tag:"Tutor", price:60 },
{ name:"Eladamri, Lord of Leaves", set:"tmp", tag:"Lord", price:60 },
{ name:"Aluren", set:"tmp", tag:"Combo", price:50 },
{ name:"Phyrexian Devourer", set:"all", tag:"Combo", price:40 },
{ name:"Powder Keg", set:"uds", tag:"Removal", price:30 },
{ name:"Squee, Goblin Nabob", set:"mmq", tag:"Recursion", price:25 },
{ name:"City of Brass", set:"chr", tag:"Land", price:20 },
{ name:"Recurring Nightmare", set:"wc98", tag:"Recursion", price:20 },
{ name:"Hermit Druid", set:"sth", tag:"Mill", price:12 },
{ name:"Engineered Plague", set:"ulg", tag:"Removal", price:8 },
{ name:"Elvish Champion", set:"inv", tag:"Lord", price:8 },
{ name:"Merchant Scroll", set:"hml", tag:"Tutor", price:5 },
{ name:"Karplusan Forest", set:"dkm", tag:"Land", price:5 },
{ name:"Underground River", set:"dkm", tag:"Land", price:5 },
{ name:"Elvish Spirit Guide", set:"all", tag:"Ramp", price:4 },
{ name:"Snow-Covered Forest", set:"ice", tag:"Land", price:3 },
{ name:"Snow-Covered Island", set:"ice", tag:"Land", price:3 },
{ name:"Snow-Covered Mountain", set:"ice", tag:"Land", price:3 },
{ name:"Snow-Covered Swamp", set:"ice", tag:"Land", price:3 },
{ name:"Snow-Covered Plains", set:"ice", tag:"Land", price:2 },
{ name:"Quirion Dryad", set:"pls", tag:"Creature", price:2 },
{ name:"Fyndhorn Elves", set:"ice", tag:"Creature", price:1 },
{ name:"Grim Lavamancer", set:"tor", tag:"Creature", price:12 },
{ name:"Academy Rector", set:"wc99", tag:"Tutor", price:150 },
{ name:"Shallow Grave", set:"mir", tag:"Recursion", price:25 },
{ name:"Deranged Hermit", set:"ulg", tag:"Creature", price:18 },
{ name:"Replenish", set:"uds", tag:"Recursion", price:120 },
{ name:"Humility", set:"tmp", tag:"Control", price:90 },
{ name:"Palinchron", set:"ulg", tag:"Combo", price:80 },
{ name:"Mind Over Matter", set:"exo", tag:"Combo", price:70 },
{ name:"Lotus Vale", set:"wth", tag:"Land", price:40 },
{ name:"Abeyance", set:"wth", tag:"Control", price:15 },
{ name:"Krovikan Horror", set:"all", tag:"Recursion", price:10 },
{ name:"Volrath’s Shapeshifter", set:"sth", tag:"Combo", price:35 },
{ name:"Opalescence", set:"uds", tag:"Combo", price:60 },
{ name:"Meditate", set:"tmp", tag:"Draw", price:20 },
{ name:"Sarcomancy", set:"tmp", tag:"Enchantment", price:12 }

];

let enriched = [];

/* =====================================================
   FETCH SCRYFALL DATA (SET NAME + DATE + IMAGE)
===================================================== */

async function enrichCards() {
  for (let card of cards) {
    const q = encodeURIComponent(`!"${card.name}" set:${card.set}`);
    const res = await fetch(`https://api.scryfall.com/cards/search?q=${q}`);
    const data = await res.json();
    const c = data.data[0];

    enriched.push({
      ...card,
      image: c.image_uris?.small,
      setName: c.set_name,
      collector: c.collector_number,
      release: new Date(c.released_at)
    });
  }

  render();
}

function render() {
  renderGrid();
  renderList();
}

/* =====================================================
   GRID
===================================================== */

function renderGrid() {
  const grid = document.getElementById("grid-view");
  grid.innerHTML = "";

  enriched.forEach(card => {
    const tile = document.createElement("div");
    tile.className="card-tile";

    tile.innerHTML = `
      <img src="${card.image}" />
      <div class="card-meta">
        <div class="card-name">${card.name}</div>
        <div class="card-set">${card.setName} · #${card.collector}</div>
        <div>${card.tag}</div>
        <div class="card-price">$${card.price}</div>
      </div>
    `;

    grid.appendChild(tile);
  });
}

/* =====================================================
   LIST
===================================================== */

function renderList() {
  const body = document.querySelector("#list-view tbody");
  body.innerHTML="";

  enriched.forEach((card,i)=>{
    body.insertAdjacentHTML("beforeend",`
      <tr>
        <td>${i+1}</td>
        <td>${card.name}</td>
        <td>${card.setName}</td>
        <td>${card.tag}</td>
        <td class="num">$${card.price}</td>
      </tr>
    `);
  });
}

/* =====================================================
   SORTING
===================================================== */

document.querySelectorAll(".sort-bar button").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".sort-bar button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    const type = btn.dataset.sort;

    if(type==="name"){
      enriched.sort((a,b)=>a.name.localeCompare(b.name));
    }
    if(type==="price"){
      enriched.sort((a,b)=>b.price-a.price);
    }
    if(type==="date"){
      enriched.sort((a,b)=>a.release-b.release);
    }

    render();
  };
});

enrichCards();

</script>

<script src="/js/bcpmm-shell.js"></script>
</body>
</html>
