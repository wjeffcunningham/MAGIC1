<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buylist · BCPMM</title>
<link rel="stylesheet" href="/css/bcpmm-shell.css" />

<style>
* { box-sizing: border-box; }

.buylist-wrap {
  max-width: 1100px;
  margin: 4rem auto;
  padding: 0 1.5rem;
}

/* ===== CATEGORY ===== */

.section {
  margin-top: 3.5rem;
}

.section h2 {
  font-size: 1.1rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.4rem;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.note-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

/* ===== STACKED CARD ROW ===== */

.stack {
  display: flex;
  align-items: flex-start;
}

.card {
  width: 115px;
  position: relative;
  transition: transform 0.15s ease;
}

.card:not(:first-child) {
  margin-left: -30px;
}

.card:hover {
  transform: translateY(-6px);
  z-index: 10;
}

.card img {
  width: 100%;
  border-radius: 6px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}

.price {
  text-align: center;
  font-size: 0.75rem;
  margin-top: 0.25rem;
}

.card-note-indicator {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

/* ===== NOTE PANEL ===== */

.note-panel {
  margin-top: 0.75rem;
  font-size: 0.85rem;
  opacity: 0.85;
  display: none;
}

.note-panel.active {
  display: block;
}
</style>
</head>

<body>
<div class="buylist-wrap">
<div id="content">Loading...</div>
</div>

<script>

let CARDS = [];

const CATEGORY_ORDER = [
  "Reserved List Picks",
  "One-print Art",
  "Premodern-legal FNM Foils",
  "Hot staples",
  "Snow-covered Lands",
  "Foils of undervalued cards",
  "GoldBorder picks",
  "Mirrodin picks",
  "Alliances picks",
  "Slivers",
  "Ancillary picks",
  "Other"
];

const ONE_PRINT_ART = new Set([
  "Squee, Goblin Nabob",
  "Grim Lavamancer",
  "Quirion Dryad"
]);

function isFNMFoil(card) {
  const set = (card.set || "").toLowerCase();
  const mod = (card.modifier || "").toLowerCase();
  return set.startsWith("f0") || (set.startsWith("f") && mod.includes("foil"));
}

function shouldHide(card) {
  const isFoil = (card.modifier || "").toLowerCase().includes("foil");
  if (isFoil && !isFNMFoil(card)) return true;
  return false;
}

function assignCategory(card) {
  if (card.reserved) return "Reserved List Picks";
  if (ONE_PRINT_ART.has(card.name)) return "One-print Art";
  if (card.name.includes("Snow-Covered")) return "Snow-covered Lands";
  if (card.types.includes("Sliver")) return "Slivers";
  return "Ancillary picks";
}

function fmt(n) {
  if (!Number.isFinite(n)) return "—";
  return "$" + n.toFixed(2);
}

async function fetchMarket(card) {
  const res = await fetch("https://api.scryfall.com/cards/" + card.scryfall_id);
  const data = await res.json();

  const prices = [];
  ["usd","usd_foil","usd_etched"].forEach(k=>{
    const v = parseFloat(data.prices[k]);
    if (!isNaN(v)) prices.push(v);
  });

  prices.sort((a,b)=>a-b);

  const min = prices[0] || 0;
  const max = prices[prices.length-1] || 0;
  const mid = prices.length ? (min + max)/2 : 0;

  card.market = mid;
  card.reserved = data.reserved;
  card.image = data.image_uris?.small ||
               data.card_faces?.[0]?.image_uris?.small;
}

function group(cards) {
  const map = new Map();
  CATEGORY_ORDER.forEach(c=>map.set(c,[]));

  cards.forEach(card=>{
    if (shouldHide(card)) return;
    card.category = assignCategory(card);
    if (!map.has(card.category)) map.set(card.category,[]);
    map.get(card.category).push(card);
  });

  for (let arr of map.values()) {
    arr.sort((a,b)=>b.market - a.market);
  }

  return map;
}

function render() {
  const container = document.getElementById("content");
  container.innerHTML = "";

  const groups = group(CARDS);

  CATEGORY_ORDER.forEach(cat=>{
    const list = groups.get(cat);
    if (!list || !list.length) return;

    const section = document.createElement("div");
    section.className="section";

    const header = document.createElement("h2");
    header.innerHTML = cat;
    section.appendChild(header);

    const stack = document.createElement("div");
    stack.className="stack";

    list.forEach(c=>{
      const card = document.createElement("div");
      card.className="card";
      card.innerHTML = `
        <img src="${c.image || ''}">
        <div class="price">${fmt(c.market)}</div>
      `;
      stack.appendChild(card);
    });

    section.appendChild(stack);
    container.appendChild(section);
  });
}

(async function init(){
  const res = await fetch("cards.json");
  CARDS = await res.json();

  await Promise.all(CARDS.map(c => fetchMarket(c)));

  render();
})();
</script>
</body>
</html>
