<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buylist · B.C. Premodern Masters</title>

<link rel="icon" type="image/svg+xml" href="/assets/BCPMM.svg" />
<link rel="stylesheet" href="/css/bcpmm-shell.css" />

<style>
.buylist-wrap {
  max-width: 1100px;
  margin: 2.5rem auto 3rem;
  padding: 0 1.25rem;
}

.back-link {
  display: inline-block;
  margin-bottom: 1rem;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--muted);
  text-decoration: none;
}

.back-link:hover {
  color: var(--fg);
  text-decoration: underline;
}

h1 { text-align:center; margin-bottom:0.25rem; }

.subtitle {
  text-align:center;
  color:var(--muted);
  margin-bottom:0.15rem;
  font-size:0.9rem;
}

.note {
  text-align:center;
  font-size:0.8rem;
  color:var(--muted);
  margin-bottom:0.25rem;
}

.edition-flag {
  text-align:center;
  font-size:0.75rem;
  color:var(--muted);
  margin-bottom:1rem;
}

.section-title {
  margin:1.75rem 0 0.75rem;
  font-size:1rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.5px;
  border-bottom:1px solid var(--muted);
  padding-bottom:0.3rem;
}

.view-bar {
  text-align:center;
  margin-bottom:1rem;
}

.view-bar button {
  font-weight:700;
  padding:0.3rem 0.65rem;
  margin:0 0.25rem;
  border:1px solid var(--muted);
  background:transparent;
  cursor:pointer;
  font-size:0.85rem;
}

.view-bar button.active {
  background:var(--fg);
  color:var(--bg);
}

/* 1/4 width grid */
.card-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card-tile {
  text-align:center;
  padding:6px 4px;
}

.card-tile img {
  width:48px;
  height:auto;
  border-radius:6px;
  display:block;
  margin:0 auto 0.25rem;
}

.card-meta {
  font-size:0.68rem;
  line-height:1.2;
}

.card-name { font-weight:700; }
.card-price { font-weight:700; }

.market {
  font-size:0.65rem;
  color:var(--muted);
}

.arrow-up { color:green; font-weight:700; }
.arrow-down { color:red; font-weight:700; }

table.buylist {
  width:100%;
  border-collapse:collapse;
  font-size:0.85rem;
}

.buylist th,
.buylist td {
  padding:0.4rem 0.65rem;
  border-bottom:1px solid var(--muted);
}

.buylist th.sortable { cursor:pointer; }

.hidden { display:none; }

.footer-email {
  margin-top:2rem;
  text-align:center;
  font-size:0.85rem;
  color:var(--muted);
}

/* Responsive adjustments */
@media (max-width:1000px){
  .card-grid { grid-template-columns:repeat(3,1fr); }
}

@media (max-width:700px){
  .card-grid { grid-template-columns:repeat(2,1fr); }
}
</style>
</head>

<body>
<div class="buylist-wrap">

<a href="/" class="back-link">← Back to main</a>

<h1>Buylist</h1>
<div class="subtitle">NM only · Prices in CAD</div>
<div class="note">Also buying Premodern legal Full Art Promos, FNM foils.</div>
<div class="edition-flag">Feb 12 Update</div>

<div class="view-bar">
  View:
  <button id="tile-btn" class="active" type="button">Tile</button>
  <button id="list-btn" type="button">List</button>
</div>

<div class="section-title">Reserved List Buys</div>
<div id="reserved-grid" class="card-grid"></div>

<div class="section-title">All Other Buys</div>
<div id="normal-grid" class="card-grid"></div>

<table id="list-view" class="buylist hidden">
  <thead>
    <tr>
      <th>#</th>
      <th>Card</th>
      <th>Set</th>
      <th id="price-header" class="sortable">Buy Price ↓</th>
      <th>Market (USD)</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="footer-email">
  Contact: <a href="mailto:bcpremodermasters@gmail.com">bcpremodermasters@gmail.com</a>
</div>

</div>

<script>
const cards = [

  { name:"Intuition", set:"tmp" },
  { name:"Survival of the Fittest", set:"wc98" },
  { name:"Recurring Nightmare", set:"wc98" },
  { name:"Humility", set:"tmp" },
  { name:"Palinchron", set:"ulg" },
  { name:"Mind Over Matter", set:"exo" },
  { name:"Lotus Vale", set:"wth" },
  { name:"Aluren", set:"tmp" },
  { name:"Squee, Goblin Nabob", set:"mmq" },
  { name:"Engineered Plague", set:"ulg" },
  { name:"Hermit Druid", set:"shg" },

  // Snow lands bundled
  {
    group:"Snow-Covered Lands",
    override:3,
    members:[
      { name:"Snow-Covered Forest", set:"ice" },
      { name:"Snow-Covered Island", set:"ice" },
      { name:"Snow-Covered Mountain", set:"ice" },
      { name:"Snow-Covered Swamp", set:"ice" },
      { name:"Snow-Covered Plains", set:"ice" }
    ]
  }

];

let enriched = [];
let listSortDesc = true;

async function enrichCards(){
  enriched = [];

  for (let card of cards){

    if (card.group){
      enriched.push({
        name: card.group,
        group: true,
        buyPrice: card.override,
        market: null,
        reserved: false
      });
      continue;
    }

    const url = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card.name)}&set=${card.set}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.object === "error") continue;

    const marketRaw = parseFloat(data.prices.usd || 0);
    const market = Math.round(marketRaw);
    const rulePrice = Math.round(market * 0.80);

    const override = card.override ?? null;
    const buyPrice = override ?? rulePrice;

    let arrow = "";
    if (override !== null){
      if (override > rulePrice) arrow = "<span class='arrow-up'>▲</span>";
      if (override < rulePrice) arrow = "<span class='arrow-down'>▼</span>";
    }

    enriched.push({
      name: card.name,
      setName: data.set_name,
      image: data.image_uris?.small ?? "",
      reserved: data.reserved,
      market,
      buyPrice,
      arrow
    });
  }

  renderTile();
  renderList();
}

function renderTile(){
  const reservedGrid = document.getElementById("reserved-grid");
  const normalGrid = document.getElementById("normal-grid");

  reservedGrid.innerHTML = "";
  normalGrid.innerHTML = "";

  const reserved = enriched.filter(c=>c.reserved).sort((a,b)=>b.buyPrice-a.buyPrice);
  const normal = enriched.filter(c=>!c.reserved).sort((a,b)=>b.buyPrice-a.buyPrice);

  function draw(group, target){
    group.forEach(card=>{
      if (card.group){
        target.insertAdjacentHTML("beforeend",`
          <div class="card-tile">
            <div class="card-meta">
              <div class="card-name">${card.name}</div>
              <div class="card-price">$${card.buyPrice} CAD each</div>
              <div class="market">5 Ice Age Snow Basics</div>
            </div>
          </div>
        `);
      } else {
        target.insertAdjacentHTML("beforeend",`
          <div class="card-tile">
            <a href="https://scryfall.com/search?q=${encodeURIComponent(card.name)}" target="_blank" rel="noopener">
              <img src="${card.image}" alt="${card.name}">
            </a>
            <div class="card-meta">
              <div class="card-name">${card.name}</div>
              <div class="card-price">$${card.buyPrice} ${card.arrow}</div>
              <div class="market">Market: $${card.market}</div>
            </div>
          </div>
        `);
      }
    });
  }

  draw(reserved, reservedGrid);
  draw(normal, normalGrid);
}

function renderList(){
  const body = document.querySelector("#list-view tbody");
  body.innerHTML = "";

  const sorted = [...enriched].sort((a,b)=>listSortDesc ? b.buyPrice-a.buyPrice : a.buyPrice-b.buyPrice);

  sorted.forEach((card,i)=>{
    body.insertAdjacentHTML("beforeend",`
      <tr>
        <td>${i+1}</td>
        <td>${card.name}</td>
        <td>${card.setName ?? ""}</td>
        <td>$${card.buyPrice} ${card.arrow ?? ""}</td>
        <td>${card.market ?? ""}</td>
      </tr>
    `);
  });
}

document.getElementById("price-header").onclick = () => {
  listSortDesc = !listSortDesc;
  document.getElementById("price-header").textContent = listSortDesc ? "Buy Price ↓" : "Buy Price ↑";
  renderList();
};

document.getElementById("tile-btn").onclick = () => {
  document.getElementById("tile-btn").classList.add("active");
  document.getElementById("list-btn").classList.remove("active");
  document.getElementById("reserved-grid").classList.remove("hidden");
  document.getElementById("normal-grid").classList.remove("hidden");
  document.getElementById("list-view").classList.add("hidden");
};

document.getElementById("list-btn").onclick = () => {
  document.getElementById("list-btn").classList.add("active");
  document.getElementById("tile-btn").classList.remove("active");
  document.getElementById("reserved-grid").classList.add("hidden");
  document.getElementById("normal-grid").classList.add("hidden");
  document.getElementById("list-view").classList.remove("hidden");
};

enrichCards();
</script>

</body>
</html>
