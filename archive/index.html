<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archive · B.C. Premodern Masters</title>

<link rel="icon" type="image/svg+xml" href="/assets/BCPMM.svg" />
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700;800&display=swap" rel="stylesheet">

<!-- GLOBAL SHELL (theme + menu) -->
<link rel="stylesheet" href="/css/bcpmm-shell.css" />

<style>
/* =====================================================
   ARCHIVE PAGE STYLES (THEME-AWARE)
===================================================== */
body {
  background: var(--bg);
  color: var(--fg);
  text-align: center;
}

.archive-wrap {
  max-width: 720px;
  margin: 6rem auto 4rem;
  padding: 0 1.75rem;
}

.logo-large {
  width: 100%;
  max-width: var(--logo-width);
  height: auto;
  margin: 0 auto 24px;
  display: block;
}

h1 {
  font-size: 2.6em;
  font-weight: 800;
  letter-spacing: 1.5px;
  margin: 0 0 36px;
  text-transform: uppercase;
}

.archive-links a {
  display: block;
  margin: 22px 0;
  font-size: 1.25em;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  text-decoration: none;
  color: inherit;
}

.archive-links a:hover {
  text-decoration: underline;
}

.back-link {
  margin-top: 50px;
  opacity: 0.7;
  color: var(--muted);
}

.back-link a {
  color: inherit;
  text-decoration: none;
}

.back-link a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<!-- GLOBAL MENU ROOT -->
<div id="global-menu-root"></div>

<!-- ARCHIVE CONTENT -->
<div class="archive-wrap">
  <img src="/assets/BCPMM.svg" class="logo-large" alt="BC Premodern Masters logo" />

  <h1>Archive</h1>

  <div class="archive-links">
    <a href="/bcpmm/flyers/">Posters &amp; Flyers</a>
    <a href="/bcpmm/BCPMM_coverage.html">BCPMM Coverage</a>
  </div>

  <div class="back-link">
    <a href="/">← Back to main</a>
  </div>
</div>

<!-- GLOBAL SHELL LOGIC -->
<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
