<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archive · B.C. Premodern Masters</title>

<link rel="icon" type="image/svg+xml" href="/assets/BCPMM.svg" />

<!-- KEFA fallback via Alegreya -->
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700;800&display=swap" rel="stylesheet">

<style>
/* =====================================================
   BASE THEME (shared with index)
===================================================== */
:root {
  --bg: #ffffff;
  --fg: #000000;
  --muted: #666;
}

body.dark {
  --bg: #111111;
  --fg: #f4f4f4;
  --muted: #aaa;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Kefa", "Alegreya", serif;
  text-align: center;
  transition: background 0.25s ease, color 0.25s ease;
}

/* =====================================================
   MENU
===================================================== */
.menu-button {
  position: fixed;
  top: 16px;
  right: 18px;
  font-size: 26px;
  cursor: pointer;
  user-select: none;
  z-index: 1001;
}

.menu-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 240px;
  height: 100vh;
  background: var(--bg);
  padding: 24px 20px;
  box-sizing: border-box;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  z-index: 1002;
}

.menu-panel.open {
  transform: translateX(0);
}

.menu-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.menu-header h4 {
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.menu-close {
  font-size: 22px;
  cursor: pointer;
}

.menu-item {
  margin-top: 28px;
  font-size: 22px;
  cursor: pointer;
}

/* overlay */
.menu-overlay {
  position: fixed;
  inset: 0;
  background: transparent;
  display: none;
  z-index: 1000;
}

.menu-overlay.active {
  display: block;
}

/* =====================================================
   ARCHIVE CONTENT
===================================================== */
.archive-wrap {
  max-width: 720px;
  margin: 140px auto 80px;
  padding: 0 28px;
}

.logo-small {
  max-width: 180px;
  margin: 0 auto 30px;
  display: block;
}

.logo-large {
  max-width: 280px;
  margin: 20px auto 30px;
  display: block;
}

h1 {
  font-size: 2.4em;
  font-weight: 800;
  letter-spacing: 1.4px;
  margin-bottom: 36px;
  text-transform: uppercase;
}

.archive-links a {
  display: block;
  margin: 22px 0;
  font-size: 1.25em;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  text-decoration: none;
  color: inherit;
}

.archive-links a:hover {
  text-decoration: underline;
}

.back-link {
  margin-top: 50px;
  font-size: 0.95em;
  opacity: 0.7;
}

.back-link a {
  color: inherit;
  text-decoration: none;
}

.back-link a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<!-- MENU BUTTON -->
<div class="menu-button" id="menu-btn">☰</div>

<!-- OVERLAY -->
<div class="menu-overlay" id="menu-overlay"></div>

<!-- MENU PANEL -->
<div class="menu-panel" id="menu-panel">
  <div class="menu-header">
    <h4>Menu</h4>
    <div class="menu-close" id="menu-close">✕</div>
  </div>

  <div class="menu-item" id="toggle-theme" title="Toggle light/dark">
    🌙
  </div>
</div>

<!-- ARCHIVE -->
<div class="archive-wrap">
  <img src="/assets/BCPMM.svg" class="logo-large" alt="BC Premodern Masters logo" />

  <h1>Archive</h1>

  <div class="archive-links">
    <a href="/bcpmm/flyers/">Posters &amp; Flyers</a>
    <a href="/bcpmm/BCPMM_coverage.html">BCPMM Coverage</a>
  </div>

  <div class="back-link">
    <a href="/">← Back to main</a>
  </div>
</div>

<script>
/* =====================================================
   MENU LOGIC
===================================================== */
const menuBtn = document.getElementById("menu-btn");
const menuPanel = document.getElementById("menu-panel");
const menuClose = document.getElementById("menu-close");
const overlay = document.getElementById("menu-overlay");

function openMenu() {
  menuPanel.classList.add("open");
  overlay.classList.add("active");
}

function closeMenu() {
  menuPanel.classList.remove("open");
  overlay.classList.remove("active");
}

menuBtn.addEventListener("click", openMenu);
menuClose.addEventListener("click", closeMenu);
overlay.addEventListener("click", closeMenu);

/* =====================================================
   THEME TOGGLE (shared)
===================================================== */
const toggleTheme = document.getElementById("toggle-theme");

function updateThemeIcon() {
  toggleTheme.textContent =
    document.body.classList.contains("dark") ? "☀️" : "🌙";
}

toggleTheme.addEventListener("click", () => {
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "bcpmm-theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
  updateThemeIcon();
});

/* =====================================================
   LOAD SAVED THEME
===================================================== */
(() => {
  const saved = localStorage.getItem("bcpmm-theme");
  if (saved === "dark") document.body.classList.add("dark");
  updateThemeIcon();
})();
</script>

</body>
</html>
