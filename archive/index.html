<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archive · B.C. Premodern Masters</title>

<link rel="icon" type="image/svg+xml" href="/assets/BCPMM.svg" />
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #ffffff;
  --fg: #000000;
  --muted: #666;
  --logo-width: 320px;
}

body.dark {
  --bg: #111111;
  --fg: #f4f4f4;
  --muted: #aaa;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Kefa", "Alegreya", serif;
  text-align: center;
  transition: background 0.25s ease, color 0.25s ease;
}

.menu-button {
  position: fixed;
  top: 16px;
  right: 18px;
  font-size: 26px;
  cursor: pointer;
}

.menu-panel {
  position: fixed;
  right: 0;
  top: 0;
  width: 240px;
  height: 100vh;
  background: var(--bg);
  padding: 24px 20px;
  transform: translateX(100%);
  transition: transform 0.25s ease;
}

.menu-panel.open {
  transform: translateX(0);
}

.menu-overlay {
  position: fixed;
  inset: 0;
  display: none;
}

.menu-overlay.active {
  display: block;
}

.archive-wrap {
  max-width: 720px;
  margin: 140px auto 80px;
  padding: 0 28px;
}

.logo-large {
  width: 100%;
  max-width: var(--logo-width);
  height: auto;
  margin: 0 auto 24px;
  display: block;
}

h1 {
  font-size: 2.4em;
  font-weight: 800;
  margin-bottom: 36px;
  text-transform: uppercase;
}

.archive-links a {
  display: block;
  margin: 22px 0;
  font-size: 1.25em;
  font-weight: 800;
  text-transform: uppercase;
  text-decoration: none;
  color: inherit;
}

.archive-links a:hover {
  text-decoration: underline;
}

.back-link {
  margin-top: 50px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="menu-button" id="menu-btn">☰</div>
<div class="menu-overlay" id="menu-overlay"></div>

<div class="menu-panel" id="menu-panel">
  <div style="display:flex;justify-content:space-between;">
    <strong>Menu</strong>
    <span id="menu-close" style="cursor:pointer;">✕</span>
  </div>
  <div id="toggle-theme" style="margin-top:28px;cursor:pointer;">🌙</div>
</div>

<div class="archive-wrap">
  <img src="/assets/BCPMM.svg" class="logo-large" alt="BC Premodern Masters logo" />
  <h1>Archive</h1>

  <div class="archive-links">
    <a href="/bcpmm/flyers/">Posters &amp; Flyers</a>
    <a href="/bcpmm/BCPMM_coverage.html">BCPMM Coverage</a>
  </div>

  <div class="back-link">
    <a href="/">← Back to main</a>
  </div>
</div>

<script>
const btn = document.getElementById("menu-btn");
const panel = document.getElementById("menu-panel");
const close = document.getElementById("menu-close");
const overlay = document.getElementById("menu-overlay");
const toggle = document.getElementById("toggle-theme");

btn.onclick = () => { panel.classList.add("open"); overlay.classList.add("active"); };
close.onclick = overlay.onclick = () => { panel.classList.remove("open"); overlay.classList.remove("active"); };

function syncIcon() {
  toggle.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
}

toggle.onclick = () => {
  document.body.classList.toggle("dark");
  localStorage.setItem("bcpmm-theme", document.body.classList.contains("dark") ? "dark" : "light");
  syncIcon();
};

(() => {
  if (localStorage.getItem("bcpmm-theme") === "dark") document.body.classList.add("dark");
  syncIcon();
})();
</script>

</body>
</html>
