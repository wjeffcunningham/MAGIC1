<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>League Join · B.C. Premodern Masters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Global shell (menu + theme) -->
  <link rel="stylesheet" href="/css/bcpmm-shell.css" />

  <style>
    body {
      background: var(--bg);
      color: var(--fg);
    }

    .wrap {
      max-width: 900px;
      margin: 7rem auto 5rem;
      padding: 0 1.5rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 0.04em;
    }

    .sub {
      color: var(--muted);
      max-width: 65ch;
      margin: 0 auto 3rem;
      line-height: 1.5;
      font-size: 1.05rem;
    }

    .divider {
      width: 120px;
      height: 1px;
      background: var(--muted);
      margin: 2.5rem auto;
      opacity: 0.6;
    }

    .soon {
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-size: 0.9rem;
      opacity: 0.85;
    }

    .links {
      margin-top: 3rem;
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .links a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      opacity: 0.85;
    }

    .links a:hover {
      border-bottom-color: currentColor;
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- GLOBAL MENU ROOT -->
  <div id="global-menu-root"></div>

  <main class="wrap">
    <h1>League Join</h1>

    <p class="sub">
      Registration, onboarding, and league participation details for
      <strong>B.C. Premodern Masters</strong> will live here.
      <br /><br />
      For now, coordination happens through the league’s existing channels.
    </p>

    <div class="divider"></div>

    <div class="soon">Coming Soon</div>

    <div class="links">
      <a href="/leaguetracker/">League Tracker</a>
      <a href="/">Main Page</a>
    </div>
  </main>

  <!-- Global shell logic -->
  <script src="/js/bcpmm-shell.js"></script>
</body>
</html>
