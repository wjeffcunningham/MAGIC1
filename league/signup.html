<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up · BCWL · magic1.ca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="poster" style="max-width:520px; margin-top:40px;">
  <h1>Create Account</h1>

  <p style="opacity:.8; font-size:.9em;">
    Use the same email you used when registering at Stronghold or Connection.
  </p>

  <div id="signup-box">Loading…</div>
  <div id="signup-msg" style="margin-top:15px; font-weight:700;"></div>
</div>

<script type="module">
import { supabase } from "./js/supabase.js";
import { saveLocalSession } from "./js/session.js";

const box = document.getElementById("signup-box");
const msg = document.getElementById("signup-msg");

// Build signup form
box.innerHTML = `
  <label>Full Name</label><br>
  <input id="full_name" placeholder="Your Name"><br><br>

  <label>Email</label><br>
  <input id="email" type="email" placeholder="you@example.com"><br><br>

  <label>Password</label><br>
  <input id="password" type="password" placeholder="At least 8 characters"><br><br>

  <label>Confirm Password</label><br>
  <input id="password2" type="password" placeholder="Re-enter password"><br><br>

  <label>Home Store</label><br>
  <select id="home_store">
    <option value="stronghold">Stronghold Games (Boundary & Kingsway)</option>
    <option value="connection">The Connection Games (Renfrew)</option>
    <option value="freelancer">Freelancer</option>
    <option value="remote_only">Remote Only</option>
  </select>
  <br><br>

  <div id="remote-extra" style="display:none; margin-bottom:10px;">
    <label>If Remote Only, choose formats:</label><br>
    <input type="checkbox" id="remote_mtgo"> MTGO<br>
    <input type="checkbox" id="remote_webcam"> Webcam<br>
  </div>
  <br>

  <button id="signup-btn">Create Account</button>
`;

// Show MTGO/Webcam if remote_only
document.getElementById("home_store").addEventListener("change", (e) => {
  const show = e.target.value === "remote_only";
  document.getElementById("remote-extra").style.display = show ? "block" : "none";
});

document.getElementById("signup-btn").onclick = async () => {
  msg.textContent = "Creating account…";

  const full_name = document.getElementById("full_name").value.trim();
  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("password").value;
  const pw2 = document.getElementById("password2").value;

  const home_store = document.getElementById("home_store").value;
  const remote_mtgo = document.getElementById("remote_mtgo").checked;
  const remote_webcam = document.getElementById("remote_webcam").checked;

  if (!full_name || !email || !pw || !pw2) {
    msg.textContent = "Please fill out all fields.";
    return;
  }
  if (pw !== pw2) {
    msg.textContent = "Passwords do not match.";
    return;
  }

  // Create auth user
  const { data: authData, error: authErr } = await supabase.auth.signUp({
    email,
    password: pw,
  });

  if (authErr || !authData.user) {
    msg.textContent = authErr?.message || "Could not create account.";
    return;
  }

  const authUserId = authData.user.id;

  // Create pending player row
  const { data: player, error: pErr } = await supabase
    .from("players")
    .insert({
      full_name,
      email,
      auth_user_id: authUserId,
      home_store,
      remote_mtgo,
      remote_webcam,
      status: "pending",
    })
    .select()
    .single();

  if (pErr) {
    msg.textContent = "Database error creating player.";
    return;
  }

  // Save local session
  saveLocalSession({
    playerId: player.id,
    fullName: player.full_name,
    username: player.username || "(no username)",
    isAdmin: player.is_admin === true,
    authUserId,
    expires: Date.now() + 30 * 24 * 3600 * 1000, // 30 days
  });

  // Redirect to waiting page
  window.location.href = "/awaiting-approval.html";
};
</script>

</body>
</html>
