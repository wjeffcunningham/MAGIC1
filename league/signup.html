<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join the League · B.C. Premodern Masters</title>

<style>
  body {
    margin: 0;
    padding: 30px 16px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #fff;
    color: #000;
    text-align: center;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
  }

  h1 {
    font-size: 2.3em;
    margin-bottom: 0.2em;
  }

  p {
    font-size: 1.05em;
    line-height: 1.5;
    margin: 0.4em 0;
  }

  form {
    margin-top: 1.4em;
    text-align: left;
  }

  label {
    display: block;
    font-size: 0.95em;
    font-weight: 600;
    margin: 0.8em 0 0.2em;
  }

  input[type="text"],
  input[type="email"],
  select {
    width: 100%;
    padding: 8px 10px;
    font-size: 1em;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
  }

  .checkbox-row {
    margin-top: 0.8em;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95em;
  }

  button {
    margin-top: 1.3em;
    padding: 10px 18px;
    font-size: 1.05em;
    font-weight: 700;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .status {
    margin-top: 1em;
    font-size: 0.95em;
  }

  .status.error { color: #b00020; }
  .status.ok { color: #007700; }
</style>
</head>
<body>
<div class="container">
  <h1>Join the B.C. Winter League</h1>
  <p>Premodern Constructed · January–March · Pods of 8.</p>
  <p>You must be 18+ and have a magic1.ca account to join.</p>

  <form id="signup-form">
    <label for="full-name">Full Name (for standings)</label>
    <input id="full-name" type="text" required />

    <label for="email">Email (must match your login)</label>
    <input id="email" type="email" required />

    <label for="home-store">Home Store / Home Base</label>
    <input id="home-store" type="text" placeholder="e.g. Magic Stronghold, Remote" />

    <label for="remote-pref">Remote Preference</label>
    <select id="remote-pref" required>
      <option value="remote_ok">Remote OK</option>
      <option value="remote_only">Remote Only</option>
      <option value="no_remote">No Remote</option>
    </select>

    <label for="play-style">Play Style</label>
    <select id="play-style" required>
      <option value="competitive">Competitive</option>
      <option value="casual">Casual</option>
    </select>

    <div class="checkbox-row">
      <input id="agree" type="checkbox" required />
      <label for="agree" style="margin:0;">I am 18+ and agree to the league rules.</label>
    </div>

    <button type="submit" id="submit-btn">Submit for Approval</button>

    <div id="status" class="status"></div>
  </form>
</div>

<script type="module">
import { supabase } from "/js/supabase.js";

const form = document.getElementById("signup-form");
const statusEl = document.getElementById("status");
const submitBtn = document.getElementById("submit-btn");

async function requireUser() {
  const { data, error } = await supabase.auth.getUser();
  if (error || !data?.user) {
    window.location.href = "/login.html";
    return null;
  }
  return data.user;
}

async function getActiveSeasonId() {
  const today = new Date().toISOString().slice(0, 10); // yyyy-mm-dd

  // 1. Season in progress
  let { data: active, error } = await supabase
    .from("league_seasons")
    .select("id, start_date, end_date")
    .lte("start_date", today)
    .gte("end_date", today)
    .order("start_date", { ascending: true })
    .limit(1);

  if (!error && active && active.length > 0) return active[0].id;

  // 2. Next upcoming season
  let { data: upcoming, error: err2 } = await supabase
    .from("league_seasons")
    .select("id, start_date")
    .gt("start_date", today)
    .order("start_date", { ascending: true })
    .limit(1);

  if (!err2 && upcoming && upcoming.length > 0) return upcoming[0].id;

  // 3. Fallback: most recent season
  let { data: recent, error: err3 } = await supabase
    .from("league_seasons")
    .select("id, end_date")
    .order("end_date", { ascending: false })
    .limit(1);

  if (!err3 && recent && recent.length > 0) return recent[0].id;

  return null;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  statusEl.textContent = "";
  statusEl.className = "status";
  submitBtn.disabled = true;

  const user = await requireUser();
  if (!user) return;

  const fullName = (document.getElementById("full-name").value || "").trim();
  const email = (document.getElementById("email").value || "").trim().toLowerCase();
  const homeStore = (document.getElementById("home-store").value || "").trim();
  const remotePref = document.getElementById("remote-pref").value;
  const playStyle = document.getElementById("play-style").value;

  if (!fullName || !email) {
    statusEl.textContent = "Please fill in your name and email.";
    statusEl.classList.add("error");
    submitBtn.disabled = false;
    return;
  }

  if (email !== (user.email || "").toLowerCase()) {
    statusEl.textContent = "Email must match your login email.";
    statusEl.classList.add("error");
    submitBtn.disabled = false;
    return;
  }

  const seasonId = await getActiveSeasonId();
  if (!seasonId) {
    statusEl.textContent = "No league season configured. Contact the organizer.";
    statusEl.classList.add("error");
    submitBtn.disabled = false;
    return;
  }

  // Upsert player by email
  const { data: playerRow, error: playerErr } = await supabase
    .from("players")
    .upsert({
      full_name: fullName,
      email,
      home_store: homeStore,
      remote_preference: remotePref,
      play_style: playStyle
    }, { onConflict: "email" })
    .select("id")
    .single();

  if (playerErr || !playerRow) {
    console.error(playerErr);
    statusEl.textContent = "Error saving player profile.";
    statusEl.classList.add("error");
    submitBtn.disabled = false;
    return;
  }

  const playerId = playerRow.id;

  // Insert/Upsert signup as waiting_list
  const { error: signupErr } = await supabase
    .from("league_signups")
    .upsert({
      season_id: seasonId,
      player_id: playerId,
      status: "waiting_list"
    }, { onConflict: "season_id,player_id" });

  if (signupErr) {
    console.error(signupErr);
    statusEl.textContent = "Error submitting for approval.";
    statusEl.classList.add("error");
    submitBtn.disabled = false;
    return;
  }

  // Sync local state to avoid stale menus
  localStorage.setItem("loggedIn", "true");
  localStorage.setItem("inLeague", "false");

  statusEl.textContent = "Submitted. Your signup is pending moderator approval.";
  statusEl.classList.add("ok");

  setTimeout(() => {
    window.location.href = "/profile.html";
  }, 900);
});

// Prefill email if possible
(async () => {
  const user = await requireUser();
  if (user?.email) {
    document.getElementById("email").value = user.email;
  }
})();
</script>
</body>
</html>
