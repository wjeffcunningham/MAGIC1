<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join the League · magic1.ca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">

  <!-- Global Menu -->
  <script type="module" src="/js/global-menu-loader.js"></script>

  <div class="max-w-md mx-auto px-4 py-10">

    <h1 class="text-2xl font-bold mb-3">Join the League</h1>

    <p id="season-info" class="text-sm text-slate-600 mb-5">
      Checking current league season…
    </p>

    <div id="signup-panel" class="space-y-4">
      <button id="join-btn"
              class="w-full bg-sky-600 text-white py-2 rounded text-sm font-semibold">
        Join League
      </button>

      <p id="signup-success" class="hidden text-sm text-emerald-700"></p>
      <p id="signup-error" class="hidden text-sm text-red-600"></p>
    </div>

  </div>

  <script type="module" src="/js/league-signup.js"></script>

</body>
</html>
