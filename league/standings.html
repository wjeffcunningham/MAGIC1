<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Standings · BCWL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">
<script type="module" src="/js/global-menu-loader.js"></script>

<div class="max-w-4xl mx-auto mt-10 bg-white shadow rounded p-6">
  <h1 class="text-2xl font-bold mb-4">League Standings</h1>
  <p id="season-info" class="text-sm text-slate-600 mb-4"></p>

  <table class="w-full text-sm">
    <thead>
      <tr class="border-b">
        <th class="text-left py-2">Player</th>
        <th class="text-right">League Pts</th>
        <th class="text-right">Comp%</th>
        <th class="text-right">GW%</th>
        <th class="text-right">OMW%</th>
        <th class="text-right">Elo</th>
      </tr>
    </thead>
    <tbody id="standings-body"></tbody>
  </table>
</div>

<script type="module" src="/js/standings.js"></script>
</body>
</html>
