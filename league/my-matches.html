<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Matches · BCWL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">

  <script type="module" src="/js/global-menu-loader.js"></script>

  <div class="max-w-4xl mx-auto px-4 py-8 space-y-6">

    <header class="space-y-1 text-center">
      <h1 class="text-2xl font-bold">My League Matches</h1>
      <p id="player-label" class="text-sm text-slate-600"></p>
      <p id="month-label" class="text-xs text-slate-500"></p>
    </header>

    <!-- SCHEDULED -->
    <section class="bg-white border rounded-xl shadow p-4">
      <h2 class="text-lg font-semibold mb-2">Scheduled Matches</h2>
      <p class="text-xs text-slate-500 mb-3">
        Matches assigned for this month that you have not yet reported.
      </p>
      <div id="scheduled-list" class="space-y-3"></div>
    </section>

    <!-- PENDING -->
    <section class="bg-white border rounded-xl shadow p-4">
      <h2 class="text-lg font-semibold mb-2">Reported — Pending Approval</h2>
      <p class="text-xs text-slate-500 mb-3">
        You reported these; an admin will approve them soon.
      </p>
      <div id="pending-list" class="space-y-3"></div>
    </section>

    <!-- COMPLETED -->
    <section class="bg-white border rounded-xl shadow p-4">
      <h2 class="text-lg font-semibold mb-2">Completed Matches</h2>
      <p class="text-xs text-slate-500 mb-3">
        Approved results for this month.
      </p>
      <div id="completed-list" class="space-y-3"></div>
    </section>

    <!-- PAST MONTHS -->
    <section class="bg-white border rounded-xl shadow p-4">
      <h2 class="text-lg font-semibold mb-2">Past Months</h2>
      <p class="text-xs text-slate-500 mb-3">
        All approved league matches from prior months.
      </p>
      <div id="history-list" class="space-y-3"></div>
    </section>

    <p id="load-error" class="text-sm text-red-600 hidden"></p>

  </div>

  <script type="module" src="/js/my-matches.js"></script>
</body>
</html>
