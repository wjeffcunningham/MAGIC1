<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Report Match · magic1.ca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900 pb-20">

  <script type="module" src="/js/global-menu-loader.js"></script>

  <div class="max-w-xl mx-auto p-6 space-y-6">
    <h1 class="text-3xl font-bold text-center">Report a Match</h1>

    <div id="not-logged-in" class="hidden text-red-700 text-center">
      You must be logged in to report matches.
    </div>

    <div id="awaiting" class="hidden text-yellow-700 text-center">
      Your account is awaiting moderator approval.
    </div>

    <div id="report-panel" class="hidden bg-white shadow rounded p-6 space-y-4">

      <!-- Opponent -->
      <div>
        <label class="block mb-1 font-semibold">Opponent</label>
        <select id="opponent-select" class="w-full border rounded p-2"></select>
      </div>

      <!-- Match Type -->
      <div>
        <label class="block mb-1 font-semibold">Match Type</label>
        <select id="match-type" class="w-full border rounded p-2">
          <option value="monthly_pod">League – Monthly Pod (K=24)</option>
          <option value="friendly">League – Friendly (K=16)</option>
          <option value="masters">B.C. Premodern Masters (K=40)</option>
        </select>
      </div>

      <!-- Winner -->
      <div>
        <label class="block mb-1 font-semibold">Winner</label>
        <select id="winner-select" class="w-full border rounded p-2"></select>
      </div>

      <p id="report-error" class="text-red-700 text-sm hidden"></p>
      <p id="report-success" class="text-green-700 text-sm hidden"></p>

      <button id="submit-btn"
        class="bg-sky-700 text-white w-full py-2 rounded font-semibold">
        Submit Match
      </button>
    </div>
  </div>

  <script type="module" src="/js/report-match.js"></script>
</body>
</html>
