<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Report Match · B.C. Premodern Masters</title>

<style>
  body {
    margin: 0;
    padding: 30px 16px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #fff;
    color: #000;
    text-align: center;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    text-align: left;
  }

  h1 {
    font-size: 2.2em;
    margin-bottom: 0.3em;
    text-align: center;
  }

  p {
    font-size: 1.0em;
    line-height: 1.5;
    margin: 0.4em 0;
  }

  form {
    margin-top: 1.2em;
  }

  label {
    display: block;
    font-size: 0.95em;
    font-weight: 600;
    margin: 0.8em 0 0.2em;
  }

  select,
  textarea {
    width: 100%;
    padding: 8px 10px;
    font-size: 1em;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
  }

  textarea {
    min-height: 80px;
  }

  button {
    margin-top: 1.3em;
    padding: 10px 18px;
    font-size: 1.05em;
    font-weight: 700;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .status {
    margin-top: 1em;
    font-size: 0.95em;
  }

  .status.error { color: #b00020; }
  .status.ok { color: #007700; }
</style>
</head>
<body>
<div class="container">
  <h1>Report Match</h1>
  <p>Report completed matches from your current pod.</p>

  <form id="match-form">
    <label for="opponent">Opponent</label>
    <select id="opponent" required>
      <option value="">Loading pod members…</option>
    </select>

    <label for="result">Result</label>
    <select id="result" required>
      <option value="">Select result</option>
      <option value="win_2_0">I won 2–0</option>
      <option value="win_2_1">I won 2–1</option>
      <option value="loss_1_2">I lost 1–2</option>
      <option value="loss_0_2">I lost 0–2</option>
      <option value="draw">Draw</option>
    </select>

    <label for="notes">Notes (optional)</label>
    <textarea id="notes" placeholder="Decks, pod, etc."></textarea>

    <button type="submit" id="submit-btn">Submit Result</button>
    <div id="status" class="status"></div>
  </form>
</div>

<script type="module">
import { supabase } from "/js/supabase.js";

const form = document.getElementById("match-form");
const statusEl = document.getElementById("status");
const submitBtn = document.getElementById("submit-btn");
const opponentSelect = document.getElementById("opponent");

async function requireUser() {
  const { data, error } = await supabase.auth.getUser();
  if (error || !data?.user) {
    window.location.href = "/login.html";
    return null;
  }
  return data.user;
}

async function getActiveSeasonId() {
  const today = new Date().toISOString().slice(0, 10);

  let { data: active, error } = await supabase
    .from("league_seasons")
    .select("id, start_date, end_date")
    .lte("start_date", today)
    .gte("end_date", today)
    .order("start_date", { ascending: true })
    .limit(1);

  if (!error && active && active.length > 0) return active[0].id;

  let { data: upcoming, error: err2 } = await supabase
    .from("league_seasons")
    .select("id, start_date")
    .gt("start_date", today)
    .order("start_date", { ascending: true })
    .limit(1);

  if (!err2 && upcoming && upcoming.length > 0) return upcoming[0].id;

  let { data: recent, error: err3 } = await supabase
    .from("league_seasons")
    .select("id, end_date")
    .order("end_date", { ascending: false })
    .limit(1);

  if (!err3 && recent && recent.length > 0) return recent[0].id;

  return null;
}

async function getPlayerByEmail(email) {
  const { data, error } = await supabase
    .from("players")
    .select("id, full_name")
    .eq("email", email.toLowerCase())
    .maybeSingle();

  if (error) throw error;
  return data;
}

async function ensureActiveLeague(playerId) {
  const { data: signups, error } = await supabase
    .from("league_signups")
    .select("status, signup_date")
    .eq("player_id", playerId)
    .order("signup_date", { ascending: true });

  if (error) throw error;

  if (!signups || signups.length === 0) {
    statusEl.textContent = "You are not signed up for the league.";
    statusEl.classList.add("error");
    return false;
  }

  const latest = signups[signups.length - 1];
  if (latest.status !== "active") {
    statusEl.textContent = "Your league signup is not active yet (likely pending approval).";
    statusEl.classList.add("error");
    return false;
  }

  return true;
}

async function getCurrentMonth(seasonId) {
  const today = new Date().toISOString().slice(0, 10);

  const { data, error } = await supabase
    .from("league_months")
    .select("id, name, start_date, end_date")
    .eq("season_id", seasonId)
    .lte("start_date", today)
    .gte("end_date", today)
    .maybeSingle();

  if (error) throw error;
  return data;
}

async function getPlayersPodForMonth(playerId, monthId) {
  const { data: pods, error: podsErr } = await supabase
    .from("pods")
    .select("id, name")
    .eq("month_id", monthId);

  if (podsErr) throw podsErr;
  if (!pods || pods.length === 0) return null;

  const podIds = pods.map(p => p.id);

  const { data: memberships, error: memErr } = await supabase
    .from("pod_members")
    .select("pod_id, player_id")
    .in("pod_id", podIds);

  if (memErr) throw memErr;

  const myMembership = memberships.find(m => m.player_id === playerId);
  if (!myMembership) return null;

  const myPodId = myMembership.pod_id;
  const pod = pods.find(p => p.id === myPodId);
  const podMembers = memberships.filter(m => m.pod_id === myPodId);

  return { podId: myPodId, pod, podMembers };
}

async function loadPodOpponents() {
  statusEl.textContent = "Loading pod information…";

  const user = await requireUser();
  if (!user) return;

  let player;
  try {
    player = await getPlayerByEmail(user.email || "");
  } catch (e) {
    console.error(e);
    statusEl.textContent = "Error loading player record.";
    statusEl.classList.add("error");
    return;
  }

  if (!player) {
    statusEl.textContent = "No player profile. Join the league first.";
    statusEl.classList.add("error");
    return;
  }

  const activeOk = await ensureActiveLeague(player.id);
  if (!activeOk) return;

  const seasonId = await getActiveSeasonId();
  if (!seasonId) {
    statusEl.textContent = "No league season configured.";
    statusEl.classList.add("error");
    return;
  }

  let month;
  try {
    month = await getCurrentMonth(seasonId);
  } catch (e) {
    console.error(e);
    statusEl.textContent = "Error loading league month.";
    statusEl.classList.add("error");
    return;
  }

  if (!month) {
    statusEl.textContent = "No active league month found.";
    statusEl.classList.add("error");
    return;
  }

  let podInfo;
  try {
    podInfo = await getPlayersPodForMonth(player.id, month.id);
  } catch (e) {
    console.error(e);
    statusEl.textContent = "Error loading pod assignment.";
    statusEl.classList.add("error");
    return;
  }

  if (!podInfo) {
    statusEl.textContent = "You are not assigned to a pod for this month.";
    statusEl.classList.add("error");
    return;
  }

  const memberIds = podInfo.podMembers.map(m => m.player_id);

  const { data: podPlayers, error: pErr } = await supabase
    .from("players")
    .select("id, full_name")
    .in("id", memberIds);

  if (pErr) {
    console.error(pErr);
    statusEl.textContent = "Error loading pod members.";
    statusEl.classList.add("error");
    return;
  }

  const others = (podPlayers || []).filter(p => p.id !== player.id);

  if (others.length === 0) {
    opponentSelect.innerHTML = `<option value="">No opponents in your pod yet.</option>`;
    statusEl.textContent = "No pod opponents found.";
    return;
  }

  opponentSelect.innerHTML = `
    <option value="">Select opponent</option>
    ${others.map(o => `<option value="${o.id}">${o.full_name}</option>`).join("")}
  `;

  window.__matchContext = {
    playerId: player.id,
    monthId: month.id,
    podId: podInfo.podId
  };

  statusEl.textContent = "";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  statusEl.textContent = "";
  statusEl.className = "status";
  submitBtn.disabled = true;

  const ctx = window.__matchContext;
  if (!ctx) {
    statusEl.textContent = "Pod context missing. Reload the page.";
    statusEl.classList.add("error");
    submitBtn.disabled = false;
    return;
  }

  const opponentId = opponentSelect.value;
  const result = document.getElementById("result").value;
  const notes = (document.getElementById("notes").value || "").trim();

  if (!opponentId || !result) {
    statusEl.textContent = "Select opponent and result.";
    statusEl.classList.add("error");
    submitBtn.disabled = false;
    return;
  }

  let winnerId = null;
  let resultNote = "";

  switch (result) {
    case "win_2_0":
      winnerId = ctx.playerId;
      resultNote = "Result: 2–0";
      break;
    case "win_2_1":
      winnerId = ctx.playerId;
      resultNote = "Result: 2–1";
      break;
    case "loss_1_2":
      winnerId = opponentId;
      resultNote = "Result: 1–2";
      break;
    case "loss_0_2":
      winnerId = opponentId;
      resultNote = "Result: 0–2";
      break;
    case "draw":
      winnerId = ctx.playerId; // or null, but schema requires winner
      resultNote = "Result: Draw (winner TBD)";
      break;
  }

  const combinedNotes = resultNote + (notes ? " — " + notes : "");

  const { error } = await supabase
    .from("league_matches")
    .insert({
      pod_id: ctx.podId,
      month_id: ctx.monthId,
      player_a: ctx.playerId,
      player_b: opponentId,
      winner: winnerId,
      notes: combinedNotes,
      approved: false,
      reported_by: ctx.playerId
    });

  if (error) {
    console.error(error);
    statusEl.textContent = "Error submitting match.";
    statusEl.classList.add("error");
    submitBtn.disabled = false;
    return;
  }

  statusEl.textContent = "Match submitted for approval.";
  statusEl.classList.add("ok");
  submitBtn.disabled = false;
  form.reset();
});

loadPodOpponents();
</script>
</body>
</html>
