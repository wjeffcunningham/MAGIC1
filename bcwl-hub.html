<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BC Winter League Hub · magic1.ca</title>

<style>
  body { margin:0; background:#f4f6ff; font-family:-apple-system, BlinkMacSystemFont, sans-serif; }
  .shell {
    max-width:800px;
    margin:80px auto;
    padding:20px;
    background:#fff;
    border-radius:12px;
    border:2px solid #000;
  }
  h1 { margin-bottom:6px; }
  .muted { opacity:0.7; }
  .btn {
    display:inline-block;
    padding:10px 16px;
    border-radius:8px;
    border:1px solid #111;
    background:#000; color:#fff;
    text-decoration:none;
    margin-top:10px;
  }
  .section { margin-top:30px; }
</style>
</head>

<body>
<div class="shell">

  <h1>BC Winter League Hub</h1>
  <p class="muted">Premodern · $20/month · January 2026</p>
  <a href="bcwl-poster.html" class="btn">View BCWL Poster →</a>

  <div id="not-logged" class="section" style="display:none;">
    <p>You must be logged in to view the league hub.</p>
  </div>

  <div id="not-approved" class="section" style="display:none;">
    <p>Your account is pending approval. You will gain access once approved.</p>
  </div>

  <div id="not-joined" class="section" style="display:none;">
    <p>You are not yet enrolled in the BCWL season.</p>
    <button id="join-btn" class="btn">Join the League ($20)</button>
  </div>

  <div id="hub-main" class="section" style="display:none;">
    <h2>Welcome to the League</h2>
    <p>Your membership is active.</p>

    <div id="payment-status"></div>
  </div>

</div>

<script type="module" src="/js/db.js"></script>
<script type="module" src="/js/global-menu-loader.js"></script>
<script type="module" src="/js/bcwl-hub.js"></script>
</body>
</html>
