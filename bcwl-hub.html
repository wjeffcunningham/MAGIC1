<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BC Winter League Hub · magic1.ca</title>

<style>
  body {
    margin:0;
    background:#f5f5ff;
    font-family:-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  .shell {
    max-width:800px;
    margin:80px auto;
    padding:24px 20px 30px;
    background:white;
    border:2px solid black;
    border-radius:16px;
  }
  h1 { text-align:center; margin-bottom:6px; }
  h2 { font-size:1.2rem; margin-top:24px; }
  h3 { font-size:1rem; margin-top:16px; }

  .muted { opacity:0.7; font-size:0.9rem; }

  .btn {
    padding:8px 14px;
    border-radius:10px;
    border:1px solid #111;
    background:#eee;
    cursor:pointer;
    font-size:0.95rem;
  }
  .btn.primary {
    background:#000;
    color:#fff;
  }

  .list {
    border:1px solid #ccc;
    padding:10px;
    border-radius:8px;
    background:#fafafa;
    margin-top:8px;
  }
  .list-row {
    padding:4px 0;
    display:flex;
    justify-content:space-between;
    gap:8px;
    align-items:center;
    font-size:0.95rem;
  }
  .pill {
    display:inline-block;
    padding:2px 8px;
    border-radius:999px;
    border:1px solid #000;
    font-size:0.8rem;
    margin-right:6px;
  }
</style>
</head>
<body>

<div class="shell">
  <h1>B.C. Winter League Hub</h1>
  <p class="muted">Premodern · January–March 2026 · BCWL2026</p>
  <p><a href="/index.html?poster=2" class="btn">View BCWL Poster →</a></p>

  <div id="not-logged">
    <p>Please sign in first.</p>
  </div>

  <div id="hub" class="hidden">

    <h2>Your Status</h2>
    <p><strong id="user-name"></strong></p>
    <button class="btn primary" id="join-btn">Join the League ($20/month)</button>
    <button class="btn" id="leave-btn">Leave League</button>
    <p id="join-status" class="muted"></p>

    <div id="admin-section" class="hidden">
      <h2>Admin Tools</h2>

      <h3>Pending Sign-ups</h3>
      <div id="pending-list" class="list"></div>

      <h3>Approved Players</h3>
      <p class="muted"><strong><span id="player-count">0</span> players</strong></p>
      <div id="player-list" class="list"></div>
    </div>

  </div>
</div>

<script type="module" src="/js/config.js"></script>
<script type="module" src="/js/db.js"></script>
<script type="module" src="/js/global-menu-loader.js"></script>
<script type="module" src="/js/bcwl-hub.js"></script>

</body>
</html>
