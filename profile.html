<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile · magic1.ca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">

  <!-- MENU -->
  <script type="module" src="/js/global-menu-loader.js"></script>

  <!-- REQUIRE LOGIN -->
  <script type="module">
    import { requireSession } from "/js/session.js";
    requireSession();
  </script>

  <div class="max-w-xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold mb-6">My Profile</h1>

    <p id="profile-name" class="text-lg font-semibold mb-2"></p>
    <p id="profile-email" class="text-slate-700 mb-4"></p>

    <hr class="my-6" />

    <h2 class="text-xl font-semibold mb-2">Preferences</h2>
    <p class="text-sm text-slate-600 mb-4">(coming soon)</p>
  </div>

  <script type="module">
    import { supabase } from "/js/supabase.js";
    import { getLocalSession } from "/js/session.js";

    const s = getLocalSession();
    const nameEl = document.getElementById("profile-name");
    const emailEl = document.getElementById("profile-email");

    async function loadProfile() {
      const { data } = await supabase
        .from("players")
        .select("full_name, email")
        .eq("id", s.playerId)
        .single();

      nameEl.textContent = data.full_name;
      emailEl.textContent = data.email;
    }

    loadProfile();
  </script>

</body>
</html>
