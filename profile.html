<!DOCTYPE html>
<html>
<head>
  <title>Public Profile · BCWL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="poster" style="max-width:500px;">
  <h1>Public Profile</h1>

  <div id="profile-form">Loading…</div>
  <div id="msg" style="margin-top:20px; font-weight:700;"></div>
</div>

<script type="module">
import { supabase } from "./js/supabase.js";
import { getLocalSession, saveLocalSession } from "./js/session.js";

const form = document.getElementById("profile-form");
const msg = document.getElementById("msg");
const session = getLocalSession();

if (!session) {
  form.innerHTML = "<p>Please log in first.</p>";
  throw "";
}

// Load player
const { data: player, error } = await supabase
  .from("players")
  .select("*")
  .eq("id", session.playerId)
  .single();

if (!player) {
  form.innerHTML = "<p>Error loading profile.</p>";
  throw "";
}

// Build UI
form.innerHTML = `
  <label>Full Name</label><br>
  <input id="full_name" value="${player.full_name || ""}" /><br><br>

  <label>Username</label><br>
  <input id="username" value="${player.username || ""}" /><br><br>

  <label>Home Store</label><br>
  <select id="home_store">
    <option value="stronghold">Stronghold Games</option>
    <option value="connection">The Connection Games</option>
    <option value="freelancer">Freelancer</option>
    <option value="remote_only">Remote Only</option>
  </select>
  <br><br>

  <label>Remote Play Options</label><br>
  <input type="checkbox" id="remote_mtgo"> MTGO<br>
  <input type="checkbox" id="remote_webcam"> Webcam<br><br>

  <button id="save-btn">Save</button>
`;

// Populate values
document.getElementById("home_store").value = player.home_store || "freelancer";
document.getElementById("remote_mtgo").checked = player.remote_mtgo === true;
document.getElementById("remote_webcam").checked = player.remote_webcam === true;

// Save
document.getElementById("save-btn").onclick = async () => {
  msg.textContent = "Saving…";

  const updates = {
    full_name: document.getElementById("full_name").value.trim(),
    username: document.getElementById("username").value.trim(),
    home_store: document.getElementById("home_store").value,
    remote_mtgo: document.getElementById("remote_mtgo").checked,
    remote_webcam: document.getElementById("remote_webcam").checked
  };

  const { error } = await supabase
    .from("players")
    .update(updates)
    .eq("id", player.id);

  if (error) {
    msg.textContent = "Error saving.";
    return;
  }

  saveLocalSession({
    ...session,
    fullName: updates.full_name,
    username: updates.username
  });

  msg.textContent = "Saved!";
};
</script>

</body>
</html>
