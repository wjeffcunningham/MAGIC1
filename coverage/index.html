<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coverage Archive · magic1.ca</title>

<link rel="icon" type="image/svg+xml" href="/assets/BCPMM.svg" />
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/bcpmm-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<style>

/* ===== SAME POSTER LAYOUT ===== */

.poster {
  max-width: 640px;
  margin: 5rem auto 4rem;
  padding: 0 1.5rem;
  text-align: center;
}

.logo-large {
  width: 220px;
  max-width: 90%;
  height: auto;
  margin: 0 auto 20px;
  display: block;
}

h1 {
  font-size: 2.2rem;
  font-weight: 800;
  letter-spacing: 1px;
  margin: 0 0 10px;
  text-transform: uppercase;
}

/* ===== COVERAGE LINKS ===== */

.coverage-links {
  margin-top: 28px;
}

.coverage-links a {
  display: block;
  margin: 16px 0;
  font-size: 1.15rem;
  font-weight: 800;
  text-transform: uppercase;
  text-decoration: none;
  letter-spacing: 0.5px;
  color: inherit;
}

.coverage-links a:hover {
  text-decoration: underline;
}

/* subtle separation */
.coverage-links a span {
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
  display: block;
  font-size: 0.95rem;
  opacity: 0.75;
}

/* ===== GLINT (MATCHED) ===== */

.glint{
  position: relative;
  display: inline-block;
  overflow: hidden;
}

.glint::after{
  content:"";
  position:absolute;
  top:-50%;
  left:-60%;
  width:50%;
  height:200%;
  pointer-events:none;

  background: linear-gradient(
    100deg,
    rgba(0,0,0,0) 0%,
    rgba(120,255,180,0.35) 45%,
    rgba(80,240,140,0.65) 50%,
    rgba(120,255,180,0.35) 55%,
    rgba(0,0,0,0) 100%
  );

  filter: blur(10px);
  opacity: 0;

  transform: translateX(0) skewX(-18deg);
  animation: greenSurge 6s ease-in-out infinite;
}

@keyframes greenSurge{
  0%   { opacity:0; transform:translateX(0) skewX(-18deg); }
  15%  { opacity:0.9; }
  35%  { opacity:1; transform:translateX(220%) skewX(-18deg); }
  50%  { opacity:0; }
  100% { opacity:0; transform:translateX(220%) skewX(-18deg); }
}

</style>
</head>

<body>

<div id="global-menu-root"></div>

<div class="poster">

  <img src="/assets/BCPMM.svg"
       class="logo-large"
       alt="BC Premodern Masters logo" />

  <h1>Coverage Archive</h1>

  <div class="coverage-links">

        <a href="/events/bcpmm2/index.html">
      BCPMM #2 · Brewhall Champs
      <span>April 11, 2026</span>
    </a>

        <a href="https://magic1.ca/bcpmm/BCPMM_coverage.html">
      BCPMM #1 · Secret Masters
      <span>January 10, 2026</span>
    </a>

  </div>

</div>

<script src="/js/bcpmm-shell.js"></script>

</body>
</html>
